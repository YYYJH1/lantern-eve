name: CI

# The public repository runs all three jobs on main pushes and pull requests. The weekly run checks
# Chromium on its own. Use Run workflow to run all three jobs in a fork.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    if: ${{ github.event_name != 'schedule' && (github.repository == 'YYYJH1/lantern-eve' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pyodide 314 runs Python 3.14 in the browser.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/check_content.py --check
      - run: uv run python tools/fonts/build.py --check
      - run: uv run pytest -q -n 4

  cross-host:
    name: CPython and Pyodide agree (Node 22, Pyodide 314)
    if: ${{ github.event_name != 'schedule' && (github.repository == 'YYYJH1/lantern-eve' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --prefix tests/cross_host
      - run: uv sync
      # Check the same game step by step in both runtimes, and play a server replay in Pyodide.
      - name: Compare game hashes and replays
        run: |
          set -euo pipefail
          uv run pytest -q -rs -n 4 tests/cross_host tests/host_server/test_host_replay.py | tee cross_host.txt
          if grep -q SKIPPED cross_host.txt; then
            echo "::error::the cross-host tests were skipped"
            exit 1
          fi

  web:
    name: web build and browser tests (Node 22, Chromium, ${{ matrix.group }})
    if: ${{ github.repository == 'YYYJH1/lantern-eve' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Run one list from web/test/groups per runner. The lists balance short UI tests against
        # tests that play through the game. fake-1 also runs the unit tests.
        group: [fake-1, fake-2, fake-3, fake-4, fake-5, real-1, real-2, real-3]
    env:
      # Allow more time for the two-core runner than for a local test.
      LANTERN_TIME_SCALE: "3"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # uv builds the core wheel the page loads, and the replay checks run the core in CPython.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build both variants. Run real-game specs in series to keep timing checks stable.
      - run: npm run build && npm run build:e2e
      - run: npx playwright test --project=unit
        if: matrix.group == 'fake-1'
      - name: Run browser tests for ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "${{ matrix.group }}" in
            fake-*) workers=2 ;;
            *) workers=1 ;;
          esac
          files=$(sed 's|^|test/e2e/|' "test/groups/${{ matrix.group }}.txt")
          npx playwright test --project=chromium --workers="$workers" $files
      # Keep screenshots, page context and replays from failures for one week.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-results-${{ matrix.group }}
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
