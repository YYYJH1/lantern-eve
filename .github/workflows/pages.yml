name: Pages

# Publish the web client from main in YYYJH1/lantern-eve. In the repository's Pages settings,
# choose GitHub Actions as the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Finish the current deployment before the newest waiting run starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site (Node 22, uv)
    if: ${{ github.repository == 'YYYJH1/lantern-eve' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # uv builds the core wheel the page loads.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      # Package the core, Pyodide, and dependency licences with the production build.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: ${{ github.repository == 'YYYJH1/lantern-eve' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
