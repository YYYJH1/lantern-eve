[project]
name = "lantern-eve"
version = "0.2.0"
description = "Five days to a lantern festival in a river town: follow a rumour from person to person and set it straight."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jiahao You" }]
requires-python = ">=3.12"
dependencies = ["lantern-core", "aiohttp>=3.12", "pyyaml>=6"]

[project.urls]
Homepage = "https://yyyjh1.github.io/lantern-eve/"
Source = "https://github.com/YYYJH1/lantern-eve"

[project.scripts]
lantern-eve = "lantern_eve.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "hypothesis>=6.100", "ruff>=0.6", "pydantic>=2.7", "pyyaml>=6", "fonttools[woff]>=4.50"]

[tool.uv.workspace]
members = ["core"]

[tool.uv.sources]
lantern-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host_server/lantern_eve"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core", "host_server", "tools", "tests"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lantern_core", "lantern_eve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"
