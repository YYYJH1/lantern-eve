# How long the acts of the manager take, in game minutes. In a conversation the world stands still
# while the player reads, looks at the notebook or waits for a model. When the player does one of the
# five things below, the person answers first, and then the world runs this long (fast, so that the
# player sees the hour go by) and holds again if the conversation is still open. Speaking in public
# is the same, outside a conversation. The person who has to go for their next entry in the routine
# goes when the clock reaches it, whatever the act was.
act_minutes:
  ask: 10
  ask_source: 10
  tell: 15
  entrust: 20
  promise: 20
  speak: 30

# What people promise the manager to bring (`commitments` and `site` of the frame, `commitments.py`).
# A person who agrees to carry goods to the bridge promises a batch of them for a time, and carries
# it then. The words are templates: a template is filled for each language with the names of the
# people, the items and the places in that language, an item in lower case in English.
#
# `batches`: how much of an item a first promise is for. An item that is not listed is promised
# whole, as much as the bridge needs; a later promise is for what the bridge still lacks, up to the
# same amount.
# `due`: when a promise falls due, from the hour of the game clock (06 to 21) it was made at. Made
# before `cutoff` it falls due the same day, `soon` hours later (on the hour: 10:20 is due at 13:00).
# Made at `cutoff` or after, it falls due the next day at `late` o'clock.
# `start`: the hour of the day a promise falls due at which the person sets out, or at once if that
# hour has passed. `grace`: a promise that has not been kept this many hours after it fell due is
# broken. `recap_hour`: the hour of each morning, from the second day, at which the recap of the
# day before is made.
# `what`: the words of a promise in the frame. `reasons`: why a promise was broken or taken back.
# `recap`: the lines of the recap, at most one of each, made only from the events of the day before.
commitments:
  batches: {bamboo: 4}
  due: {cutoff: 15, soon: 2, late: 7}
  start: 6
  grace: 3
  recap_hour: 7
  what:
    zh: "把{amount}根{item}送到{place}"
    en: "Bring {amount} poles of {item} to the {place}"
  reasons:
    rain: {zh: 下大雨，货运不出来, en: The heavy rain kept the goods off the road}
    failed: {zh: 路上出了岔子，货没能送到, en: Something went wrong and the goods did not get there}
    late: {zh: 没能赶在期限前送到, en: It did not arrive in time}
    taken_back: {zh: 对方把应承收了回去, en: They took the promise back}
  recap:
    delivery:
      zh: "{who}答应的{amount}根{item}，已经送到{place}。"
      en: "The {amount} poles of {item} that {who} promised have reached the {place}."
    withdrawn:
      zh: "{who}撤回了阻拦：{what}"
      en: "{who} no longer stands in the way: {what}"
    withdrawn_plain:
      zh: "{who}撤回了阻拦。"
      en: "{who} no longer stands in the way."
    clarified:
      zh: "你当众指出那句话说过了头，{names}听后改了口。"
      en: "You said in public that the claim went too far, and {names} changed their minds."
    promise:
      zh: "{who}答应送来{amount}根{item}。"
      en: "{who} promised to bring {amount} poles of {item}."

# The Town Gazette of each morning and the summary of each night (`gazette` and `night` of the
# frame, `gazette.py`; the table below is called `paper`). The gazette is the recap grown: at the
# hour of the recap, from the second day, one headline and up to two short items, made from the
# events of the day before (the delivery, the stance and the promise lines of the recap, which
# carry their own words) and from what the town saw in public (the flags of the festival, a
# statement, the helpers who joined, the sky); then what is to be done today, and one or two lines
# of street talk. The summary of each night is the same machinery over the day that is ending.
# Only these words are the script's; the rest of the card is the page's.
#
# `when`: yesterday, for the Town Gazette of the morning, and today, for the summary of the night.
# `news`: a line for each kind of public thing; `{place}` is a place, `{named}` and `{accepted}`
# the people at a statement, `{n}` the helpers who joined, `{hours}` and `{left}` the hours of work
# done and still to do, `{why}` the reason the work stopped (the words of the board), and
# `{when}` is `when`.
# `street`: when the street talks of the festival and of the two families, from the townsfolk
# without names (`crowd`). `warm` and `cool`: of the 200 townsfolk, how many are keen for the
# festival (enthusiasm 60 or more, the number the side panel counts the turnout from) for the
# street to be warm, and below which it is cool. `swing`: a change of this many keen since the
# last morning is the street warming or cooling. `camp`: a townsperson is on a family's side at
# this many points from the middle of the lean (-100 the Li, 100 the Zhou). `side`: the larger
# camp is the street's side when it is this many people larger. `split`: two camps of at least this
# many, and no side, is a split street. `lean_swing`: a change of this many in the difference of
# the camps since the last morning is the street turning to a side. `fresh`: for this many days a
# thing the town saw in public (the truth told, the families at peace) is what the street talks of.
# `talk`: the lines of the street, one of the festival and at most one of the families.
paper:
  when:
    morning: {zh: 昨天, en: yesterday}
    night: {zh: 今天, en: today}
  street:
    warm: 50
    cool: 30
    swing: 8
    camp: 30
    side: 30
    split: 50
    lean_swing: 12
    fresh: 2
  news:
    bridge_mended:
      zh: 石桥修好了，两岸又通了。
      en: The Stone Bridge is mended, and the two banks are joined again.
    truth_told:
      zh: 桥是怎么坏的，已经当众说清，在场的人都听到了。
      en: How the bridge broke has been told in public, and everyone there heard it.
    reconciled:
      zh: 李周两家的当家人同了席，两家和好了。
      en: The heads of the Li and Zhou families sat at one table, and the two families have made peace.
    statement:
      zh: "你在{place}当众陈述，{named}位有名有姓的人在场，{accepted}位接受。"
      en: "You made your statement in public at the {place}. {accepted} of the {named} named people there accepted it."
    statement_refused:
      zh: "你在{place}当众陈述，{named}位有名有姓的人在场，没有人接受。"
      en: "You made your statement in public at the {place}, and none of the {named} named people there accepted it."
    evidence:
      zh: "你在{place}当众出示了手里的证据，{named}位有名有姓的人在场，{accepted}位接受。"
      en: "You showed what you hold in public at the {place}. {accepted} of the {named} named people there took it in."
    evidence_refused:
      zh: "你在{place}当众出示了手里的证据，{named}位有名有姓的人在场，没有人接受。"
      en: "You showed what you hold in public at the {place}, and none of the {named} named people there took it in."
    meal:
      zh: 两家的当家人同席吃了饭，旁人都看见了。
      en: The heads of the two families shared a meal, and others saw it.
    stopped:
      zh: "{who}当着众人，不再说对方家的不是了。"
      en: "{who} has stopped speaking ill of the other family in public."
    side_by_side:
      zh: 两家的人一同在桥边干活。
      en: People of both families worked at the bridge together.
    helpers:
      zh: "{n}位乡亲答应来桥边帮手。"
      en: "{n} more of the town agreed to help at the bridge."
    work_stopped:
      zh: "桥边的活停了。{why}。"
      en: "Work at the bridge stopped. {why}."
    work:
      zh: "桥边已经干了{hours}个钟头，还差{left}个。"
      en: "{hours} hours of work are done at the bridge, and {left} more are needed."
    rain_heavy:
      zh: "{when}落了一场大雨，街上行人稀少。"
      en: "Heavy rain fell {when}, and the streets emptied."
    rain_light:
      zh: "{when}飘了一阵小雨。"
      en: "It drizzled {when}."
    quiet:
      zh: "{when}镇上没有什么大事。"
      en: "Nothing much happened in town {when}."
    two_accounts:
      zh: "街上有两种说法：一说{first}，一说{second}。"
      en: "The street has two stories. Some say that {first}, and others say that {second}."
  talk:
    festival_up:
      zh: 街上盼灯会的人比昨天多了，孩子们追着问什么时候挂灯。
      en: More people on the street look forward to the festival than yesterday, and the children keep asking when the lanterns go up.
    festival_down:
      zh: 街上盼灯会的人比昨天少了，茶馆里提起灯会的也不多。
      en: Fewer people on the street look forward to the festival than yesterday, and the teahouse hardly mentions it.
    festival_warm:
      zh: 街上都在说灯会，哪家挂几盏灯，已经有人在数了。
      en: The street talks of little else than the festival, and people are already counting the lanterns at each door.
    festival_mixed:
      zh: 街上有人盼着灯会，也有人说再看看。
      en: Some on the street look forward to the festival, and others want to wait and see.
    festival_cool:
      zh: 街上提起灯会的人不多，都说今年怕是没什么兴致。
      en: Hardly anyone on the street speaks of the festival, and people say there is little heart for it this year.
    peace:
      zh: 街上都在说，李周两家的当家人坐到一张桌上去了。
      en: The street is saying that the heads of the Li and Zhou families have sat down at one table.
    talked_out:
      zh: 街上的人还在议论当众说清的那件事，旧话少有人再提。
      en: The street is still talking about what was set out in public, and the old stories are heard less.
    li_more:
      zh: 街上向着李家说话的人，比昨天又多了些。
      en: More people on the street than yesterday are speaking up for the Li family.
    zhou_more:
      zh: 街上向着周家说话的人，比昨天又多了些。
      en: More people on the street than yesterday are speaking up for the Zhou family.
    li_side:
      zh: 街上向着李家说话的人多些。
      en: More people on the street speak up for the Li family than for the Zhou family.
    zhou_side:
      zh: 街上向着周家说话的人多些。
      en: More people on the street speak up for the Zhou family than for the Li family.
    split:
      zh: 街上分成了两拨，一拨向着李家，一拨向着周家，谁也说不服谁。
      en: The street has split into two camps, one for the Li family and one for the Zhou family, and neither can win the other over.
    # who went about the day before, by kind (the errands the people chose in the night, done in
    # public): nothing is said of who, or of what they had in mind
    walk_look:
      zh: 昨天有人特地去桥边看了看。
      en: Some people made a point of going down to look at the bridge yesterday.
    walk_call:
      zh: 昨天街坊之间走动得多些，有人专程登门说话。
      en: There was more coming and going between neighbours yesterday, and some called on one another to talk.
    walk_hand:
      zh: 昨天有人到桥边搭了把手。
      en: Some people lent a hand at the bridge yesterday.

# How two kinds of note stand to each other, shown on the notebook from the start so that the player
# sees the first judgement made before they make one themselves (the tutorial's demonstration). A
# note of `a` is the evidence and a note of `b` the claim: here "Li Er was at the bridge" does not
# show that Li Er, or his family, broke the rail, whichever way the story went on. The relation is
# shown on the claim, once the manager has one note of each side. Every other mark of the notebook is
# one the player has judged right.
tutorial_relations:
  - {a: [pr_liner_at_bridge], b: *rumour, relation: unsupported}

# Whom a person who knows nothing of what the manager asks, and has heard nobody speak of it, sends
# the manager to instead: the people in town who keep up with everything said, the first of these
# who is not the one asked.
hubs: [cha_laoban]

# The statement card (the player's side is `world/bridge/statement.py`). The manager states how the bridge
# broke in three parts, each chosen from a closed list that is the same in every variant, so that a list
# gives nothing away. An option is shown once the manager holds a note that bears on it: a note of one of
# its `supports` props bears for it and a note of one of its `against` props bears against it, and the card
# counts them. `right` names the variants in which the option is the right one, so each part has exactly
# one right option in each variant. `claims` are the props the option states (a cause always states
# who or what broke the rail), which those who accept the statement come to believe. Nothing found for real is against the right option of its variant (checked by
# the build). `opens` is the first moment of the public meeting at which a full statement may be made.
statement:
  opens: {day: 4, hour: 17}
  parts:
    - id: cause
      title: {zh: 成因, en: Cause}
      options:
        - id: boat
          text: {zh: 老何夜里撑船，船头撞断了栏杆, en: "Boatman He's boat struck the rail in the night"}
          right: [v_boat]
          claims: [pr_boat_damaged]
          supports: [pr_boat_damaged, pr_boat_scratched, pr_he_repaired, pr_he_under_bridge]
          against: [pr_flood_damaged, pr_dalang_damaged, pr_he_home, pr_dalang_at_bridge]
        - id: flood
          text: {zh: 秋汛的水头冲松了旧榫，栏杆自己断了, en: "The flood water loosened the old joints and the rail gave way by itself"}
          right: [v_flood]
          claims: [pr_flood_damaged]
          supports: [pr_flood_damaged, pr_flooded]
          against: [pr_boat_damaged, pr_dalang_damaged, pr_he_under_bridge, pr_dalang_at_bridge]
        - id: drunk
          text: {zh: 周家大郎喝醉了酒，一脚踢断了栏杆, en: "Zhou Dalang, drunk, kicked the rail down"}
          right: [v_drunk]
          claims: [pr_dalang_damaged]
          supports: [pr_dalang_damaged, pr_dalang_at_bridge, pr_dalang_drank]
          against: [pr_boat_damaged, pr_flood_damaged, pr_dalang_at_home, pr_he_under_bridge]
        - id: li_er
          text: {zh: 李二下手弄断了栏杆, en: "Li Er broke the rail"}
          right: []
          claims: [pr_liner_damaged]
          supports:
            - pr_liner_damaged
            - pr_li_damaged
            - pr_liner_damaged_on_purpose
            - pr_li_damaged_on_purpose
            - pr_liner_damaged_jealous
            - pr_li_damaged_jealous
            - pr_liner_at_bridge
          against: [pr_liner_looking, pr_set_straight, pr_boat_damaged, pr_flood_damaged, pr_dalang_damaged]
    - id: course
      title: {zh: 经过, en: Course}
      options:
        - id: boat_night
          text: {zh: 老何夜里撑船从桥下过，船头撞上栏杆，事后悄悄把船修好, en: "Boatman He poled under the bridge in the night, struck the rail, and quietly mended the boat afterwards"}
          right: [v_boat]
          claims: [pr_he_under_bridge, pr_he_repaired]
          supports: [pr_he_under_bridge, pr_he_repaired, pr_boat_damaged, pr_boat_scratched]
          against: [pr_he_home, pr_flood_damaged, pr_dalang_damaged, pr_dalang_at_bridge]
        - id: flood_night
          text: {zh: 夜里水头打上桥，把旧榫冲松，栏杆自己断了，桥上桥下都没有人, en: "The flood water hit the bridge in the night and loosened the old joints, and nobody was on the bridge or under it"}
          right: [v_flood]
          claims: [pr_flood_damaged, pr_he_home, pr_dalang_at_home]
          supports: [pr_flood_damaged, pr_flooded, pr_he_home, pr_dalang_at_home]
          against: [pr_he_under_bridge, pr_dalang_at_bridge, pr_boat_damaged, pr_dalang_damaged]
        - id: drunk_night
          text: {zh: 夜里大郎在酒肆喝醉了，晃到桥上，一脚踢断了栏杆, en: "Zhou Dalang drank at the tavern in the night, staggered onto the bridge and kicked the rail down"}
          right: [v_drunk]
          claims: [pr_dalang_at_bridge, pr_dalang_damaged]
          supports: [pr_dalang_at_bridge, pr_dalang_damaged, pr_dalang_drank, pr_he_home]
          against: [pr_dalang_at_home, pr_he_under_bridge, pr_boat_damaged, pr_flood_damaged]
        - id: li_er_night
          text: {zh: 夜里李二到桥边，下手弄断了栏杆, en: "Li Er went to the bridge in the night and broke the rail"}
          right: []
          claims: [pr_liner_damaged]
          supports: [pr_liner_at_bridge, pr_liner_damaged, pr_li_damaged]
          against: [pr_liner_looking, pr_set_straight, pr_boat_damaged, pr_flood_damaged, pr_dalang_damaged]
    - id: rumour
      title: {zh: 误会缘由, en: How the rumour began}
      options:
        - id: grew
          text: {zh: 周家伙计只看见李二在桥边找掉进水里的灯笼，周掌柜凭旧怨猜成了是李二弄坏的，传来传去又添上了「故意」「嫉妒」, en: "Zhou's Clerk only saw Li Er at the bridge looking for a lantern that fell in the water, Shopkeeper Zhou took an old grudge for proof that Li Er broke it, and the telling added “on purpose” and “jealous”"}
          right: [v_boat, v_flood, v_drunk]
          claims: [pr_set_straight]
          supports: [pr_liner_at_bridge, pr_liner_looking, pr_set_straight]
