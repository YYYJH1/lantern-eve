  - id: w_zhou_dalang_peace
    person: zhou_dalang
    text: {zh: 没人来烦，有一壶酒喝, en: To be left in peace with a jug of wine}
    learned:
      - {kind: event, event: talk_start, where: {npc: zhou_dalang}}
  - id: w_cha_laoban_house
    person: cha_laoban
    text: {zh: 灯会那夜茶馆满座，镇上的新鲜事头一个从茶桌上传出去, en: "A full house on festival night, and every piece of news going out first from the teahouse tables"}
    learned:
      - {kind: event, event: talk_start, where: {npc: cha_laoban}}
  - id: w_gengfu_heard
    person: gengfu
    text: {zh: 夜里看到的事，也能有人听进去, en: To be listened to when speaking of what is seen at night}
    learned:
      - {kind: event, event: talk_start, where: {npc: gengfu}}
  - id: w_old_he_quiet
    person: old_he
    text: {zh: 守着渡船，不被人打扰, en: To be left alone with the ferry}
