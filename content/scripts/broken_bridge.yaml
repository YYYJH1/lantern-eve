          claims: [pr_liner_damaged]
          supports: [pr_liner_at_bridge, pr_liner_damaged, pr_li_damaged]
          against: [pr_liner_looking, pr_set_straight, pr_boat_damaged, pr_flood_damaged, pr_dalang_damaged]
    - id: rumour
      title: {zh: 大家为什么会误会, en: Why people got it wrong}
      options:
        - id: grew
          text: {zh: 周家伙计只看见李二在桥边找灯笼。周掌柜记着旧怨，猜是李二弄坏的。话越传越重，又添上了「故意」「眼红」, en: "Zhou's Clerk only saw Li Er at the bridge looking for a lantern. Shopkeeper Zhou, holding an old grudge, guessed that Li Er broke the railing. The story grew as it went round and picked up “on purpose” and “envy”"}
          right: [v_boat, v_flood, v_drunk]
          claims: [pr_set_straight]
          supports: [pr_liner_at_bridge, pr_liner_looking, pr_set_straight]
          against: []
        - id: seen
          text: {zh: 李二真的弄坏了栏杆，周家伙计亲眼看见了, en: "Li Er really did break the railing, and Zhou's Clerk saw it happen"}
