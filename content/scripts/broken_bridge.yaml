          claims: [pr_he_under_bridge, pr_he_repaired]
          supports: [pr_he_under_bridge, pr_he_repaired, pr_boat_damaged, pr_boat_scratched]
          against: [pr_he_home, pr_flood_damaged, pr_dalang_damaged, pr_dalang_at_bridge]
        - id: flood_night
          text: {zh: 夜里水头打上桥，把旧榫冲松了。栏杆是自己断的，桥上桥下都没有人, en: "The flood water hit the bridge in the night and loosened the old joints. The railing gave way by itself, with nobody on the bridge or under it"}
