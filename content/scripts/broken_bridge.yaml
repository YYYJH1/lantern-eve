        - id: drunk_night
          text: {zh: 周家大郎夜里在酒肆喝醉了。晃到桥上，一脚踢断了栏杆, en: "Zhou Dalang got drunk at the tavern in the night, staggered onto the bridge and kicked the railing down"}
