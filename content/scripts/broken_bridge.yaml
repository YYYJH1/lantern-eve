wants:
  - id: w_elder_lantern
    person: zuzhang
    text: {zh: 五天后，让李、周两家一起提灯过桥, en: "In five days, both families crossing the bridge with their lanterns, together"}
  - id: w_li_laotai_public
    person: li_laotai
    text: {zh: 有人出来把「李二毁桥」这话当众说清, en: "Someone to set straight, in public, the talk that Li Er wrecked the bridge"}
