# The town of Chengxi (澄溪镇), the map of the scenario `bridge`. A fictional river town.
#
# `rows` is the terrain, one character per cell, x to the right and y down. The legend gives
# each character an id, a Chinese and an English name and the cost of entering it (0 blocks).
# Walkers follow the cheapest route, so streets are cheap and grass is dear.
#
# A place is a named area. Its `rect` is [x, y, w, h]. A `house`-like place also lists the
# `footprints` of its buildings (blocked cells in `rows`). Walkers go to the `door` and to the
# `stands`: person k of the cast stands on cell k mod n of [door, *stands], so a place with
# many visitors spreads them out and nobody has to ask a model where to stand. `indoor` marks
# places that keep off the rain. `cells` lists the cells of an irregular place (the lane).
#
# A barrier is a set of cells that are closed in `rows` and open when the story says so. The
# core simulates the closed town. The lane behind the temple is cut by one: opening the barrier
# turns the lane into a way round that leads from the east road to the end of the main street.
id: bridge_town
zh: 澄溪镇
en: Chengxi Town
legend:
  "~": {id: river, zh: 河水, en: River, cost: 0}
  "=": {id: bridge, zh: 石桥桥面, en: Bridge deck, cost: 1}
  ",": {id: street, zh: 青石街, en: Bluestone street, cost: 1}
  ":": {id: lane, zh: 夹道, en: Lane, cost: 2}
  ".": {id: grass, zh: 草地, en: Grass, cost: 3}
  ";": {id: bank, zh: 河滩, en: Gravel bank, cost: 2}
  "w": {id: pier, zh: 码头栈板, en: Pier planks, cost: 1}
  "#": {id: wall, zh: 墙与树, en: Wall or tree, cost: 0}
  "H": {id: building, zh: 房屋, en: Building footprint, cost: 0}
weather:
