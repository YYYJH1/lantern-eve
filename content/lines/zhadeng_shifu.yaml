# The Lantern Maker, a woman, master of the lantern workshop. Warm and absorbed, she talks of paste,
# bamboo strips, lantern paper and light, cares whether the lanterns will be ready far more than
# about the quarrel of the two families, and calls Li Er, who works at her benches, 二郎.
person: zhadeng_shifu
voice:
  zh: 扎灯坊的女师傅。热心，专注，一开口就是糨糊、竹篾、灯纸和光。两家吵架她不上心，只在乎灯会办不办得好，灯扎不扎得完，今年的主灯亮不亮。不想说就说「我这儿忙着呢，灯要紧」。对总管说「你」。叫李二「二郎」，两人同在扎灯坊做事，叫李家小妹「小妹」，叫船夫老何「老何」。
  en: The woman who is master of the lantern workshop. Warm and absorbed, always on paste, bamboo strips, lantern paper and light. Cares whether the lanterns will be finished and this year's great lantern shines, not about the families' quarrel. When she would rather not say, she says she is busy and the lanterns come first.
call:
  li_er: {zh: 李二, en: Li Er}
  li_xiaomei: {zh: 小妹, en: Xiaomei}
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "呼……灯骨……还没扎好……（睡熟了）", en: "Zzz... the frames... not bound yet... (fast asleep)"}
    - {zh: "唔……主灯亮了……（睡熟了）", en: "Mm... the great lantern's lit... (fast asleep)"}
  busy:
    - {zh: "糨糊还没干，我腾不出手。", en: "The paste isn't dry and I can't spare a hand."}
    - {zh: "我正糊灯面呢，等我糊完这一张。", en: "I'm pasting a lantern face. Let me finish this sheet."}
  timeout:
    - {zh: "灯还等着收尾，我得回去了。", en: "A lantern is waiting for its finishing touches. I have to get back."}
    - {zh: "灯会就在眼前，活儿不等人。", en: "The festival is nearly here and the work won't wait."}
  unknown:
    - {zh: "这个我还真不知道。", en: "That one I really don't know."}
    - {zh: "灯里的事我懂，这个我不懂。", en: "I know what goes into a lantern. This I don't know."}
  evade:
    - {zh: "我这儿忙着呢，灯要紧。", en: "I'm busy here. The lanterns come first."}
    - {zh: "两家的事我不掺和，别问我。", en: "I keep out of the two families' business. Don't ask me."}
  not_said:
    - {zh: "我没讲过，别把话糊到我身上。", en: "I never said it. Don't paste those words on me."}
    - {zh: "这不是我的话。", en: "Those aren't my words, really."}
  not_so:
    - {zh: "不是这样的，你再想想。", en: "It isn't so. Think again."}
    - {zh: "错了，事情不是这么回事。", en: "That's wrong. It didn't go that way."}
  keeper_no:
    - {zh: "咱们不熟，下回再来吧。", en: "We don't know each other. Come again some time."}
    - {zh: "工坊里的东西不给生人看。", en: "What's in the workshop isn't for strangers."}
  took_in:
    - {zh: "好，这话我记下了。", en: "Good, I'll keep that in mind."}
    - {zh: "明白了，多谢你告诉我。", en: "I see. Thanks for telling me."}
  knew:
    - {zh: "这事我早听人说了。", en: "I heard about it a while back."}
    - {zh: "这个我早知道了，坊里都传遍了。", en: "I knew that already. It's all round the workshop."}
  doubted:
    - {zh: "我听来的不是这个样。", en: "What I heard had it another way."}
    - {zh: "听着不对，跟我听到的对不上。", en: "That sounds off. It doesn't match what I heard."}
  caught:
    - {zh: "原来你一直在骗我。往后你说什么，我都不信了。", en: "So you were lying to me all along. I won't believe anything you say now."}
    - {zh: "你骗了我。亏我还给你留了一盏灯。", en: "You lied to me. And I'd saved a lantern for you."}
  deal:
    - {zh: "好，这事就这么扎紧了。", en: "Good, then it's tied tight."}
    - {zh: "行，说定了。灯会上见。", en: "All right, it's settled. See you at the festival."}
  empty:
    - {zh: "光说不扎，灯是不会亮的。", en: "Talk without binding a lantern gives no light."}
    - {zh: "手里什么都没有，光说我不信。", en: "You've nothing in hand. I won't believe mere talk."}
  kept_thanks:
    - {zh: "你说到做到，我记着这份好。", en: "You did as you said, and I'll remember the kindness."}
    - {zh: "多谢你守信，灯会上给你挂盏好灯。", en: "Thanks for keeping your word. I'll hang a good lantern for you at the festival."}
  will_do:
    - {zh: "好，这活我来扎。", en: "Good, I'll make this one."}
    - {zh: "交给我吧，误不了事。", en: "Leave it to me. It won't be late."}
  cannot:
    - {zh: "这忙我帮不上，手里全是灯。", en: "I can't help with that. My hands are full of lanterns."}
    - {zh: "这个我做不到，对不住。", en: "I can't manage that. Sorry."}
  turned_down:
    - {zh: "对不住，这个我答应不了。", en: "Sorry, I can't promise that."}
    - {zh: "这个头我不能点。", en: "That's one I can't nod to."}
  said_already:
    - {zh: "刚才我已经说过了。", en: "I said so a moment ago."}
    - {zh: "说过了，别再问啦。", en: "I've said it. Don't ask again."}
  closed:
    - {zh: "坊里这会儿顾不上，晚些来。", en: "The workshop's too busy just now. Come later."}
    - {zh: "现在不行，等这批灯糊好再来。", en: "Not now. Come back once this batch of lanterns is pasted."}
  needs_nod:
    - {zh: "灯会的事，要族长点头。", en: "Festival business needs the elder's nod."}
    - {zh: "族长还没发话，我这儿不好动。", en: "The elder hasn't spoken yet, so I can't move on it."}
  nothing_to_say:
    - {zh: "我只顾着糊灯，什么也没瞧见。", en: "I was busy pasting lanterns and saw nothing."}
    - {zh: "灯不会说话，我也没什么好说。", en: "A lantern doesn't talk, and I've nothing to say either."}
  testified:
    - {zh: "我讲的，都是自己亲眼看见的。", en: "What I tell you, I saw with my own two eyes."}
    - {zh: "没见到的，我一个字都不说。", en: "What I didn't see, I won't say a word of."}
  too_late:
    - {zh: "天黑透了，明天白天再来。", en: "It's pitch dark. Come in the daytime tomorrow."}
    - {zh: "夜里要守着灯，明早再说。", en: "I have to watch the lanterns tonight. Let's talk in the morning."}
  will_ask:
    - {zh: "好，我去问个明白。", en: "Good, I'll go and find out."}
    - {zh: "我替你跑一趟。", en: "I'll make the trip for you."}
  will_call:
    - {zh: "好，我提着灯去叫大家。", en: "Good. I'll take a lantern and go and call everyone."}
    - {zh: "我去喊人，祠堂里点上灯等着。", en: "I'll go and call them. The lamps will be lit in the hall."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话没当众说清楚，这事我不帮。", en: "Until the rumour is cleared up in public, I won't help with this."}
    - {zh: "闲话不先说清楚，灯都扎不安心。", en: "Until the rumour is cleared, I can't even make lanterns in peace."}
  hard_hc_li_bamboo_rumour:
    - {zh: "镇上都在传那些闲话，你却一声不吭。这忙我不帮。", en: "The whole town is passing that rumour round and you say nothing. I won't help."}
    - {zh: "闲话还在传，总管也不出声。这事我没法答应。", en: "The rumour is still going round and you keep quiet, Manager. I can't agree to this."}
  hard_other:
    - {zh: "这事就别想了。", en: "Put that out of your head."}
    - {zh: "不行，我主意已定。", en: "No. My mind's made up."}
  elder_yes:
    - {zh: "说得明白，我服了。", en: "Clearly put. I'm convinced."}
    - {zh: "你这么一说，我心里亮堂了。", en: "Now you say it like that, it's clear to me."}
  elder_no:
    - {zh: "光这些，还说不通。", en: "On this alone, it doesn't make sense yet."}
    - {zh: "我还没想明白，再等等。", en: "I haven't got it straight yet. Give me time."}
  objection_withdrawn:
    - {zh: "说清了，我不拦了。", en: "It's cleared up. I won't stand in the way."}
    - {zh: "说清楚就好，灯会要紧。", en: "Good that it's cleared up. The festival is what matters."}
  witness_in_public:
    - {zh: "我就看到这些，多的不瞎说。", en: "That's all I saw, and I won't make up more."}
    - {zh: "看见的我说，没看见的不糊弄。", en: "I tell what I saw, and I won't paper over what I didn't."}
  batch_promised:
    - {zh: "成。明早就送到桥边，灯还等着用呢。", en: "Done. It goes to the bridge tomorrow morning, and the lanterns are waiting on it."}
    - {zh: "明天一早送到，扎灯一点不耽误。", en: "It'll be there first thing tomorrow, and the lantern work won't lose a minute."}
  bamboo_arrived:
    - {zh: "竹料到了。修完桥剩下的，给我留几根。", en: "The bamboo's here. Save me a few poles once the bridge is done."}
    - {zh: "料都到桥边了，这下放心了。", en: "It's all at the bridge. That's a weight off my mind."}
  promise_open:
    - {zh: "应下了。{when}把{amount}根{item}送到桥边，灯等着呢。", en: "I said yes. I'll have {amount} poles of {item} at the bridge {when}, and the lanterns are waiting."}
    - {zh: "说好的事忘不了。{amount}根{item}，{when}送到桥边。", en: "I don't forget what's agreed. It's {amount} poles of {item}, at the bridge {when}."}
  goods_enough:
    - {zh: "桥边的{item}够了，别再添了。", en: "There's enough {item} at the bridge. Don't add more."}
    - {zh: "{item}够用了，剩下的留着扎灯。", en: "The {item} is enough, so keep the rest for lanterns."}
  point_heard:
    - {zh: "灯里的事我懂，这个不懂。不过听{name}提起过，去问问吧。", en: "I know lanterns, not this. But I heard {name} mention it, so go and ask."}
    - {zh: "这事我没留意，手里的灯顾不过来。{name}好像知道，你去问问。", en: "I didn't notice, with all these lanterns on my hands. I think {name} knows, so go and ask."}
  point_hub:
    - {zh: "我只管糊灯，不管闲话。镇上的消息，找{name}吧。", en: "I only paste lanterns and mind no gossip. For news of the town, see {name}."}
    - {zh: "这个我答不上来。茶馆里人来人往，你去问问{name}。", en: "I can't answer that. Folk come and go at the teahouse, so ask {name}."}
  gift_like:
    - {zh: "{item}啊，这个好。正用得着。", en: "Oh, {item}. Just what I can use."}
    - {zh: "给我的？{item}我收下了，谢谢你。", en: "For me? I'll take the {item}. Thank you."}
  gift_neutral:
    - {zh: "{item}啊，放这儿吧。忙完了再吃。", en: "Some {item}. Put them here, I'll eat once I'm done."}
    - {zh: "{item}也好，谢谢你惦记。", en: "Some {item}, that's kind. Thank you for thinking of me."}
  gift_dislike:
    - {zh: "{item}我这儿用不上，灯可不喝这个。", en: "I've no use for {item}. Lanterns don't drink."}
    - {zh: "{item}我不沾，扎灯得手稳。心意我领了。", en: "I don't touch {item}. Lantern work needs a steady hand. Thank you all the same."}
frames:
  seen:
    - {zh: "这是我亲眼瞧见的。{line}。", en: "I saw it myself, right in front of me, that {line}."}
    - {zh: "{line}。我就在边上，看得清清楚楚。", en: "{line}. I was right beside it and saw it clearly."}
  heard:
    - {zh: "{teller}来坊里时提起过。说{line}。", en: "{teller} brought it up at the workshop, saying {line}."}
    - {zh: "我是听{teller}说起的。说是{line}。", en: "{teller} spoke of it to me, and said {line}."}
  unknown:
    - {zh: "张罗灯会的人都在说。说{line}。", en: "Everyone getting the festival ready says {line}."}
    - {zh: "听人闲聊的，谁先说的不晓得。说是{line}。", en: "I heard it in idle talk, and who said it first I couldn't tell you. It was that {line}."}
  own:
    - {zh: "拿我做灯的眼睛看，{line}。", en: "To my lantern maker's eye, {line}."}
    - {zh: "我自己琢磨，{line}。", en: "I've puzzled over it, and I think {line}."}
  guess_own:
    - {zh: "我也说不准。{hedge}{line}。", en: "I can't be certain. {hedge} {line}."}
    - {zh: "还没看真切。{hedge}{line}。", en: "I haven't seen it clearly. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}说得模模糊糊。{hedge}{line}。", en: "{teller} was hazy about it. {hedge} {line}."}
    - {zh: "就凭{teller}那几句话。{hedge}{line}。", en: "Going only on those few words of {teller}'s. {hedge} {line}."}
  guess_unknown:
    - {zh: "说不清是从哪来的。{hedge}{line}。", en: "Nobody can say where it came from. {hedge} {line}."}
    - {zh: "坊里有人提过一句，也没说是谁讲的。{hedge}{line}。", en: "Someone at the workshop mentioned it without saying who from. {hedge} {line}."}
  rival:
    - {zh: "可{teller}讲的是另一个样。说{line}。", en: "But {teller} told it another way, that {line}."}
    - {zh: "{teller}讲的又不一样。说是{line}。", en: "{teller}'s version was cut from different paper, saying {line}."}
  known:
    - {zh: "{line}，这谁都知道。", en: "{line}. Anyone could tell you that."}
    - {zh: "{line}。镇上的人都清楚。", en: "{line}. The town knows it well."}
hedges:
  - {zh: 我估摸着, en: I would think}
  - {zh: 大约, en: I'd say}
