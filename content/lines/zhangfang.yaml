# The Accountant, who keeps the town's common accounts and the repair ledger. Dry and exact: says only
# what the books show, gives a figure where there is one, and has no small talk.
person: zhangfang
voice:
  zh: 账房。只说账上有的，能给数就给数，干巴巴的，不说人情话。在乎钱花在哪，账对不对得上。不想说的就说「账上没有的，我不讲」。对总管说「您」，客气，不热络。
  en: Keeper of the town's accounts. Says only what the books show, gives a figure where there is one, dry, with no small talk. Cares where the money goes and whether the accounts add up. When unwilling to say, answers that what is not in the books is not for telling. Polite to the manager, never warm.
call:
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "呼……三七二十一……对上了……（睡熟了）", en: "Zzz... three sevens, twenty-one... it tallies... (fast asleep)"}
    - {zh: "唔……还差一文……（睡熟了）", en: "Mm... one coin short... (fast asleep)"}
  busy:
    - {zh: "我在对账，您改天再来。", en: "I'm going over the accounts. Come another day."}
    - {zh: "这页账还没算完，现在不能停。", en: "This page isn't added up yet. I can't stop now."}
  timeout:
    - {zh: "时辰到了，账还没核完。", en: "Time's up, and the accounts aren't checked yet."}
    - {zh: "今天的账还没结，我先走了。", en: "Today's accounts aren't closed. I'll be going."}
  unknown:
    - {zh: "账上没有这一笔。", en: "There's no entry for that in the books."}
    - {zh: "这个我不知道，没凭据的事我不说。", en: "I don't know, and I don't speak without something to go on."}
  evade:
    - {zh: "账上的事，我不往外讲。", en: "What's in the books stays in the books."}
    - {zh: "这个不归我说。", en: "That's not mine to tell."}
  not_said:
    - {zh: "这句话不是我说的。", en: "That sentence isn't mine."}
    - {zh: "我没这么说过，我说的是另一句。", en: "I never put it that way. What I said was different."}
  not_so:
    - {zh: "不对，数对不上。", en: "No. The figures don't match."}
    - {zh: "不是这样，得改过来。", en: "That's wrong. It needs correcting."}
  keeper_no:
    - {zh: "账本不给生人看。", en: "The ledger isn't for strangers."}
    - {zh: "我们还不熟，今天不拿出来。", en: "We don't know each other yet. It stays put today."}
  took_in:
    - {zh: "好，我记一笔。", en: "Right, I'll make a note of it."}
    - {zh: "行，知道了。", en: "Fine. Now I know."}
  knew:
    - {zh: "这个我早记着了。", en: "I had that down already."}
    - {zh: "这一条我知道。", en: "I know that one."}
  doubted:
    - {zh: "跟我记的对不上。", en: "That doesn't match my records."}
    - {zh: "不对吧，我听到的不一样。", en: "That's not right. What I heard was different."}
  caught:
    - {zh: "您说的不是实情。往后您的话，我一概不记。", en: "What you told me wasn't true. I won't write down anything you say again."}
    - {zh: "原来您说的是瞎话。往后不信您了。", en: "So it was a lie. I won't trust you again."}
  deal:
    - {zh: "可以，我记上了。", en: "Agreed. It's on the books."}
    - {zh: "成交，这笔我记下。", en: "Done. I'll enter it."}
  empty:
    - {zh: "口说无凭，不算数。", en: "Words without a record don't count."}
    - {zh: "手里没东西，不入账。", en: "Nothing in hand, nothing in the books."}
  kept_thanks:
    - {zh: "您说到做到，账上记着。", en: "You did what you said. It's in the books."}
    - {zh: "说的和做的对得上，我记着。", en: "What you said and what you did match. I'll remember that."}
  will_do:
    - {zh: "行，我来办。", en: "Fine, I'll handle it."}
    - {zh: "好，我去办。回头报个数。", en: "Fine. I'll do it and report the figure."}
  cannot:
    - {zh: "这不归我管。", en: "That's not part of my job."}
    - {zh: "这个我办不了，您找别人。", en: "I can't do it. Find someone else."}
  turned_down:
    - {zh: "这笔钱账上出不来，我不能答应。", en: "The books can't spare the money. I can't agree to it."}
    - {zh: "不成。这个我不答应。", en: "No. I won't agree to this."}
  said_already:
    - {zh: "这个我回过您了。", en: "I've given you my answer already."}
    - {zh: "答过一回了，不说第二遍。", en: "I answered once. I won't say it twice."}
  closed:
    - {zh: "现在不办这个，换个时辰再来。", en: "I'm not doing that now. Come at another hour."}
    - {zh: "这会儿不见客，晚些再来。", en: "I'm not seeing anyone just now. Come back later."}
  needs_nod:
    - {zh: "这得族长点头。", en: "This needs the elder's nod."}
    - {zh: "族长没发话，这笔钱我不能动。", en: "The elder hasn't given the word, so I can't touch this money."}
  nothing_to_say:
    - {zh: "我没看见，说不上什么。", en: "I didn't see it, so I've nothing to say."}
    - {zh: "这事账上没有，我说不上。", en: "It's not in the books, so I can't say."}
  testified:
    - {zh: "我说的，都是亲眼看过的。", en: "Everything I say, I've seen myself."}
    - {zh: "没亲眼看过的，我不说。", en: "I don't say what I haven't seen myself."}
  too_late:
    - {zh: "过了办事的时辰，明早再来。", en: "It's past business hours. Come back in the morning."}
    - {zh: "天晚了，明天再说。", en: "It's late. Tomorrow."}
  will_ask:
    - {zh: "好，我去问一声。", en: "Right, I'll go and ask."}
    - {zh: "我去转告，回话我也记下。", en: "I'll pass it on and write down the reply."}
  will_call:
    - {zh: "好。我挨家去说，都到祠堂来。", en: "Fine. I'll go house to house and tell everyone to come to the hall."}
    - {zh: "我去跟各家说一声。祠堂见。", en: "I'll tell each house. See you at the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言没当众说清，竹料不能动。", en: "Until the rumour is cleared up in public, the bamboo stays where it is."}
    - {zh: "先当众说清，再谈别的。先后不能乱。", en: "Clear it up in public first, then the rest. That's the order."}
  hard_hc_li_bamboo_rumour:
    - {zh: "谣言传遍了全镇，总管到现在一句话没说。这笔我不放。", en: "The rumour has gone all round town and you still haven't said a word, Manager. I won't release this."}
    - {zh: "谣言还在，总管也没个说法。这事我不办。", en: "The rumour stands and you've given no account of it, Manager. I won't do this."}
  hard_other:
    - {zh: "这个没法办。", en: "This can't be done."}
    - {zh: "这一项没得商量。", en: "This item isn't negotiable."}
  elder_yes:
    - {zh: "我算过了，就照这么办。", en: "I've worked it through. Go ahead that way."}
    - {zh: "这么算下来对得上，我没意见。", en: "It adds up that way. I've no objection."}
  elder_no:
    - {zh: "就这几句，我不认。", en: "On these few words alone, I won't accept it."}
    - {zh: "拿不出凭据，我不能信。", en: "Without proof, I can't believe it."}
  objection_withdrawn:
    - {zh: "当众说清了，我不拦了。", en: "It's been cleared up in public. I won't stand in the way."}
    - {zh: "账对清了，我不再拦着。", en: "The accounts are square. I won't block it any more."}
  witness_in_public:
    - {zh: "我只说看见的，账外的事我不管。", en: "I say only what I saw. What's outside the books is not my business."}
    - {zh: "看见一件，就说一件。", en: "One thing seen, one thing said."}
  batch_promised:
    - {zh: "已经记上了，明早送到桥边。", en: "It's entered. It goes to the bridge tomorrow morning."}
    - {zh: "头一批明天上午送到。", en: "The first batch comes tomorrow morning."}
  bamboo_arrived:
    - {zh: "竹料到桥边了，我去点个数。", en: "The bamboo's at the bridge. I'll go and count it."}
    - {zh: "竹料到了，我记上一笔。", en: "The bamboo is here. I'll enter it."}
  promise_open:
    - {zh: "账上记着，{when}交{amount}根{item}到桥边。", en: "It's on the books. I deliver {amount} poles of {item} to the bridge {when}."}
    - {zh: "答应过了，不用再记一遍。{when}送{amount}根{item}过去。", en: "It's agreed already, no need to enter it twice. I send {amount} poles of {item} over {when}."}
  goods_enough:
    - {zh: "账上{item}已经够数，不用再加。", en: "The books show enough {item}. No need for more."}
    - {zh: "{item}满数了，再送就多了。", en: "The {item} is at the full count. Any more would be too much."}
  point_heard:
    - {zh: "账上没有这一条。{name}说起过，您去问问。", en: "That's not in the books. Ask {name}, who spoke of it."}
    - {zh: "这个我不清楚。{name}提起过，您去问吧。", en: "I'm not sure. Go and ask {name}, who brought it up."}
  point_hub:
    - {zh: "账上查不到这个。镇上的事，去问{name}。", en: "The books don't show that. For the town's affairs, ask {name}."}
    - {zh: "这个我查不了。街上的说法，去问{name}。", en: "I can't look that up. For what the street says, ask {name}."}
  gift_like:
    - {zh: "{item}，正用得上。多谢。", en: "Now, {item} I can use. Thank you."}
    - {zh: "{item}，好东西。这份我收下。", en: "Good {item}. I'll accept this."}
  gift_neutral:
    - {zh: "{item}？好，收下了。", en: "Oh, {item}? Fine, accepted."}
    - {zh: "{item}也行。谢谢您。", en: "All right, the {item} will do. Thank you."}
  gift_dislike:
    - {zh: "{item}我用不着。心意我领了。", en: "I've no use for {item}. Thank you for the thought."}
    - {zh: "{item}就不必了。还是谢谢您。", en: "No need for {item}. Thank you all the same."}
frames:
  seen:
    - {zh: "我亲眼看过。{line}。", en: "I saw for myself that {line}."}
    - {zh: "{line}。这是我当场看见的。", en: "{line}. I saw it on the spot."}
  heard:
    - {zh: "这是{teller}的原话，我照记着。说{line}。", en: "I have it from {teller}, word for word, that {line}."}
    - {zh: "{teller}跟我讲过。说是{line}。", en: "{teller} told me, and the words were that {line}."}
  unknown:
    - {zh: "有这么一种说法，谁说的账上没记。说{line}。", en: "There's a story going round, and who told it isn't on record. It goes that {line}."}
    - {zh: "听人讲的，没查过。说是{line}。", en: "I heard it said, though I haven't looked into it, that {line}."}
  own:
    - {zh: "按我算下来，{line}。", en: "By my reckoning, {line}."}
    - {zh: "我前后对过，{line}。", en: "I've checked it end to end, and {line}."}
  guess_own:
    - {zh: "这个查不了。{hedge}{line}。", en: "There's no way to check this. {hedge} {line}."}
    - {zh: "账上看不出来。{hedge}{line}。", en: "The books don't show it. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}漏过一点口风。{hedge}{line}。", en: "{teller} let something slip. {hedge} {line}."}
    - {zh: "我照{teller}的话算了算。{hedge}{line}。", en: "I worked from what {teller} said. {hedge} {line}."}
  guess_unknown:
    - {zh: "谁先说的，查不到。{hedge}{line}。", en: "Who said it first, I can't trace. {hedge} {line}."}
    - {zh: "这话没处查。{hedge}{line}。", en: "There's nowhere to check it. {hedge} {line}."}
  rival:
    - {zh: "{teller}那儿的说法对不上。说{line}。", en: "But {teller}'s account doesn't tally, saying {line}."}
    - {zh: "{teller}说的不一样。说是{line}。", en: "{teller} told it differently, that {line}."}
  known:
    - {zh: "{line}。这个不用查，人人都知道。", en: "{line}. No need to look it up. Everyone knows."}
    - {zh: "{line}，账上也是这么记的。", en: "{line}. The books say so too."}
hedges:
  - {zh: "我估计", en: "I estimate"}
  - {zh: "大概", en: "I presume"}
