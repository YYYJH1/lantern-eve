# Li Da, the eldest Li son and keeper of the bamboo. Steady and practical, short plain sentences,
# loyal to his mother, careful with the stock he is trusted with.
person: li_da
voice:
  zh: 李家长子，管竹料。说话稳当实在，句子短，凡事先想着娘和家里。
  en: The eldest Li son, keeper of the bamboo. Steady and practical, short plain sentences, always mindful of his mother and the house.
lines:
  asleep:
    - {zh: "唔……竹子……码好了……（睡熟了）", en: "Mm... the bamboo... stacked... (fast asleep)"}
    - {zh: "呼噜……别动那捆竹子……（睡熟了）", en: "Snore... leave that bundle alone... (fast asleep)"}
  busy:
    - {zh: "我手上有活。回头再说。", en: "I've got work in hand. Later."}
    - {zh: "总管，这会儿真腾不出手。晚点我去找你。", en: "Manager, I really can't spare a hand right now. I'll come find you later."}
  timeout:
    - {zh: "竹料还没点完。我得回去了。", en: "The bamboo isn't counted yet. I need to get back."}
    - {zh: "活不等人。就到这儿吧。", en: "The work won't wait. That's all for now."}
  unknown:
    - {zh: "这个我真不知道。", en: "I truly don't know about that."}
    - {zh: "没听说过这事。", en: "Never heard of it."}
  evade:
    - {zh: "这事我不好说。", en: "That's not something I can say."}
    - {zh: "别问了。我不想提。", en: "Don't ask. I'd rather not go into it."}
  not_said:
    - {zh: "我可没这么说过。", en: "I never put it that way."}
    - {zh: "这话不是从我嘴里出去的。", en: "Those words didn't come from me."}
  not_so:
    - {zh: "不是这样。", en: "That's not how it is."}
    - {zh: "不对。你记岔了。", en: "No. You've got it mixed up."}
  keeper_no:
    - {zh: "咱们还没熟到那份上。改天吧。", en: "We aren't that familiar yet. Another day."}
    - {zh: "这个我不能随便给外人看。", en: "I can't show this to just anyone."}
  took_in:
    - {zh: "哦。我记下了。", en: "I see. I'll remember that."}
    - {zh: "行，我晓得了。", en: "All right. I've got it."}
  knew:
    - {zh: "这事我早就听说了。", en: "I'd already heard that."}
    - {zh: "我早有数了。", en: "I had it figured already."}
  doubted:
    - {zh: "我听到的不是这样。", en: "That's not what I heard."}
    - {zh: "和我听来的不一样啊。", en: "It's different from what I was told."}
  caught:
    - {zh: "你骗我！往后你说什么我都不信了！", en: "You lied to me! I won't believe anything you say from now on!"}
    - {zh: "好啊，你撒谎！以后别想我再信你！", en: "So you lied! Don't expect me to trust you again!"}
  deal:
    - {zh: "成，就这么办。", en: "All right. That's the deal."}
    - {zh: "行。这事定了。", en: "Fine. That's settled."}
  empty:
    - {zh: "光嘴上说说，我不信。", en: "Just words. I don't believe it."}
    - {zh: "你手里没东西。这话不作数。", en: "You've got nothing in hand. That promise doesn't count."}
  kept_thanks:
    - {zh: "总管守信。这个情我记着。", en: "The Manager keeps their word. I'll remember this."}
    - {zh: "你说到做到了。我们家不会忘。", en: "You did what you said. My family won't forget it."}
  will_do:
    - {zh: "行，这事我来办。", en: "All right. I'll take care of it."}
    - {zh: "好。交给我吧。", en: "Good. Leave it with me."}
  cannot:
    - {zh: "这忙我帮不了。", en: "I can't help with that."}
    - {zh: "这个我做不到。", en: "That's beyond me."}
  turned_down:
    - {zh: "对不住，这个我不能答应。", en: "Sorry, I can't agree to that."}
    - {zh: "抱歉。这事办不了。", en: "Sorry. It can't be done."}
  said_already:
    - {zh: "这话我说过了。", en: "I've said that already."}
    - {zh: "刚说过的。别再问了。", en: "I just said it. Don't ask again."}
  closed:
    - {zh: "这会儿不行。换个时候来。", en: "Not now. Come at another time."}
    - {zh: "现在不方便。过一阵再来。", en: "It's not convenient now. Come back in a while."}
  needs_nod:
    - {zh: "这得先问我娘。", en: "I have to ask my mother first."}
    - {zh: "我娘没点头。我不敢动竹子。", en: "My mother hasn't nodded. I won't touch the bamboo."}
  nothing_to_say:
    - {zh: "这事我没话说。", en: "I've got nothing to say on it."}
    - {zh: "关于这个，我一个字也没有。", en: "On that, I haven't a word."}
  testified:
    - {zh: "我说的都是亲眼看见的。", en: "What I say is what I saw myself."}
    - {zh: "没看见的我不说。看见的我一句不漏。", en: "I don't say what I didn't see. What I saw, I'll tell in full."}
  too_late:
    - {zh: "太晚了。明早再说。", en: "It's too late. Tomorrow morning."}
    - {zh: "天都黑了。明天一早来。", en: "It's dark already. Come in the morning."}
  will_ask:
    - {zh: "行，我去跟对方说。", en: "All right. I'll talk to them."}
    - {zh: "好，这话我去传。", en: "Good. I'll pass that along."}
  will_call:
    - {zh: "好，我这就去喊人到祠堂。", en: "All right. I'll go call folks to the hall now."}
    - {zh: "我去叫大家来祠堂。", en: "I'll fetch everyone to the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言没当众说清楚。我家一根竹子也不能借。", en: "Until the rumour is cleared in public, not a single pole goes out of our house."}
    - {zh: "那桩谣言不澄清。竹子就别想了。", en: "Don't expect bamboo until that rumour is cleared up."}
  hard_hc_li_bamboo_rumour:
    - {zh: "镇上都在说我二弟毁了桥。总管一声不吭，竹子我不借。", en: "The town says my brother broke the bridge. The Manager said nothing, so I won't lend the bamboo."}
    - {zh: "谣言满镇传。总管不出声。娘不点头，我也不借。", en: "The rumour is all over town. The Manager stays silent. Mother has not agreed, and neither do I."}
  hard_other:
    - {zh: "这个免谈。", en: "No point discussing it."}
    - {zh: "不行。别再提了。", en: "No. Don't bring it up again."}
  elder_yes:
    - {zh: "我听明白了。就这样吧。", en: "I follow you. Let it stand."}
    - {zh: "你说的有理。我没意见了。", en: "What you say is fair. I've no objection."}
  elder_no:
    - {zh: "光这些还不够。", en: "That's not enough yet."}
    - {zh: "我还不能就这么信了。", en: "I can't take it on trust just yet."}
  objection_withdrawn:
    - {zh: "事情说清楚了。我不再拦着。", en: "It's been made clear. I won't hold you back any more."}
    - {zh: "娘那边松了口。我这边也没话说。", en: "Mother has relented. I have nothing against it either."}
  witness_in_public:
    - {zh: "我只说我看到的。多的我不知道。", en: "I only say what I saw. I don't know any more than that."}
    - {zh: "看见多少，说多少。", en: "I say as much as I saw."}
  batch_promised:
    - {zh: "答应了，明早送到桥边。", en: "Agreed. It will be at the bridge tomorrow morning."}
    - {zh: "第一批四根，明早送过去。", en: "The first batch, four poles, goes over tomorrow morning."}
  bamboo_arrived:
    - {zh: "竹料送到桥边了。四根，点好了。", en: "The bamboo is at the bridge. Four poles, counted."}
    - {zh: "货到了，你来点一下。", en: "It's here. Come and check it."}
  promise_open:
    - {zh: "应过了。{amount}根{item}，{when}送到桥边。", en: "I agreed already: {amount} poles of {item} to the bridge {when}."}
    - {zh: "这批我答应了。{when}到桥边，{amount}根{item}。", en: "That batch is promised. It's {amount} poles of {item}, at the bridge {when}."}
  goods_enough:
    - {zh: "桥边的{item}够了。不用再送。", en: "The {item} at the bridge is enough. No need to send more."}
    - {zh: "{item}够数了，再送就多了。", en: "The {item} is all there. Any more would be too much."}
  point_heard:
    - {zh: "我不清楚。我听{name}提过这事，你去问问。", en: "I don't know. I heard {name} bring it up, so go and ask."}
    - {zh: "这事我没经手。{name}好像说过，你去找一下。", en: "Not my business. I think I heard {name} say something about it. Ask them."}
  point_hub:
    - {zh: "我不知道。你去问{name}，那边消息多。", en: "I don't know. Ask {name}, who knows what goes round town."}
    - {zh: "这事问我没用。镇上的事，{name}知道得更多。", en: "No use asking me. Try {name}, who knows more of what goes round town."}
frames:
  seen:
    - {zh: "我亲眼看到的：{line}。", en: "I saw it with my own eyes: {line}."}
    - {zh: "这事我在场。{line}。", en: "I was right there: {line}."}
  heard:
    - {zh: "{teller}说的：{line}。", en: "That's from {teller}: {line}."}
    - {zh: "我听{teller}讲过：{line}。", en: "I heard from {teller} that {line}."}
  unknown:
    - {zh: "听说：{line}。", en: "They say that {line}."}
    - {zh: "外头传的：{line}。", en: "What's going around is that {line}."}
  own:
    - {zh: "我看啊：{line}。", en: "As I see it, {line}."}
    - {zh: "照我想：{line}。", en: "My thinking is that {line}."}
  guess_own:
    - {zh: "我不敢打包票。{hedge}{line}。", en: "I wouldn't swear to it. {hedge} {line}."}
    - {zh: "没凭没据的。{hedge}{line}。", en: "I've no proof. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}提过一嘴。{hedge}{line}。", en: "{teller} mentioned it. {hedge} {line}."}
    - {zh: "听{teller}那么一说，{hedge}{line}。", en: "From what {teller} said, {hedge} {line}."}
  guess_unknown:
    - {zh: "不知道谁说的。{hedge}{line}。", en: "Don't know who said it. {hedge} {line}."}
    - {zh: "只是听人讲。{hedge}{line}。", en: "It's only talk I heard. {hedge} {line}."}
  rival:
    - {zh: "不过{teller}说得不一样：{line}。", en: "But {teller} told me otherwise: {line}."}
    - {zh: "{teller}也跟我提过别的：{line}。", en: "{teller} also told me something else: {line}."}
hedges:
  - {zh: 我估摸, en: I figure}
  - {zh: 八成, en: I reckon}
# What he says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. He waits for his mother's nod, so his greeting turns on whether she has given
# it, then on the bamboo he carried and on how the bridge came out.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "你是总管？我是李大，家里的竹料归我管。", en: "You're the Manager? I'm Li Da. I keep the family's bamboo."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你应我的事，没办成。娘问过两回了。", en: "You promised me and it was not done. Mother has asked twice."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚游灯。家里的事，我尽力了。", en: "The parade is tonight. I have done what I could for the house."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥怎么坏的说清了。娘也不用再躲着人。", en: "How the bridge broke is out in the open. Mother need not hide from people now."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥修好了。栏杆里有我家的竹子。", en: "The bridge is mended. Our bamboo is in the rail."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你应的事办了。我记着。", en: "What you promised was done. I'll remember it."}
  - id: bamboo
    when: [{kind: commitment, by: li_da, item: bamboo, state: delivered}]
    lines:
      - {zh: "竹子都点过了，在桥边。还缺多少，你说。", en: "The bamboo is counted and at the bridge. Tell me how much is still short."}
  - id: cleared
    when: [{kind: knows, props: [pr_set_straight]}]
    lines:
      - {zh: "那话说清了，娘才松的口。我听说了。", en: "It was cleared, and only then did Mother give way. I've heard."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来了？说吧。", en: "Back again? Go on."}
      - {zh: "还有什么事？", en: "Anything else?"}
  - id: plain
    lines:
      - {zh: "娘没点头，我什么都不能应。", en: "Mother hasn't nodded, so I can promise nothing."}
      - {zh: "有事先问娘，再来找我。", en: "Ask Mother first, then come to me."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "娘还等着你的话。", en: "Mother is still waiting on your word."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "灯会上见。", en: "See you at the lanterns."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "话说直了，好。", en: "It's been said straight. Good."}
  - id: bamboo
    when: [{kind: commitment, by: li_da, item: bamboo, state: delivered}]
    lines:
      - {zh: "要竹料，再来找我。", en: "Come to me when you need more bamboo."}
  - id: plain
    lines:
      - {zh: "我还得点竹料，先走了。", en: "I have bamboo to count. Off I go."}
      - {zh: "有信儿再来。", en: "Come back when you have news."}
epilogue:
  - id: word_broken
    when: [{kind: promised, state: broken}]
    text: {zh: "李大照旧点着竹料，没再提那句没兑现的话。", en: "Li Da went on counting bamboo and never raised the promise that was not kept."}
  - id: full_kept
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}, {kind: promised, state: kept}]
    text: {zh: "李大扛着最后一根竹竿上了桥。总管答应的那一份，灯会上也给了李大。", en: "Li Da carried the last pole onto the bridge. What the Manager had promised Li Da was given at the festival."}
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "李大扛着最后一根竹竿上了桥。栏杆立起来，李家的灯挂在最前头。", en: "Li Da carried the last pole onto the bridge. The rail went up, and the Li lamp hung at the very front."}
  - id: bridge_peace
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: reconciled}]
    text: {zh: "李大同周家的人并肩过了桥，谁也没提旧账。", en: "Li Da crossed the bridge shoulder to shoulder with the Zhou people, and nobody raised the old account."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "李大守着桥头的竹料垛，看灯从新栏杆边过去。", en: "Li Da stayed by the bamboo stack at the bridgehead and watched the lanterns pass the new rail."}
  - id: detour
    when: [{kind: flag, flag: detour_done}]
    text: {zh: "桥没修成。李大把剩下的竹料挑去夹道，给灯搭了架子。", en: "The bridge was not mended, so Li Da carried the spare bamboo to the lane and built stands for the lamps."}
  - id: apart
    text: {zh: "李大把竹料锁回了库里。李家的灯只在自家院里亮着。", en: "Li Da locked the bamboo back in the store. The Li lamps burned only in the family yard."}
