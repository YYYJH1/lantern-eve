# Granny Li, the head of the Li house. Short sentences with an elder's weight, a sigh now and then;
# fond of her family and never soft in speech. She calls herself an old woman now and then, her sons
# by their place in the family, and the manager by their title.
person: li_laotai
voice:
  zh: "李家的老太太，家里的大事都由她拿主意。话短，一句是一句，有长辈的分量，偶尔叹口气。自称老婆子，但不是句句都带。疼儿孙，嘴上却不软。最在乎老二的名声、李家的脸面，竹料是李家的东西，不轻易松口。不想说的事就一句「这事你别问我，问我也是这句话」。真急了是护着老二：「我家老二不是那种人。」"
  en: "The old lady of the Li house, who settles every big matter in the family. Short sentences, each one meant, with an elder's weight and now and then a sigh. Calls herself an old woman, though not in every sentence. Fond of her children and grandchildren, never soft in speech. Cares most for her second son's good name, the face of the Li house and the bamboo, which is the family's and not lightly lent. What she will not discuss gets one line: don't ask me, you will hear the same answer. Roused, she stands up for her second son: my youngest is not that kind."
call:
  fam_li: {zh: 我们家, en: our family}
  li_da: {zh: 老大, en: my eldest}
  li_er: {zh: 老二, en: my youngest}
  li_xiaomei: {zh: 小妹, en: Xiaomei}
  old_he: {zh: 老何, en: Boatman He}
  zhou_niangzi: {zh: 周家的, en: the Zhou woman}
  zhou_zhanggui: {zh: 周家那个掌柜, en: that Zhou shopkeeper}
lines:
  asleep:
    - {zh: "唔……老二……别出门……（睡熟了）", en: "Mm... my youngest... don't go out... (fast asleep)"}
    - {zh: "呼……竹子……谁也不借……（睡熟了）", en: "Zzz... the bamboo... not to anyone... (fast asleep)"}
  busy:
    - {zh: "这会儿走不开，你过一阵再来。", en: "I can't stop now. Come back in a while."}
    - {zh: "我手上有事。回头再说吧。", en: "I have something to see to. Another time."}
  timeout:
    - {zh: "时候不早了，我得走了。", en: "It's getting on. I have to go."}
    - {zh: "我得走了。有话改天再说。", en: "I must be going. The rest can wait for another day."}
  unknown:
    - {zh: "没听说过。", en: "Not a word of it reached me."}
    - {zh: "这事我不清楚。", en: "That's nothing I know about."}
  evade:
    - {zh: "这事你别问我，问我也是这句话。", en: "Don't ask me about that. You'll hear the same answer every time."}
    - {zh: "不提了。这事我不想说。", en: "Let it be. I'd rather not speak of it."}
  not_said:
    - {zh: "我可没说过这话。", en: "No such word ever passed my lips."}
    - {zh: "这话不是我说的。我只知道这个。", en: "Those weren't my words. This is what I know."}
  not_so:
    - {zh: "哪有这种事。", en: "Nothing of the sort."}
    - {zh: "你听岔了。", en: "You heard it wrong."}
  keeper_no:
    - {zh: "咱们才见过几面，这个不能给你看。", en: "We've met only a few times. I can't show you this."}
    - {zh: "老婆子不给生人看。", en: "I don't show that to strangers."}
  took_in:
    - {zh: "原来是这么回事。", en: "So that's how it was."}
    - {zh: "嗯，你的话我听进去了。", en: "Hm. I've taken in what you said."}
  knew:
    - {zh: "这事我早知道了。", en: "I've known that a while."}
    - {zh: "你不说我也晓得。", en: "You needn't tell me. I knew."}
  doubted:
    - {zh: "我听来的不是这么回事。", en: "That isn't what I was told."}
    - {zh: "这跟我听来的对不上。", en: "That doesn't fit what I heard."}
  caught:
    - {zh: "原来你拿瞎话哄我。往后你的话，我一句也不信。", en: "So you were feeding me lies. I won't believe another word of yours."}
    - {zh: "好啊，连老婆子你也敢骗！", en: "So you'd lie even to an old woman!"}
  deal:
    - {zh: "行，老婆子信你这一回。", en: "Very well. I'll take you at your word this once."}
    - {zh: "那就这么定了。", en: "Then that's settled."}
  empty:
    - {zh: "你手里没有的东西，许了也是白许。", en: "You can't promise what you haven't got."}
    - {zh: "光说不做的话，我听得多了。", en: "I've heard plenty of talk with nothing behind it."}
  kept_thanks:
    - {zh: "你说到做到。老婆子记着你的好。", en: "You did what you said. I won't forget your kindness."}
    - {zh: "答应的事你办了。李家不会忘的。", en: "You did what you promised. The Li house won't forget it."}
  will_do:
    - {zh: "行。这事我应下了。", en: "Very well. I'll agree to it."}
    - {zh: "好，交给我吧。", en: "Good. Leave it with me."}
  cannot:
    - {zh: "这事找我没用，办不了。", en: "No use asking me. It's not in my hands."}
    - {zh: "这个我出不上力。", en: "That's nothing I can lend a hand to."}
  turned_down:
    - {zh: "这事老婆子不能答应。", en: "That I can't agree to."}
    - {zh: "不行，这个我应不了。", en: "No. I can't say yes to that."}
  said_already:
    - {zh: "这话老婆子说过了。", en: "I've said that already."}
    - {zh: "说过一遍了，还是那句话。", en: "I said it once. The answer hasn't changed."}
  closed:
    - {zh: "这会儿不方便，换个时辰来吧。", en: "This isn't a good time. Come at another hour."}
    - {zh: "眼下不是时候。晚些再来。", en: "This isn't the time. Come back later."}
  needs_nod:
    - {zh: "这事老婆子一个人定不了，得先问过族长。", en: "I can't decide that alone. The elder must be asked first."}
    - {zh: "族长不点头，我不敢应。", en: "Without the elder's nod, I won't say yes."}
  nothing_to_say:
    - {zh: "这事我没看见，说不出什么。", en: "I didn't see it, so I've nothing to tell."}
    - {zh: "那晚我早早睡了，什么也没瞧见。", en: "I went to bed early that night and saw nothing."}
  testified:
    - {zh: "老婆子不说虚话，看见什么说什么。", en: "I don't tell tales. I say what I saw."}
    - {zh: "这些都是我亲眼见的。", en: "All of that I saw with my own eyes."}
  too_late:
    - {zh: "天晚了，明早再来吧。", en: "It's late. Come again in the morning."}
    - {zh: "夜深了，明天一早再说。", en: "It's dark now. We'll talk first thing tomorrow."}
  will_ask:
    - {zh: "好，我去替你说一声。", en: "Good. I'll go and put in a word for you."}
    - {zh: "这话我替你带到。", en: "I'll carry the word for you."}
  will_call:
    - {zh: "好，我这就去叫人到祠堂。", en: "Good. I'll go and call people to the hall."}
    - {zh: "我去把人都叫到祠堂。", en: "I'll gather them all at the hall."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话一天不当众说清，李家的竹子一根也不借。", en: "Until that talk is cleared up in front of everyone, not one pole of Li bamboo goes out."}
    - {zh: "先当着大家把话说清楚。不然竹子你别想。", en: "Clear it up in front of everyone first. Until then, forget the bamboo."}
  hard_hc_li_bamboo_rumour:
    - {zh: "满镇都说我家老二弄坏了桥。你这个总管一声不吭，竹子我不借。", en: "The whole town says my youngest broke the bridge. You haven't said a word, Manager, so no bamboo."}
    - {zh: "闲话都落在老二头上了，你一句也不说。竹子不借。", en: "All the talk has landed on my youngest, and you say nothing. No bamboo."}
  hard_other:
    - {zh: "这事不用再提。", en: "There's no point raising it."}
    - {zh: "不行，再提也是不行。", en: "No. Asking again won't change it."}
  elder_yes:
    - {zh: "听明白了。就这么办吧。", en: "I understand it now. Let it be done."}
    - {zh: "你说得在理，我没话说。", en: "You make sense. I've nothing against it."}
  elder_no:
    - {zh: "光凭这几句，我还不能信。", en: "On these few words alone, I can't believe it yet."}
    - {zh: "话还没说透，我再看看。", en: "It hasn't been said fully. I'll wait and see."}
  objection_withdrawn:
    - {zh: "既然当众说清了，我就不拦着了。", en: "Since it's been cleared up in front of everyone, I won't stand in the way."}
    - {zh: "话说清楚了。竹子的事，你去找老大吧。", en: "It's been cleared up. For the bamboo, go and see my eldest."}
  witness_in_public:
    - {zh: "我只说亲眼看见的，别的不添。", en: "I tell only what I saw, and I add nothing."}
    - {zh: "看到多少，我就说多少。", en: "I say as much as I saw."}
  batch_promised:
    - {zh: "好，明早叫老大送到桥边。", en: "Good. My eldest will bring it to the bridge in the morning."}
    - {zh: "竹料我借了，明早送到桥边。", en: "I'll lend the bamboo. It will be at the bridge in the morning."}
  bamboo_arrived:
    - {zh: "竹料到桥边了。我说话算数。", en: "The bamboo is at the bridge. I keep my word."}
    - {zh: "李家的竹子送到了，一根不少。", en: "The Li bamboo is there, every pole of it."}
  promise_open:
    - {zh: "我答应过了，{when}送{amount}根{item}到桥边。", en: "I gave my word already. It's {amount} poles of {item}, at the bridge {when}."}
    - {zh: "说定的事不改。{when}，{amount}根{item}送到桥边。", en: "What's settled stays settled. It's {amount} poles of {item} at the bridge {when}."}
  goods_enough:
    - {zh: "桥边的{item}够用了，我不再添。", en: "There's enough {item} at the bridge. I won't add more."}
    - {zh: "{item}已经够数了，不用再送。", en: "The {item} is all there. No need to send more."}
  point_heard:
    - {zh: "这个我不清楚。倒是听{name}提过几句，你去问问。", en: "I don't know about that. I did hear {name} say a few words on it, so go and ask."}
    - {zh: "我没留心这事。{name}说起过，你问问去。", en: "I paid it no mind, but {name} spoke of it. Go and ask."}
  point_hub:
    - {zh: "老婆子不打听闲事。镇上的消息，你去问{name}。", en: "I don't go after gossip. For the news of the town, ask {name}."}
    - {zh: "这事我不知道。{name}那儿人来人往，你去问问。", en: "I don't know. People come and go all day at {name}'s, so ask there."}
  gift_like:
    - {zh: "{item}啊，软和。老婆子就爱这一口。", en: "Ah, {item}, nice and soft. Just what I like at my age."}
    - {zh: "{item}？你倒有心，我收下了。", en: "Some {item}? That's thoughtful of you. I'll take them."}
  gift_neutral:
    - {zh: "{item}啊，放着吧。难为你想着。", en: "Some {item}. Set that down there. Kind of you to think of me."}
    - {zh: "{item}也好，家里用得着。", en: "Some {item}, then. We'll find a use for that at home."}
  gift_dislike:
    - {zh: "{item}我不沾。你拿回去吧。", en: "I don't touch {item}. Take it back."}
    - {zh: "{item}啊……我这把年纪不碰了。心意领了。", en: "Ah, {item}... not at my age. I'll take the thought."}
frames:
  seen:
    - {zh: "{line}。这是老婆子亲眼看见的。", en: "{line}. These old eyes saw it."}
    - {zh: "{line}，我这双眼睛看着的。", en: "{line}, and these eyes of mine watched it."}
  heard:
    - {zh: "{teller}跟我讲，说{line}。", en: "{teller} came and told me that {line}."}
    - {zh: "是{teller}跟我说的。说是{line}。", en: "I had it from {teller}, who said that {line}."}
  unknown:
    - {zh: "外头有人传，说{line}。", en: "There's talk going round that {line}."}
    - {zh: "说是{line}。谁先说的，我记不得了。", en: "Word is that {line}. Who said it first, I can't remember."}
  own:
    - {zh: "要我看哪，{line}。", en: "As I see it, {line}."}
    - {zh: "老婆子活了这把年纪，看得出{line}。", en: "At my age I can tell that {line}."}
  guess_own:
    - {zh: "我不敢说准，{hedge}{line}。", en: "I won't swear to it, but {hedge} {line}."}
    - {zh: "说不准的事。{hedge}{line}。", en: "Nobody can be sure. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}自己也是猜的，{hedge}{line}。", en: "{teller} was guessing too, and {hedge} {line}."}
    - {zh: "听{teller}那么一说，{hedge}{line}。", en: "The way {teller} put it, {hedge} {line}."}
  guess_unknown:
    - {zh: "不知道谁先说的，{hedge}{line}。", en: "I don't know who started it. {hedge} {line}."}
    - {zh: "外头瞎猜的，{hedge}{line}。", en: "It's just people guessing, but {hedge} {line}."}
  rival:
    - {zh: "可{teller}跟我讲的不一样，说{line}。", en: "But {teller} told me different, that {line}."}
    - {zh: "{teller}那儿还有个说法，说是{line}。", en: "{teller} has another version, that {line}."}
  known:
    - {zh: "{line}。这还用问。", en: "{line}. That needs no asking."}
    - {zh: "{line}，镇上老老少少都知道。", en: "{line}. Young and old in this town know that."}
hedges:
  - {zh: 多半是, en: I'd say}
  - {zh: 我寻思, en: I suspect}
# What she says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. She is wary of the manager and slow to warm, so her greeting follows what
# the manager has done for her house: the slander cleared, the bamboo brought, a promise kept or not.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "你就是族长请来的总管？老婆子姓李，李家的事我说了算。", en: "So you're the Manager the elder sent for? I'm Granny Li, and in the Li house my word goes."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "答应我的事，你没办。老婆子记着呢。", en: "You promised me and didn't do it. I haven't forgotten."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚游灯了。我门口的灯，一早就挂上了。", en: "The lanterns go round tonight. I hung the one at my door first thing this morning."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "周家那个掌柜肯跟我们坐一桌了。这口气，总算顺了。", en: "That Zhou shopkeeper sat down at one table with us. I can breathe easier at last."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥是怎么坏的，大家都听明白了。李家人不用再低着头走路了。", en: "Everyone knows now how the bridge broke. The Li family can walk with their heads up again."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "答应我的事你办成了，李家记你的好。", en: "You did what you promised me. The Li house won't forget it."}
  - id: bamboo
    when: [{kind: commitment, by: li_da, item: bamboo, state: delivered}]
    lines:
      - {zh: "老大把竹料送到桥边了，一根不少。", en: "My eldest has taken the bamboo to the bridge, every pole of it."}
  - id: cleared
    when: [{kind: knows, props: [pr_set_straight]}]
    lines:
      - {zh: "那些闲话当众说清了，我心里松快些了。", en: "That talk was cleared up in front of everyone. I feel a little easier."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "总管又来了。说吧。", en: "Back again, Manager. Go on."}
      - {zh: "还有事？我听着呢。", en: "Something more? I'm listening."}
  - id: plain
    lines:
      - {zh: "总管来了？有话就说。", en: "You've come, Manager? Say what you came to say."}
      - {zh: "坐吧，有话慢慢说。", en: "Sit down. Take your time."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你答应的事，我还等着。", en: "I'm still waiting on what you promised."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "晚上灯会上见，总管。", en: "See you at the lanterns tonight, Manager."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "话说开了，我也踏实了。", en: "It's out in the open, and I can rest."}
  - id: bamboo
    when: [{kind: commitment, by: li_da, item: bamboo, state: delivered}]
    lines:
      - {zh: "桥上的活，别误了。", en: "Don't let the work at the bridge slip."}
  - id: plain
    lines:
      - {zh: "去吧，别误了正事。", en: "Go on, and don't neglect the work."}
      - {zh: "慢走。老婆子不送了。", en: "Mind how you go. I won't see you out."}
epilogue:
  - id: word_broken
    when: [{kind: promised, state: broken}]
    text: {zh: "李老太一直记着总管答应了却没办的那件事。灯会再热闹，老人家也只在李家门口站了站。", en: "Granny Li never forgot what the Manager had promised and not done. However lively the festival, the old woman only stood a while at the Li doorway."}
  - id: full_kept
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}, {kind: promised, state: kept}]
    text: {zh: "李老太拄着拐杖，慢慢走过了石桥。总管答应的事办到了，老人家点了点头。", en: "Granny Li crossed the Stone Bridge slowly, leaning on a stick. The Manager had kept the promise, and the old woman nodded."}
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "李老太拄着拐杖，慢慢走过了石桥。桥那头的周掌柜拱了拱手，老人家点了点头。", en: "Granny Li crossed the Stone Bridge slowly, leaning on a stick. Shopkeeper Zhou bowed at the far end, and the old woman nodded."}
  - id: bridge_peace
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: reconciled}]
    text: {zh: "李老太过了桥，在桥头跟周掌柜说了几句家常。", en: "Granny Li crossed the bridge and chatted a while with Shopkeeper Zhou at the far end."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "李老太站在桥头，看着李家借出的竹子绑在栏杆上。灯过去了，老人家没有过桥。", en: "Granny Li stood at the bridgehead and looked at the bamboo that the Li house had lent, tied into the railing. The lanterns went by, and the old woman did not cross."}
  - id: unused
    when: [{kind: flag, flag: detour_done}, {kind: commitment, by: li_da, item: bamboo, state: delivered}]
    text: {zh: "桥没修成，李家借出的竹料还堆在桥边。李老太跟着灯，从庙后的夹道走了一趟。", en: "The bridge was not mended, and the bamboo that the Li house had lent still lay by the bridge. Granny Li followed the lanterns along the lane behind the temple."}
  - id: detour
    when: [{kind: flag, flag: detour_done}]
    text: {zh: "李老太跟着灯，从庙后的夹道慢慢走了一趟。", en: "Granny Li walked slowly behind the lanterns along the lane behind the temple."}
  - id: lent_apart
    when: [{kind: commitment, by: li_da, item: bamboo, state: delivered}]
    text: {zh: "李老太看着桥边那堆没用上的竹料，一句话也没说。", en: "Granny Li looked at the unused bamboo by the bridge and said nothing."}
  - id: apart
    text: {zh: "李老太守着李家的灯，没有往桥边去。", en: "Granny Li kept the Li family's lanterns at home and did not go to the bridge."}
