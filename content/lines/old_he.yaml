# Boatman He, the ferryman. Terse to the point of rudeness: he spends words like coins and has
# never in his life said two where one would do.
person: old_he
voice:
  zh: 摆渡的老何。惜字如金，能一个词说完的绝不说两个，从不解释。
  en: The ferryman. Terse to the point of rudeness, spends words like coins, never says two where one will do, never explains.
lines:
  asleep:
    - {zh: "呼……船……（睡熟了）", en: "Zzz... boat... (fast asleep)"}
    - {zh: "唔……（睡熟了）", en: "Mm... (fast asleep)"}
  busy:
    - {zh: "忙。", en: "Busy."}
    - {zh: "改天。", en: "Another day."}
  timeout:
    - {zh: "得回去了。", en: "Got to go."}
    - {zh: "船在等。", en: "The boat waits."}
  unknown:
    - {zh: "不知道。", en: "Don't know."}
    - {zh: "没听过。", en: "Never heard."}
  evade:
    - {zh: "不说。", en: "Not saying."}
    - {zh: "别问。", en: "Don't ask."}
  not_said:
    - {zh: "没说过。", en: "Never said it."}
    - {zh: "不是我。", en: "Not me."}
  not_so:
    - {zh: "不对。", en: "Wrong."}
    - {zh: "不是。", en: "Isn't so."}
  keeper_no:
    - {zh: "不熟。", en: "Don't know you."}
    - {zh: "生人免谈。", en: "No talk with strangers."}
  took_in:
    - {zh: "嗯。记下了。", en: "Mm. Noted."}
    - {zh: "知道了。", en: "Heard."}
  knew:
    - {zh: "早知道。", en: "Knew."}
    - {zh: "我知道。", en: "I know."}
  doubted:
    - {zh: "我听的不是这样。", en: "Not what I heard."}
    - {zh: "不像。", en: "Doesn't sound right."}
  caught:
    - {zh: "你撒谎。不信了。", en: "You lied. Done with you."}
    - {zh: "骗子。别再来。", en: "Liar. Don't come back."}
  deal:
    - {zh: "行。", en: "Done."}
    - {zh: "成。", en: "Fine."}
  empty:
    - {zh: "空话。", en: "Empty talk."}
    - {zh: "不信。", en: "Don't believe it."}
  kept_thanks:
    - {zh: "算数。记着。", en: "Kept your word. I'll remember."}
    - {zh: "守信。好。", en: "You keep faith. Good."}
  will_do:
    - {zh: "我去。", en: "I'll go."}
    - {zh: "办。", en: "On it."}
  cannot:
    - {zh: "不行。", en: "Can't."}
    - {zh: "帮不上。", en: "No help from me."}
  turned_down:
    - {zh: "不答应。", en: "Won't agree."}
    - {zh: "不成。", en: "No go."}
  said_already:
    - {zh: "说了。", en: "Said it."}
    - {zh: "讲过。", en: "Told you."}
  closed:
    - {zh: "现在不行。", en: "Not now."}
    - {zh: "过会儿。", en: "Later."}
  needs_nod:
    - {zh: "问族长。", en: "Ask the elder."}
    - {zh: "我做不了主。", en: "Not mine to decide."}
  nothing_to_say:
    - {zh: "无话。", en: "No words."}
    - {zh: "没什么。", en: "Nothing to add."}
  testified:
    - {zh: "我看见了。", en: "I saw it."}
    - {zh: "亲眼见的。", en: "Saw it myself."}
  too_late:
    - {zh: "晚了。明早。", en: "Late. Morning."}
    - {zh: "天黑了。明天。", en: "Dark. Tomorrow."}
  will_ask:
    - {zh: "我去说。", en: "I'll tell them."}
    - {zh: "带话。", en: "I'll pass it on."}
  will_call:
    - {zh: "我去叫人。", en: "I'll fetch them."}
    - {zh: "祠堂。我喊。", en: "Hall. I'll call them."}
  hard_hc_li_bamboo:
    - {zh: "谣言不清。免谈。", en: "Rumour stays. No talk."}
    - {zh: "先说清楚。再来。", en: "Clear it first. Then come."}
  hard_hc_li_bamboo_rumour:
    - {zh: "谣言。你不吭。不行。", en: "Rumour. You're silent. No."}
    - {zh: "你不吭声。我不借。", en: "You're quiet. I won't."}
  hard_other:
    - {zh: "不谈。", en: "Won't discuss."}
    - {zh: "休想。", en: "Not likely."}
  elder_yes:
    - {zh: "明白了。行。", en: "Understood. Fine."}
    - {zh: "有理。", en: "Fair."}
  elder_no:
    - {zh: "不够。", en: "Not enough."}
    - {zh: "还不行。", en: "Not yet."}
  objection_withdrawn:
    - {zh: "行。不拦。", en: "Fine. No block."}
    - {zh: "说清了。过。", en: "Cleared. Go."}
  witness_in_public:
    - {zh: "就看见这些。", en: "That's all I saw."}
    - {zh: "别的没见。", en: "Saw nothing else."}
  batch_promised:
    - {zh: "明早。送。", en: "Morning. I'll bring it."}
    - {zh: "天亮送。", en: "At dawn. I'll bring it."}
  bamboo_arrived:
    - {zh: "竹到了。", en: "Bamboo's here."}
    - {zh: "桥边有料了。", en: "Stock at the bridge."}
  promise_open:
    - {zh: "应了。{amount}根{item}，{when}。", en: "Promised: {amount} poles of {item}, {when}."}
    - {zh: "说了。{when}，{amount}根{item}。", en: "Told you: {item}, {amount} poles, {when}."}
  goods_enough:
    - {zh: "{item}够了。", en: "Enough {item}."}
    - {zh: "桥边{item}多了。", en: "Plenty of {item} at the bridge."}
  point_heard:
    - {zh: "不知道。{name}提过。去问。", en: "Don't know. Heard {name} mention it. Go ask."}
    - {zh: "不清楚。{name}讲过。去问。", en: "No idea. Something {name} said, maybe. Ask."}
  point_hub:
    - {zh: "不知道。去问{name}，消息多。", en: "Don't know. Ask {name}. Hears a lot."}
    - {zh: "我不管闲话。找{name}。", en: "Don't deal in gossip. See {name}."}
frames:
  seen:
    - {zh: "我看见：{line}。", en: "Saw it: {line}."}
    - {zh: "亲眼见：{line}。", en: "Saw it myself: {line}."}
  heard:
    - {zh: "{teller}讲的：{line}。", en: "From {teller}: {line}."}
    - {zh: "{teller}那儿听的：{line}。", en: "Heard from {teller}: {line}."}
  unknown:
    - {zh: "有人讲：{line}。", en: "Folk say {line}."}
    - {zh: "传言：{line}。", en: "Rumour has it {line}."}
  own:
    - {zh: "我看：{line}。", en: "My view: {line}."}
    - {zh: "照我说：{line}。", en: "I say {line}."}
  guess_own:
    - {zh: "不准。{hedge}{line}。", en: "Not sure. {hedge} {line}."}
    - {zh: "说不好。{hedge}{line}。", en: "Hard to say. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}讲过半句。{hedge}{line}。", en: "{teller} said half a thing. {hedge} {line}."}
    - {zh: "{teller}口气里有。{hedge}{line}。", en: "{teller} hinted. {hedge} {line}."}
  guess_unknown:
    - {zh: "不知谁讲。{hedge}{line}。", en: "No telling who said it. {hedge} {line}."}
    - {zh: "听来的。{hedge}{line}。", en: "Just heard it. {hedge} {line}."}
  rival:
    - {zh: "{teller}不是这么说：{line}。", en: "{teller} told it otherwise: {line}."}
    - {zh: "但{teller}讲过别的：{line}。", en: "Still, {teller} said different: {line}."}
hedges:
  - {zh: 兴许, en: I'd say}
  - {zh: 怕是, en: I fear}
# What he says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. Some story of the script blames him, so his lists read nothing of what he or
# anyone believes: only flags, the sky, the clock and the promises. His epilogue says what he did
# only if the truth was told in public and it named the boat, and otherwise says the same in
# every story.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "渡河？上船。", en: "Crossing? Get in."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "话不作数。我记着。", en: "Word counted for nothing. I keep count."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今夜船靠岸，灯过河。", en: "Boat's moored tonight. The lanterns cross."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说完了？好。", en: "Said it all? Good."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家和了。船上也静。", en: "The houses are at peace. Quiet in the boat too."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥通了。船闲了。", en: "Bridge is open. Boat's idle."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你说了。你办了。", en: "You said it. You did it."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "闲话说清了。", en: "Gossip's settled."}
  - id: rain
    when: [{kind: weather, is: heavy_rain}]
    lines:
      - {zh: "雨大。船不下水。", en: "Heavy rain. Boat stays dry."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来。", en: "Again."}
      - {zh: "讲。", en: "Out with it."}
  - id: plain
    lines:
      - {zh: "过河？", en: "Crossing?"}
      - {zh: "有事快讲。", en: "Be quick."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "账我记着。", en: "I keep count."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "灯会上。", en: "At the lanterns."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说完就好。", en: "Said is said."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥通了。坐船的少。", en: "Bridge is open. Fewer fares."}
  - id: plain
    lines:
      - {zh: "走吧。", en: "Off with you."}
      - {zh: "船要开了。", en: "The boat's leaving."}
epilogue:
  - id: owned
    when: [{kind: told_cause, is: boat}]
    text: {zh: "船夫老何在祠堂里开了口，认下了那夜船头撞断栏杆的事。镇上没有骂声，只请老何赔了木料钱。", en: "Boatman He spoke up in the hall and owned that the boat had struck the rail that night. The town did not curse, and asked only that Boatman He pay for the timber."}
  - id: flood
    when: [{kind: told_cause, is: flood}]
    text: {zh: "再没有人问老何那夜去了哪里。栏杆是秋汛冲垮的，与那条船无关。", en: "Nobody asked Boatman He any more where the boat had been that night. The flood had washed the rail out, and the boat had nothing to do with it."}
  - id: drunk
    when: [{kind: told_cause, is: drunk}]
    text: {zh: "没有人再疑老何的船。老何照旧天亮就下了水，什么也没说。", en: "Nobody doubted Boatman He's boat any more. The ferryman went down to the water at first light and said nothing."}
  - id: idle
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "桥通了，渡船冷清了。老何还守在渡口，天黑才收桨。", en: "With the bridge open the ferry was quiet. Boatman He still sat at the landing and shipped the oars only at dark."}
  - id: busy
    text: {zh: "桥没有通，渡船一夜没歇。老何一船船把人送过去，什么也没说。", en: "The bridge stayed shut and the ferry ran all night. Boatman He took people across, boatload after boatload, and said nothing."}
