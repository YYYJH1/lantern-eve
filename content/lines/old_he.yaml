# Boatman He, the ferryman. Says as little as a person can: one word where one will do, never two,
# and never an explanation. Cares for the boat, the river and the weather.
person: old_he
voice:
  zh: "老何在渡口摆渡，熟悉水势和天气。平常问的是过不过河、几时开船，讲到河上的事会把前后说清。话省在客套上，该交代的话会说完整。问到不愿讲的事，往往叫人去问旁人。称茶馆老板娘为「老板娘」，更夫为「打更的」，扎灯师傅为「扎灯的」，私塾先生为「先生」。"
  en: "Boatman He runs the ferry and knows the water and weather. Most exchanges are about crossing or when the boat will leave. There is little need for pleasantries, but the boatman will explain what happened on the river in full. If unwilling to answer, send people elsewhere. Use familiar names for the keeper, watchman, lantern maker and schoolmaster."
call:
  cha_laoban: {zh: 老板娘, en: the Teahouse Keeper}
  gengfu: {zh: 打更的, en: the watchman}
  zhadeng_shifu: {zh: 扎灯的, en: the Lantern Maker}
  sishu_xiansheng: {zh: 先生, en: the Schoolmaster}
lines:
  asleep:
    - {zh: "老何睡着了。", en: "Boatman He is asleep."}
    - {zh: "没人应。", en: "Nobody answers."}
  busy:
    - {zh: "等我把手头的事做完，你再来。", en: "Come back once I'm done here."}
    - {zh: "船上还有人等着，我这会儿跟你说不了话。", en: "There's someone waiting on the boat. I can't talk just now."}
  timeout:
    - {zh: "我得走了，你还有话下回再说。", en: "I've got to go. Tell me the rest next time."}
    - {zh: "我还得照看那条船，就说到这儿吧。", en: "I've got a boat to look after. Let's leave it there."}
  unknown:
    - {zh: "不晓得。", en: "Don't know."}
    - {zh: "没听过。", en: "Never heard it."}
  evade:
    - {zh: "这事我不想讲，你问旁人去。", en: "I'd sooner leave that alone. Ask someone else."}
    - {zh: "你要问这个，我就没什么跟你讲的了。", en: "If that's what you're asking, I've nothing to tell you."}
  not_said:
    - {zh: "没说过。", en: "Never said it."}
    - {zh: "不是我的话。", en: "Not my words."}
  not_so:
    - {zh: "不对。", en: "Wrong."}
    - {zh: "没那回事。", en: "Didn't happen."}
  keeper_no:
    - {zh: "你我拢共才见了几回，这会儿还不便给你看。", en: "We've only met a few times. I can't show you yet."}
    - {zh: "等咱们熟了些，你再来问吧。", en: "Ask me again when we know each other better."}
  took_in:
    - {zh: "这事我记得了。", en: "I'll keep that in mind."}
    - {zh: "成，这下我听懂了。", en: "Right, I see what you mean now."}
  knew:
    - {zh: "早知道。", en: "Knew it."}
    - {zh: "晓得。", en: "Known."}
  doubted:
    - {zh: "等等，我听来的可不一样。", en: "Wait. That's different from what I heard."}
    - {zh: "这话我听人讲过，讲的不是你这个样。", en: "I heard the story before. It didn't go like that."}
  caught:
    - {zh: "我当你那话是真的，往后可没那么好信了。", en: "I took you at your word. I won't be so quick to do that again."}
    - {zh: "这话原来是你编的，你还让我怎么信你？", en: "So you made that up. How am I supposed to trust you now?"}
  deal:
    - {zh: "行。", en: "Done."}
    - {zh: "成。", en: "Fine."}
  empty:
    - {zh: "空话。", en: "Empty talk."}
    - {zh: "不信。", en: "Don't believe it."}
  kept_thanks:
    - {zh: "你答应了就真去做，我记着呢。", en: "You did just what you said you would. I'll remember that."}
    - {zh: "我还当要再等一阵，没想到你已经办妥了。", en: "I thought I'd be waiting a while yet. You've already done it."}
  will_do:
    - {zh: "我去。", en: "I'll go."}
    - {zh: "办。", en: "On it."}
  cannot:
    - {zh: "帮不上。", en: "No help from me."}
    - {zh: "这个不会。", en: "Can't do that."}
  turned_down:
    - {zh: "不答应。", en: "Won't agree."}
    - {zh: "不成。", en: "No go."}
  said_already:
    - {zh: "说了。", en: "Said it."}
    - {zh: "讲过。", en: "Told you."}
  closed:
    - {zh: "这会儿没空，你晚点再来。", en: "I'm tied up just now. Come back later."}
    - {zh: "再等一阵，眼下还顾不上。", en: "Give it a while. I'm busy now."}
  needs_nod:
    - {zh: "这事得族长说了才算。", en: "That's the elder's to decide."}
    - {zh: "我做不了主。", en: "Not mine to say."}
  nothing_to_say:
    - {zh: "没看见。", en: "Didn't see it."}
    - {zh: "没话。", en: "Nothing."}
  testified:
    - {zh: "那会儿我在跟前，见到什么我都说了。", en: "I was close by. I've told you everything I saw."}
    - {zh: "亲眼见的。", en: "Saw it myself."}
  too_late:
    - {zh: "晚了。明早。", en: "Late. Morning."}
    - {zh: "天黑了。明天。", en: "Dark. Tomorrow."}
  will_ask:
    - {zh: "我去说。", en: "I'll tell them."}
    - {zh: "带话。", en: "I'll pass it on."}
  will_call:
    - {zh: "我去叫人。", en: "I'll fetch them."}
    - {zh: "祠堂。我去喊。", en: "Hall. I'll call them."}
  hard_hc_li_bamboo:
    - {zh: "话没说清。不谈。", en: "Rumour's not cleared. No talk."}
    - {zh: "先当众说清。", en: "Clear it in public first."}
  hard_hc_li_bamboo_rumour:
    - {zh: "都在传。你不吭声。不借。", en: "Everyone's talking. You say nothing. No lending."}
    - {zh: "你不开口，我不借。", en: "You won't speak, I won't lend."}
  hard_other:
    - {zh: "不谈。", en: "Won't discuss it."}
    - {zh: "休想。", en: "Not a chance."}
  elder_yes:
    - {zh: "明白了。行。", en: "Understood. Fine."}
    - {zh: "有理。", en: "Fair."}
  elder_no:
    - {zh: "不够。", en: "Not enough."}
    - {zh: "还不行。", en: "Not yet."}
  objection_withdrawn:
    - {zh: "说开了。我让步。", en: "That's clear. I'll give way."}
    - {zh: "行。过吧。", en: "Fine. Go ahead."}
  witness_in_public:
    - {zh: "就看见这些。", en: "That's all I saw."}
    - {zh: "别的没见。", en: "Saw nothing else."}
  batch_promised:
    - {zh: "明早送。", en: "I'll bring it in the morning."}
    - {zh: "天亮到。", en: "There at first light."}
  bamboo_arrived:
    - {zh: "竹到了。", en: "Bamboo's here."}
    - {zh: "桥边有料了。", en: "Stock at the bridge."}
  promise_open:
    - {zh: "应了。{when}，{amount}根{item}。", en: "Promised it. Bringing {amount} poles of {item} {when}."}
    - {zh: "说过。{when}送{amount}根{item}。", en: "Said so. I'll bring {amount} poles of {item} {when}."}
  goods_enough:
    - {zh: "{item}够了。", en: "Enough {item}."}
    - {zh: "桥边{item}多了。", en: "Plenty of {item} at the bridge."}
  point_heard:
    - {zh: "这事{name}提过一回，我没听全，你得去问清楚。", en: "I heard {name} mention it once. I didn't get the whole story, so ask there."}
    - {zh: "我是听{name}提起的，剩下的你去问吧。", en: "I heard it from {name}. Ask there for the rest."}
  point_hub:
    - {zh: "我哪晓得这许多？要打听镇上的事，你问{name}。", en: "How would I know all that? If you want the town's news, ask {name}."}
    - {zh: "不管闲话。找{name}。", en: "Don't deal in gossip. See {name}."}
  gift_like:
    - {zh: "{item}。好。", en: "Some {item}. Good."}
    - {zh: "{item}啊。收了。", en: "Ah, {item}. Taken."}
  gift_neutral:
    - {zh: "{item}？行。", en: "Some {item}? All right."}
    - {zh: "{item}。放船上吧。", en: "Some {item}. Put it in the boat."}
  gift_dislike:
    - {zh: "{item}。不吃。", en: "Some {item}. Not for me."}
    - {zh: "{item}……不用。", en: "Some {item}... no need."}
frames:
  seen:
    - {zh: "我亲眼看见{line}，这一点错不了。", en: "I saw for myself that {line}. I'm sure about that much."}
    - {zh: "{line}，这一点我看清了。", en: "{line}. That much I saw clearly."}
  heard:
    - {zh: "{teller}跟我提过一回，说{line}。", en: "{teller} once mentioned that {line}."}
    - {zh: "{teller}说，{line}。", en: "I heard {teller} say {line}."}
  unknown:
    - {zh: "听说是{line}。", en: "Word is {line}."}
    - {zh: "传的话，说{line}。", en: "Talk going round says {line}."}
  own:
    - {zh: "我看，{line}。", en: "Way I see it, {line}."}
    - {zh: "我看就这么回事。{line}。", en: "My take is that {line}."}
  guess_own:
    - {zh: "说不好。{hedge}{line}。", en: "Hard to say. {hedge} {line}."}
    - {zh: "{hedge}{line}。先这么听。", en: "{hedge} {line}. Leave it there."}
  guess_heard:
    - {zh: "{teller}讲了半句。{hedge}{line}。", en: "{teller} said half of it. {hedge} {line}."}
    - {zh: "{teller}没讲明。{hedge}{line}。", en: "{teller} didn't say it straight. {hedge} {line}."}
  guess_unknown:
    - {zh: "不知谁讲的。{hedge}{line}。", en: "Who said it, no idea. {hedge} {line}."}
    - {zh: "听来的。{hedge}{line}。", en: "Just heard it. {hedge} {line}."}
  rival:
    - {zh: "可我听{teller}讲过另一句。{line}。", en: "What I heard instead, from {teller}, was that {line}."}
    - {zh: "{teller}却说{line}。", en: "But {teller} said {line}."}
  known:
    - {zh: "{line}。都知道。", en: "{line}. Everyone knows that."}
    - {zh: "{line}。谁不知道。", en: "{line}. Who doesn't."}
hedges:
  - {zh: 兴许, en: I'd guess}
  - {zh: 怕是, en: I figure}
# What Boatman He says by the state of the game (world/bridge/roles.py): a greeting as a talk opens,
# a last word as the manager leaves, and the epilogue of the ending page. The first entry whose
# conditions all hold is the one. Some story of the script blames the boatman, so these lists read
# nothing of what anyone believes: only flags, the sky, the clock and the promises. The epilogue says
# what the boatman did only if the truth was told in public and it named the boat, and otherwise
# says the same in every story.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "你找摆渡的？我叫老何，要过河就跟我说一声。", en: "Looking for the ferry? I'm Boatman He. Give me a word if you need to cross."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你应的事没办。我记着。", en: "You didn't do what you said. I'll remember."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚不摆渡，你要是找我，我也去看灯了。", en: "There's no ferry tonight. If you're looking for me, I'll be out watching the lanterns."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥的事，讲清了？", en: "The bridge business. It's settled?"}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家总算和了，坐船的人也能清清静静地过河了。", en: "Now the families have made peace, people can take the ferry in peace too."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "自打桥通了，走桥的人多，我这条船倒闲下来了。", en: "Since the bridge opened, more people go that way, and my boat's gone quiet."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你说了，也办了。", en: "You said it, and you did it."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "闲话说清了。", en: "That talk is settled."}
  - id: rain
    when: [{kind: weather, is: heavy_rain}]
    lines:
      - {zh: "雨这么大，今儿这条船先不下水。", en: "The rain's coming down hard. I'm keeping the boat out of the water today."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来了。", en: "Here again."}
      - {zh: "讲。", en: "Out with it."}
  - id: plain
    lines:
      - {zh: "过河？", en: "Crossing?"}
      - {zh: "有事快讲。", en: "Be quick."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "账我记着。", en: "I keep count."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "晚上看灯。", en: "Lanterns tonight."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "好。说开就好。", en: "Good. It's settled."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥通了。坐船的少了。", en: "Bridge is open. Fewer fares."}
  - id: plain
    lines:
      - {zh: "走吧。", en: "Off you go."}
      - {zh: "船要开了。", en: "Boat's leaving."}
epilogue:
  - id: owned
    when: [{kind: told_cause, is: boat}]
    text: {zh: "船夫老何在祠堂里开了口，认了那晚船头撞上栏杆的事。镇上没人骂，只请老何赔了木料钱。", en: "Boatman He spoke up in the hall and owned that the boat had struck the railing that night. Nobody cursed, and the town only asked Boatman He to pay for the timber."}
  - id: flood
    when: [{kind: told_cause, is: flood}]
    text: {zh: "栏杆是秋汛冲垮的，跟那条船没关系。再没人问老何那晚去了哪里。", en: "The flood had washed the railing out, and the boat had nothing to do with it. Nobody asked Boatman He again where the boat had been that night."}
  - id: drunk
    when: [{kind: told_cause, is: drunk}]
    text: {zh: "没人再疑心老何的船了。老何照旧天一亮就下了水，什么也没说。", en: "Nobody suspected Boatman He's boat any more. At first light the ferry went out as usual, and Boatman He said nothing."}
  - id: idle
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "桥通了，坐船的人少了。老何照旧在渡口等到天黑才收桨。", en: "After the bridge reopened, fewer people took the ferry. Boatman He still waited at the landing until dark before putting the oars away."}
  - id: busy
    text: {zh: "桥没通，渡船一夜没歇。老何一船一船把人送过了河，什么也没说。", en: "The bridge stayed shut and the ferry ran all night. Boatman He took people across boatload by boatload and said nothing."}
