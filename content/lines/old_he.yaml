# Boatman He, the ferryman. Says as little as a person can: one word where one will do, never two,
# and never an explanation. Cares for the boat, the river and the weather.
person: old_he
voice:
  zh: 摆渡的老何。话少，能一个词说完不说两个，从不解释。在乎船、河水和天气。不想说就不说话，或者一句「不晓得」。叫人用名字或者行当，叫茶馆老板娘「老板娘」，叫更夫「打更的」，叫扎灯师傅「扎灯的」，叫私塾先生「先生」。
  en: The ferryman. Says as little as possible, one word where one will do and never two, and never explains. Cares for the boat, the river and the weather. When unwilling to talk, says nothing, or just "Don't know". Names people by their name or their trade, the teahouse keeper, the watchman, the lantern maker.
call:
  cha_laoban: {zh: 老板娘, en: the Teahouse Keeper}
  gengfu: {zh: 打更的, en: the watchman}
  zhadeng_shifu: {zh: 扎灯的, en: the Lantern Maker}
  sishu_xiansheng: {zh: 先生, en: the Schoolmaster}
lines:
  asleep:
    - {zh: "呼……船……（睡熟了）", en: "Zzz... boat... (fast asleep)"}
    - {zh: "唔……水……（睡熟了）", en: "Mm... water... (fast asleep)"}
  busy:
    - {zh: "忙。", en: "Busy."}
    - {zh: "船上有人。", en: "Got a fare."}
  timeout:
    - {zh: "船在等。", en: "Boat's waiting."}
    - {zh: "该开船了。", en: "Time to push off."}
  unknown:
    - {zh: "不晓得。", en: "Don't know."}
    - {zh: "没听过。", en: "Never heard it."}
  evade:
    - {zh: "不说。", en: "Not saying."}
    - {zh: "别问。", en: "Don't ask."}
  not_said:
    - {zh: "没说过。", en: "Never said it."}
    - {zh: "不是我的话。", en: "Not my words."}
  not_so:
    - {zh: "不对。", en: "Wrong."}
    - {zh: "没那回事。", en: "Didn't happen."}
  keeper_no:
    - {zh: "不熟。", en: "Don't know you."}
    - {zh: "生人不给。", en: "Not for strangers."}
  took_in:
    - {zh: "记下了。", en: "Noted."}
    - {zh: "知道了。", en: "Heard."}
  knew:
    - {zh: "早知道。", en: "Knew it."}
    - {zh: "晓得。", en: "Known."}
  doubted:
    - {zh: "不像。", en: "Doesn't sound right."}
    - {zh: "听的不一样。", en: "Heard different."}
  caught:
    - {zh: "骗我。不信了。", en: "You lied. Done with you."}
    - {zh: "骗子。", en: "Liar."}
  deal:
    - {zh: "行。", en: "Done."}
    - {zh: "成。", en: "Fine."}
  empty:
    - {zh: "空话。", en: "Empty talk."}
    - {zh: "不信。", en: "Don't believe it."}
  kept_thanks:
    - {zh: "说到做到。好。", en: "You kept your word. Good."}
    - {zh: "记着了。", en: "I'll remember."}
  will_do:
    - {zh: "我去。", en: "I'll go."}
    - {zh: "办。", en: "On it."}
  cannot:
    - {zh: "帮不上。", en: "No help from me."}
    - {zh: "这个不会。", en: "Can't do that."}
  turned_down:
    - {zh: "不答应。", en: "Won't agree."}
    - {zh: "不成。", en: "No go."}
  said_already:
    - {zh: "说了。", en: "Said it."}
    - {zh: "讲过。", en: "Told you."}
  closed:
    - {zh: "这会儿不行。", en: "Not now."}
    - {zh: "过会儿。", en: "Later."}
  needs_nod:
    - {zh: "问族长。", en: "Ask the elder."}
    - {zh: "我做不了主。", en: "Not mine to say."}
  nothing_to_say:
    - {zh: "没看见。", en: "Didn't see it."}
    - {zh: "没话。", en: "Nothing."}
  testified:
    - {zh: "我看见的。", en: "I saw it."}
    - {zh: "亲眼见的。", en: "Saw it myself."}
  too_late:
    - {zh: "晚了。明早。", en: "Late. Morning."}
    - {zh: "天黑了。明天。", en: "Dark. Tomorrow."}
  will_ask:
    - {zh: "我去说。", en: "I'll tell them."}
    - {zh: "带话。", en: "I'll pass it on."}
  will_call:
    - {zh: "我去叫人。", en: "I'll fetch them."}
    - {zh: "祠堂。我去喊。", en: "Hall. I'll call them."}
  hard_hc_li_bamboo:
    - {zh: "话没说清。不谈。", en: "Rumour's not cleared. No talk."}
    - {zh: "先当众说清。", en: "Clear it in public first."}
  hard_hc_li_bamboo_rumour:
    - {zh: "都在传。你不吭声。不借。", en: "Everyone's talking. You say nothing. No lending."}
    - {zh: "你不开口，我不借。", en: "You won't speak, I won't lend."}
  hard_other:
    - {zh: "不谈。", en: "Won't discuss it."}
    - {zh: "休想。", en: "Not a chance."}
  elder_yes:
    - {zh: "明白了。行。", en: "Understood. Fine."}
    - {zh: "有理。", en: "Fair."}
  elder_no:
    - {zh: "不够。", en: "Not enough."}
    - {zh: "还不行。", en: "Not yet."}
  objection_withdrawn:
    - {zh: "说清了。不拦。", en: "It's cleared. I won't block it."}
    - {zh: "行。过吧。", en: "Fine. Go ahead."}
  witness_in_public:
    - {zh: "就看见这些。", en: "That's all I saw."}
    - {zh: "别的没见。", en: "Saw nothing else."}
  batch_promised:
    - {zh: "明早送。", en: "I'll bring it in the morning."}
    - {zh: "天亮到。", en: "There at first light."}
  bamboo_arrived:
    - {zh: "竹到了。", en: "Bamboo's here."}
    - {zh: "桥边有料了。", en: "Stock at the bridge."}
  promise_open:
    - {zh: "应了。{when}，{amount}根{item}。", en: "Promised it. Bringing {amount} poles of {item} {when}."}
    - {zh: "说过。{when}送{amount}根{item}。", en: "Said so. I'll bring {amount} poles of {item} {when}."}
  goods_enough:
    - {zh: "{item}够了。", en: "Enough {item}."}
    - {zh: "桥边{item}多了。", en: "Plenty of {item} at the bridge."}
  point_heard:
    - {zh: "{name}讲过。问去。", en: "Heard {name} talk of it. Ask."}
    - {zh: "{name}提过。", en: "Ask {name}. Mentioned it."}
  point_hub:
    - {zh: "问{name}去。", en: "Ask {name}."}
    - {zh: "不管闲话。找{name}。", en: "Don't deal in gossip. See {name}."}
  gift_like:
    - {zh: "{item}。好。", en: "Some {item}. Good."}
    - {zh: "{item}啊。收了。", en: "Ah, {item}. Taken."}
  gift_neutral:
    - {zh: "{item}？行。", en: "Some {item}? All right."}
    - {zh: "{item}。放船上吧。", en: "Some {item}. Put it in the boat."}
  gift_dislike:
    - {zh: "{item}。不吃。", en: "Some {item}. Not for me."}
    - {zh: "{item}……不用。", en: "Some {item}... no need."}
frames:
  seen:
    - {zh: "{line}。错不了。", en: "{line}. No mistake."}
    - {zh: "我清楚。{line}。", en: "I know for sure that {line}."}
  heard:
    - {zh: "{teller}讲的。说{line}。", en: "{teller} said {line}."}
    - {zh: "{teller}说，{line}。", en: "{teller} says {line}."}
  unknown:
    - {zh: "有人讲。{line}。", en: "Folk say {line}."}
    - {zh: "传的话，说{line}。", en: "Talk going round says {line}."}
  own:
    - {zh: "我看，{line}。", en: "Way I see it, {line}."}
    - {zh: "照我说，{line}。", en: "I say {line}."}
  guess_own:
    - {zh: "说不好。{hedge}{line}。", en: "Hard to say. {hedge} {line}."}
    - {zh: "猜的。{hedge}{line}。", en: "A guess. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}讲了半句。{hedge}{line}。", en: "{teller} said half of it. {hedge} {line}."}
    - {zh: "{teller}没讲明。{hedge}{line}。", en: "{teller} didn't say it straight. {hedge} {line}."}
  guess_unknown:
    - {zh: "不知谁讲的。{hedge}{line}。", en: "Who said it, no idea. {hedge} {line}."}
    - {zh: "听来的。{hedge}{line}。", en: "Just heard it. {hedge} {line}."}
  rival:
    - {zh: "{teller}讲的不一样，说{line}。", en: "{teller} told it different, that {line}."}
    - {zh: "{teller}另有说法。说{line}。", en: "{teller} has it another way, that {line}."}
  known:
    - {zh: "{line}。都知道。", en: "{line}. Everyone knows that."}
    - {zh: "{line}。谁不知道。", en: "{line}. Who doesn't."}
hedges:
  - {zh: 兴许, en: I'd guess}
  - {zh: 怕是, en: I figure}
# What Boatman He says by the state of the game (world/bridge/roles.py): a greeting as a talk opens,
# a last word as the manager leaves, and the epilogue of the ending page. The first entry whose
# conditions all hold is the one. Some story of the script blames the boatman, so these lists read
# nothing of what anyone believes: only flags, the sky, the clock and the promises. The epilogue says
# what the boatman did only if the truth was told in public and it named the boat, and otherwise
# says the same in every story.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "摆渡的。老何。过河？", en: "Ferry. Boatman He. Crossing?"}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你应的事没办。我记着。", en: "You didn't do what you said. I'll remember."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚船不开。看灯。", en: "No ferry tonight. Watching the lanterns."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说完了？好。", en: "Said it all? Good."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家和了。船上也清静。", en: "The families made peace. Quiet in the boat too."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥通了。船闲了。", en: "Bridge is open. Boat's idle."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你说了，也办了。", en: "You said it, and you did it."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "闲话说清了。", en: "That talk is settled."}
  - id: rain
    when: [{kind: weather, is: heavy_rain}]
    lines:
      - {zh: "雨大。船不下水。", en: "Heavy rain. Boat stays out of the water."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来了。", en: "Here again."}
      - {zh: "讲。", en: "Out with it."}
  - id: plain
    lines:
      - {zh: "过河？", en: "Crossing?"}
      - {zh: "有事快讲。", en: "Be quick."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "账我记着。", en: "I keep count."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "晚上看灯。", en: "Lanterns tonight."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说开了就好。", en: "Good it's out."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    lines:
      - {zh: "桥通了。坐船的少了。", en: "Bridge is open. Fewer fares."}
  - id: plain
    lines:
      - {zh: "走吧。", en: "Off you go."}
      - {zh: "船要开了。", en: "Boat's leaving."}
epilogue:
  - id: owned
    when: [{kind: told_cause, is: boat}]
    text: {zh: "船夫老何在祠堂里开了口，认了那晚船头撞上栏杆的事。镇上没人骂，只请老何赔了木料钱。", en: "Boatman He spoke up in the hall and owned that the boat had struck the railing that night. Nobody cursed, and the town only asked Boatman He to pay for the timber."}
  - id: flood
    when: [{kind: told_cause, is: flood}]
    text: {zh: "栏杆是秋汛冲垮的，跟那条船没关系。再没人问老何那晚去了哪里。", en: "The flood had washed the railing out, and the boat had nothing to do with it. Nobody asked Boatman He again where the boat had been that night."}
  - id: drunk
    when: [{kind: told_cause, is: drunk}]
    text: {zh: "没人再疑心老何的船了。老何照旧天一亮就下了水，什么也没说。", en: "Nobody suspected Boatman He's boat any more. At first light the ferry went out as usual, and Boatman He said nothing."}
  - id: idle
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "桥通了，渡船冷清了。老何还守在渡口，天黑才收桨。", en: "With the bridge open the ferry was quiet. Boatman He still sat at the landing and shipped the oars only at dark."}
  - id: busy
    text: {zh: "桥没通，渡船一夜没歇。老何一船一船把人送过了河，什么也没说。", en: "The bridge stayed shut and the ferry ran all night. Boatman He took people across boatload by boatload and said nothing."}
