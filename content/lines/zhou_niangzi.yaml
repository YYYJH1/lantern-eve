# Madam Zhou, Shopkeeper Zhou's wife, out at the market every day. Quick-tongued and fond of company,
# she knows what goes on in every house on the street, says "let me tell you" now and then, and her
# talk about one house soon wanders to the next.
person: zhou_niangzi
voice:
  zh: "周掌柜的媳妇，天天在集市上走动。嘴快，爱热闹，街坊谁家有点事都门儿清。常说「我跟你讲」，但不是句句都说。说着说着就扯到别家去了。在乎周家的面子，也爱打听哪家又出了什么事。不想说时就推：「这事我可不敢乱讲，回头又说是我传的。」"
  en: "Shopkeeper Zhou's wife, out at the market every day. Quick-tongued and fond of company, she knows everything that goes on along the street. She often says let me tell you, though not in every sentence, and talk about one house soon wanders to the next. She minds the good face of the Zhou house and loves to hear what has happened where. When she would rather not say: I daren't spread that, they'd only say it came from me."
call:
  fam_zhou: {zh: 我们家, en: our family}
  li_er: {zh: 李家老二, en: Li Er}
  li_laotai: {zh: 李家老太太, en: Granny Li}
  old_he: {zh: 老何, en: Boatman He}
  zhou_dalang: {zh: 大郎, en: Dalang}
  zhou_erlang: {zh: 二郎, en: Erlang}
  zhou_zhanggui: {zh: 我家掌柜的, en: my husband}
lines:
  asleep:
    - {zh: "呼……隔壁那家……明天再说……（睡熟了）", en: "Zzz... the house next door... tomorrow... (fast asleep)"}
    - {zh: "唔……谁家……又吵起来了……（睡熟了）", en: "Mm... whose house... quarrelling again... (fast asleep)"}
  busy:
    - {zh: "这会儿手里一堆事，晚点再来吧。", en: "I've a hundred things in hand. Come by later."}
    - {zh: "我正跟人说话呢，你等等。", en: "I'm talking with someone. Wait a moment."}
  timeout:
    - {zh: "灶上还炖着东西呢，我得回去了。", en: "I've a pot on the stove. I have to get back."}
    - {zh: "家里一摊子事，不跟你多聊了。", en: "A houseful of chores is waiting. I can't chat longer."}
  unknown:
    - {zh: "这事我还真没听说。", en: "That one I really haven't heard."}
    - {zh: "这我哪晓得，没人跟我讲过。", en: "Nobody's said a word of it to me."}
  evade:
    - {zh: "这事我可不敢乱讲，回头又说是我传的。", en: "I daren't spread that. They'd only say it came from me."}
    - {zh: "这个呀，不好说。前两天青菜又涨了两文……", en: "Oh, that's hard to say. Greens went up two coppers again the other day..."}
  not_said:
    - {zh: "我可没这么说，别瞎传。", en: "I never said that, so don't go spreading it."}
    - {zh: "这话可不是我讲的。", en: "Those weren't my words, mind."}
  not_so:
    - {zh: "哪是这么回事。", en: "It wasn't like that at all."}
    - {zh: "你听错了吧，根本不是那样。", en: "You must have heard wrong. It was nothing like that."}
  keeper_no:
    - {zh: "咱们才见头一回，改日吧。", en: "We've only just met. Another day."}
    - {zh: "这个可不好给生人看。", en: "That isn't for strangers to look at."}
  took_in:
    - {zh: "原来是这样，我记着了。", en: "So that's how it is. I'll remember."}
    - {zh: "是吗？这我还真是头一回听说。", en: "Really? Now that's news to me."}
  knew:
    - {zh: "你不说我也知道，街坊都传遍了。", en: "You needn't tell me. The whole street is talking about it."}
    - {zh: "我跟你讲，这事早有人跟我说过了。", en: "Let me tell you, someone told me that already."}
  doubted:
    - {zh: "我听来的可不是这么回事。", en: "That's not how I heard it at all."}
    - {zh: "跟我听说的不一样呀，你听谁讲的？", en: "That's not what I was told. Who told you that?"}
  caught:
    - {zh: "原来你满嘴瞎话。往后你说什么，我都不信了。", en: "So it was all lies. From now on I won't believe anything you say."}
    - {zh: "好哇，连我也敢骗！", en: "Well! So you'd lie even to me!"}
  deal:
    - {zh: "好，就这么办。", en: "Right, we'll do that."}
    - {zh: "行，一言为定。", en: "All right, that's a deal."}
  empty:
    - {zh: "嘴上说得好听，我才不信呢。", en: "Pretty words. I don't believe them for a moment."}
    - {zh: "空口白话，谁不会说啊。", en: "Empty talk. Anyone can say that."}
  kept_thanks:
    - {zh: "总管真是说话算话，这份情我记着。", en: "You really do keep your word, Manager. I'll remember this."}
    - {zh: "你办到了呀，往后有事尽管开口。", en: "You did it. Ask if you ever need anything."}
  will_do:
    - {zh: "行，这事交给我。", en: "Right, leave it to me."}
    - {zh: "好，我这就去张罗。", en: "Good, I'll get on it at once."}
  cannot:
    - {zh: "这个忙我可帮不上。", en: "That's one I can't help with."}
    - {zh: "这个我办不到。", en: "That I can't do."}
  turned_down:
    - {zh: "这个我不能应你，我家掌柜的不会答应。", en: "I can't agree to that. My husband wouldn't have it."}
    - {zh: "这个真不行。", en: "No, I'm afraid that won't do."}
  said_already:
    - {zh: "我不是说过了嘛。", en: "I told you already."}
    - {zh: "刚说完的事，你又问。", en: "I've only just said it, and you ask again."}
  closed:
    - {zh: "这会儿不方便，换个时辰来。", en: "Not a good time now. Come at some other hour."}
    - {zh: "现在可不行，等会儿再来。", en: "Not right now. Come back in a while."}
  needs_nod:
    - {zh: "这得先问问我家掌柜的。", en: "I'll have to ask my husband first."}
    - {zh: "掌柜的不点头，我可不敢应。", en: "If my husband doesn't nod, I wouldn't dare say yes."}
  nothing_to_say:
    - {zh: "这事我没看见，可不敢瞎说。", en: "I didn't see it, so I daren't say."}
    - {zh: "真没什么好讲的。", en: "There's really nothing to tell."}
  testified:
    - {zh: "我讲的可都是亲眼看见的。", en: "Everything I tell you, I saw with my own eyes."}
    - {zh: "没亲眼看见的，我才不瞎说。", en: "If I didn't see it myself, I wouldn't say it."}
  too_late:
    - {zh: "这么晚了，明早再来吧。", en: "It's so late. Come again in the morning."}
    - {zh: "天都黑透了，明天再说。", en: "It's pitch dark. We'll talk tomorrow."}
  will_ask:
    - {zh: "行，我去跟人家说道说道。", en: "All right, I'll go and have a word with them."}
    - {zh: "好，我替你递个话。", en: "Good, I'll pass your word along."}
  will_call:
    - {zh: "好，我这就去招呼大伙儿到祠堂。", en: "Good, I'll call everyone to the hall right now."}
    - {zh: "我去敲门喊人，祠堂见。", en: "I'll go knock on doors. See you at the hall."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话不当众说清，谁也别想从我家要东西。", en: "Until that talk is cleared up in public, nobody gets a thing from us."}
    - {zh: "先把话当众说明白，别的免谈。", en: "Clear it up in public first. Nothing else is up for discussion."}
  hard_hc_li_bamboo_rumour:
    - {zh: "我跟你讲，满镇都在传。你倒一声不吭，这事我不应。", en: "Let me tell you, the whole town is talking. And you say not a word, so I won't agree to this."}
    - {zh: "闲话传得满天飞，你也不吭声。叫我怎么点头？", en: "The talk is flying everywhere and you say nothing. How am I to nod?"}
  hard_other:
    - {zh: "想都别想。", en: "Don't even think of it."}
    - {zh: "这个免了吧。", en: "Forget it."}
  elder_yes:
    - {zh: "我听明白了，就这么定吧。", en: "I understand. Let's settle it so."}
    - {zh: "说得有道理，我服气。", en: "That makes sense. I'm convinced."}
  elder_no:
    - {zh: "就凭这几句话？还不够呢。", en: "Just on those few words? That's not enough."}
    - {zh: "光这样可不行，我还得再想想。", en: "That won't do on its own. I need to think more."}
  objection_withdrawn:
    - {zh: "话说开了，我也不拦着了。", en: "Now it's out in the open, I won't stand in your way."}
    - {zh: "我跟你讲，这回我服气了。你去吧。", en: "Let me tell you, this time I'm satisfied. Go ahead."}
  witness_in_public:
    - {zh: "我就看见这些，多一个字也不敢乱讲。", en: "That's all I saw. I won't say one word more."}
    - {zh: "看见多少说多少，可没添油加醋。", en: "I say as much as I saw. I added nothing."}
  batch_promised:
    - {zh: "好，明早一定送到桥边。", en: "Good. It'll be at the bridge tomorrow morning."}
    - {zh: "我跟你讲，天一亮就送去。", en: "Let me tell you, it goes out the moment it gets light."}
  bamboo_arrived:
    - {zh: "竹子到桥边啦，我刚瞧见的。", en: "The bamboo's at the bridge. I just saw it."}
    - {zh: "瞧见没？竹料都送来了。", en: "See that? The bamboo's all come."}
  promise_open:
    - {zh: "我答应过的事错不了，{when}送{amount}根{item}。", en: "What I promise is as good as done. It's {amount} poles of {item} {when}."}
    - {zh: "说好的呀。{amount}根{item}，{when}到桥边。", en: "It's all agreed. Those {amount} poles of {item} reach the bridge {when}."}
  goods_enough:
    - {zh: "我跟你讲，桥边的{item}早就够啦。", en: "Let me tell you, there's enough {item} at the bridge already."}
    - {zh: "{item}够啦，还送什么。", en: "Enough {item} already. What more would you send."}
  point_heard:
    - {zh: "这个我没听过。可{name}准说起过，去问问。", en: "I haven't heard that one. But {name} must have talked of it, so go and ask."}
    - {zh: "这我不晓得。不过我听{name}嚼过舌头，你去问问。", en: "That I don't know. But I heard {name} gossiping about it, so go and ask."}
  point_hub:
    - {zh: "这事我不清楚。我跟你讲，找{name}准没错。", en: "I can't say. Let me tell you, {name} is the one to find."}
    - {zh: "我可不晓得。要打听闲话，就去问{name}。", en: "I wouldn't know. If it's gossip you're after, ask {name}."}
  gift_like:
    - {zh: "{item}！你怎么知道我爱这个？", en: "Some {item}! How did you know I love these?"}
    - {zh: "{item}我收下了。我跟你讲，你这人会来事。", en: "I'll take the {item}. I'm telling you, you know how to get on with people."}
  gift_neutral:
    - {zh: "{item}啊，放着吧。回头给二郎用。", en: "Some {item}. Leave it, Erlang can use it."}
    - {zh: "{item}也好，谢谢啦。", en: "Some {item}, that's nice. Thanks."}
  gift_dislike:
    - {zh: "{item}我不碰。家里有一个爱喝的就够我烦了。", en: "I don't touch {item}. One drinker in the house is trouble enough."}
    - {zh: "{item}就算了，你留着吧。", en: "Never mind the {item}. Keep it."}
frames:
  seen:
    - {zh: "{line}，我就站在旁边看着呢。", en: "{line}. I was standing right there watching."}
    - {zh: "我可是亲眼瞧见的，{line}。", en: "With my own two eyes I saw that {line}."}
  heard:
    - {zh: "{teller}亲口跟我讲的，说{line}。", en: "{teller} told me so in person, that {line}."}
    - {zh: "我是从{teller}嘴里听来的，说{line}。", en: "I had it straight from {teller} that {line}."}
  unknown:
    - {zh: "街坊都在传，说{line}。", en: "All the neighbours are saying {line}."}
    - {zh: "我听人嚼舌头，{line}。谁先说的，我可不知道。", en: "I overheard some gossip, that {line}. Who started it, I wouldn't know."}
  own:
    - {zh: "我跟你讲，{line}。", en: "Let me tell you, {line}."}
    - {zh: "依我看哪，{line}。", en: "The way I figure it, {line}."}
  guess_own:
    - {zh: "我也是瞎琢磨，{hedge}{line}。", en: "I'm only guessing here, but {hedge} {line}."}
    - {zh: "话可别传出去，{hedge}{line}。", en: "Don't spread it about, but {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}漏了点风声，{hedge}{line}。", en: "{teller} let a little slip, and {hedge} {line}."}
    - {zh: "听{teller}那话里的意思，{hedge}{line}。", en: "From what {teller} hinted, {hedge} {line}."}
  guess_unknown:
    - {zh: "也不知谁先说的，{hedge}{line}。", en: "I couldn't say who started it, but {hedge} {line}."}
    - {zh: "风声传得乱，{hedge}{line}。", en: "The word's all muddled, but {hedge} {line}."}
  rival:
    - {zh: "{teller}还讲过另一套呢，说{line}。", en: "{teller} told another story too, that {line}."}
    - {zh: "可{teller}不是这么说的，说{line}。", en: "But {teller} told it otherwise, that {line}."}
  known:
    - {zh: "{line}，这事谁不晓得呀。", en: "{line}. There's nobody who doesn't know that."}
    - {zh: "{line}。我跟你讲，这镇上没人不知道。", en: "{line}. I'm telling you, there's nobody in this town who doesn't know."}
hedges:
  - {zh: 八成是, en: I'd lay odds}
  - {zh: 我看多半是, en: I'll bet}
