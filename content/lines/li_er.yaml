# Li Er, the second Li son, who pastes lanterns at the workshop and lost his lantern in the river.
# Easygoing, quick to make fun of himself, and he draws his words out when he is unsure. The town
# blames him for the rail, and he smiles it off until he cannot.
person: li_er
voice:
  zh: "李家老二，在扎灯坊糊灯。随和，爱拿自己打趣，被冤枉了也先笑一笑。拿不准时话会拖长：「这个嘛……」。手上总有活，糊灯，调糨糊。在乎别人怎么看自己，也在乎灯会的灯糊不糊得完。不想说就一句「我说了也没人信，你去问别人吧」。难得冒火，冒火也就一句：「我真没去桥那边！」"
  en: "The second Li son, who pastes lanterns at the workshop. Easygoing, quick to make fun of himself, and even when wrongly blamed he smiles first. When unsure he draws his words out: well, now... His hands are always busy with paper and paste. He minds what people think of him, and whether the festival lanterns will be finished in time. When he would rather not answer: nobody believes me anyway, go and ask someone else. He seldom loses his temper, and then only to say: I really didn't go near the bridge!"
call:
  fam_li: {zh: 我们家, en: our family}
  li_da: {zh: 大哥, en: my brother}
  li_laotai: {zh: 我娘, en: my mother}
  li_xiaomei: {zh: 小妹, en: Xiaomei}
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "嘿……灯笼……捞上来了……（睡熟了）", en: "Heh... the lantern... got it out... (fast asleep)"}
    - {zh: "呼……糨糊……别干……（睡熟了）", en: "Zzz... the paste... don't dry... (fast asleep)"}
  busy:
    - {zh: "我手上正忙着呢，你等我一下。", en: "My hands are full right now. Give me a minute."}
    - {zh: "这会儿走不开，回头再聊。", en: "Can't stop just now. Let's talk later."}
  timeout:
    - {zh: "糨糊要干了，我得回去了。", en: "The paste will dry. I have to get back."}
    - {zh: "到点了，我得走了。回头再聊啊。", en: "That's the time. I have to go. Talk later."}
  unknown:
    - {zh: "这个嘛……我还真不知道。", en: "Well, now... I really don't know."}
    - {zh: "这我哪知道啊。", en: "No idea about that, sorry."}
  evade:
    - {zh: "我说了也没人信，你去问别人吧。", en: "Nobody believes me anyway. Go and ask someone else."}
    - {zh: "这个就别问了吧。", en: "Let's leave that one alone."}
  not_said:
    - {zh: "我没说过这话啊。", en: "I never said that, you know."}
    - {zh: "我可没这么讲。", en: "I didn't put it like that."}
  not_so:
    - {zh: "不是的，不是那么回事。", en: "No, no, that's not it."}
    - {zh: "不对不对，你听反了。", en: "No, no. You've got it backwards."}
  keeper_no:
    - {zh: "咱们才刚认识，下回吧。", en: "We've only just met. Next time."}
    - {zh: "这个……我不好给不熟的人看。", en: "That's... not something I show to people I hardly know."}
  took_in:
    - {zh: "哦，原来是这样。我记着了。", en: "Oh, I see. I'll keep that in mind."}
    - {zh: "好嘞，我晓得了。", en: "Right, got it."}
  knew:
    - {zh: "这个啊，我早听说了。", en: "Oh, that. I'd heard already."}
    - {zh: "这事我也知道。", en: "I know that one already."}
  doubted:
    - {zh: "不对吧，我听的可不是这样。", en: "That doesn't sound right. It's not what I heard."}
    - {zh: "我听的好像不是这么回事。", en: "That's not quite how I heard it."}
  caught:
    - {zh: "原来你也拿话哄我。我还当你是好人呢。", en: "So you were stringing me along too. And I took you for a decent sort."}
    - {zh: "你骗我！亏我还信你。", en: "You lied to me! And I trusted you."}
  deal:
    - {zh: "行啊，就这么说定了。", en: "Sure, that's a deal."}
    - {zh: "好嘞，一言为定。", en: "You got it, we're agreed."}
  empty:
    - {zh: "光说不做，谁信啊。", en: "All talk. Who'd believe that."}
    - {zh: "空口白话的，我可不上当。", en: "Just empty words. I won't fall for it."}
  kept_thanks:
    - {zh: "你还真说到做到了。这回我记着。", en: "You really did what you said. I'll remember this one."}
    - {zh: "说到做到啊，李家欠你一个人情。", en: "You kept your word. The Li family owes you one."}
  will_do:
    - {zh: "行，包在我身上。", en: "Sure, leave it to me."}
    - {zh: "好嘞，我这就去办。", en: "On it. I'll go and do it now."}
  cannot:
    - {zh: "这个我真帮不上。", en: "I really can't help with that one."}
    - {zh: "这忙我帮不了，对不住啊。", en: "Can't help with that, sorry."}
  turned_down:
    - {zh: "这个真不行，对不住。", en: "That one really won't do. Sorry."}
    - {zh: "我娘那边不松口，我不好答应你。", en: "My mother won't give way, so I can't say yes to you."}
  said_already:
    - {zh: "这个我刚才说过了呀。", en: "I said that just now."}
    - {zh: "刚讲过啦，还是那样。", en: "I just told you. It's still the same."}
  closed:
    - {zh: "这会儿不行，换个时候吧。", en: "Not now. Come back another time."}
    - {zh: "现在不方便，你过会儿再来。", en: "It's not a good moment. Try later."}
  needs_nod:
    - {zh: "这个得先问我娘。", en: "I have to ask my mother about that first."}
    - {zh: "大哥还没点头呢，我不敢做主。", en: "My brother hasn't said yes yet. I can't decide on my own."}
  nothing_to_say:
    - {zh: "我真没什么可说的。", en: "I honestly have nothing to say."}
    - {zh: "没啥可讲的，真的。", en: "Nothing to tell. Really."}
  testified:
    - {zh: "我说的句句是实话，一句没编。", en: "Every word of it is true. I haven't made up a thing."}
    - {zh: "我不瞎编，看见什么讲什么。", en: "I don't make things up. I tell what I saw."}
  too_late:
    - {zh: "太晚啦，明天早上再说吧。", en: "It's too late now. Let's do it tomorrow morning."}
    - {zh: "天都黑了，明早再来找我。", en: "It's dark already. Find me tomorrow morning."}
  will_ask:
    - {zh: "行，我去帮你说说看。", en: "Okay, I'll go and have a word for you."}
    - {zh: "好嘞，我去传个话。", en: "Right, I'll pass the word."}
  will_call:
    - {zh: "好，我这就去喊大伙儿到祠堂。", en: "Okay, I'll go and call everybody to the hall now."}
    - {zh: "我去叫人，都来祠堂。", en: "I'll go and get people to the hall."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话没说清楚，竹子一根都借不出来。", en: "Until that talk is cleared up, not one pole can be lent."}
    - {zh: "得先当众把话说清楚，不然竹子免谈。", en: "It has to be cleared up in public first. Otherwise, forget the bamboo."}
  hard_hc_li_bamboo_rumour:
    - {zh: "大伙都说桥是我弄坏的……总管你也不吭声，这忙我就不好帮了。", en: "Everyone says I broke the bridge... and you've said nothing either, Manager. So I can't really help."}
    - {zh: "都说桥是我弄坏的，总管也一声不吭。我哪还好意思答应呢？", en: "They all say I broke the bridge, and you stay quiet too. How could I say yes now?"}
  hard_other:
    - {zh: "这个真不行。", en: "That really won't work."}
    - {zh: "没得谈，对不住啊。", en: "Nothing to talk about, sorry."}
  elder_yes:
    - {zh: "嗯，我听明白了。就这样吧。", en: "Mm, I get it. Let's go with that."}
    - {zh: "有道理，我服了。", en: "Makes sense. You've convinced me."}
  elder_no:
    - {zh: "光这些，我还是拿不准。", en: "That alone doesn't settle it for me."}
    - {zh: "还差点意思。", en: "It's still not quite there."}
  objection_withdrawn:
    - {zh: "总算说清楚了，我不拦了。", en: "So it's finally cleared up. I won't get in the way."}
    - {zh: "原来是误会，那我也不挡着啦。", en: "So it was a misunderstanding. Then I won't stand in the way either."}
  witness_in_public:
    - {zh: "我那晚就是去找灯笼的，别的什么也没干。", en: "That night I was only looking for my lantern. I did nothing else."}
    - {zh: "我就看到这些，没添油加醋。", en: "That's all I saw. I haven't added a thing."}
  batch_promised:
    - {zh: "行啊，明早我帮着送到桥边。", en: "Sure, I'll help carry it to the bridge in the morning."}
    - {zh: "明早准到，这回我可不会再弄丢了。", en: "It'll be there tomorrow morning. I won't lose this one."}
  bamboo_arrived:
    - {zh: "竹料到桥边啦，总算帮上一点忙。", en: "The bamboo's at the bridge. At least I helped a little."}
    - {zh: "竹子到了，桥这下有指望了。", en: "The bamboo's here. There's hope for the bridge now."}
  promise_open:
    - {zh: "这事我应了，没忘。{when}送{amount}根{item}过去。", en: "I said yes and I haven't forgotten. I'll bring {amount} poles of {item} over {when}."}
    - {zh: "呃，答应过了呀。{amount}根{item}，{when}到桥边。", en: "Uh, I promised already. It's {amount} poles of {item}, at the bridge {when}."}
  goods_enough:
    - {zh: "{item}够了够了，再送我都不好意思了。", en: "That's plenty of {item}. Any more and I'd feel silly."}
    - {zh: "桥边堆的{item}够用了。", en: "The {item} piled at the bridge is plenty."}
  point_heard:
    - {zh: "这个嘛……我不清楚。不过听{name}提起过，你去问问？", en: "Well, now... I don't know. I did hear {name} mention it, though. Why not ask?"}
    - {zh: "我真不知道啊。好像{name}说起过，你去问问吧。", en: "I really don't know. I think {name} talked about it, so go and ask."}
  point_hub:
    - {zh: "这我答不上来。你去问{name}，什么消息都听得到。", en: "I can't answer that. Ask {name}, who hears every bit of news."}
    - {zh: "我不知道。{name}整天守着茶馆，镇上的事都清楚。", en: "I don't know. Try {name}, who sits in the teahouse all day and knows the town's business."}
  gift_like:
    - {zh: "{item}啊，正好。糊灯面就缺这个。", en: "Oh, {item}, perfect. That's just what the lantern shades need."}
    - {zh: "这{item}好，我得省着用。", en: "Good {item}. I'll have to make it last."}
  gift_neutral:
    - {zh: "{item}？那我就不客气了。", en: "Some {item}? Then I won't say no."}
    - {zh: "{item}啊，我收下了。回头分给大家。", en: "Some {item}. Thanks, I'll share that round."}
  gift_dislike:
    - {zh: "{item}我用不上，不过谢谢你啊。", en: "I've no use for {item}, but thanks all the same."}
    - {zh: "{item}啊……我留着也是浪费，你送别人吧。", en: "Ah, {item}... it'd be wasted on me. Give it to someone else."}
frames:
  seen:
    - {zh: "实话跟你讲，{line}。", en: "I'll level with you, {line}."}
    - {zh: "{line}，这个我最清楚。", en: "{line}. Nobody knows that better than me."}
  heard:
    - {zh: "我是听{teller}讲的，说{line}。", en: "I got it from {teller}, who said {line}."}
    - {zh: "{teller}跟我讲，说是{line}。", en: "{teller} was telling me that {line}."}
  unknown:
    - {zh: "都这么传，说{line}。", en: "That's what's going round, that {line}."}
    - {zh: "有人这么讲，{line}。谁讲的我也说不上来。", en: "Some folks say {line}. Who said it first, I couldn't tell you."}
  own:
    - {zh: "我觉着吧，{line}。", en: "If you want my take, {line}."}
    - {zh: "要我说，{line}。", en: "My two cents, {line}."}
  guess_own:
    - {zh: "这个嘛……{hedge}{line}。", en: "Well now... {hedge} {line}."}
    - {zh: "说不好的，{hedge}{line}。", en: "Hard to say, but {hedge} {line}."}
  guess_heard:
    - {zh: "听{teller}那口气，{hedge}{line}。", en: "The way {teller} told it, {hedge} {line}."}
    - {zh: "{teller}也是随口一说，{hedge}{line}。", en: "{teller} was only saying, but {hedge} {line}."}
  guess_unknown:
    - {zh: "不知道谁讲的，{hedge}{line}。", en: "Can't say who told me, but {hedge} {line}."}
    - {zh: "就是听人瞎传，{hedge}{line}。", en: "It's just talk going round, but {hedge} {line}."}
  rival:
    - {zh: "不过{teller}跟我说的又不一样，说{line}。", en: "Though {teller} told me something different, that {line}."}
    - {zh: "{teller}说的又是另一样，说{line}。我也拿不准了。", en: "{teller} told it another way, that {line}. Now I'm not sure."}
  known:
    - {zh: "{line}，这谁不知道啊。", en: "{line}. Ask anyone."}
    - {zh: "{line}。全镇都晓得。", en: "{line}. The whole town knows."}
hedges:
  - {zh: 我猜, en: I'd guess}
  - {zh: 没准是, en: I'd wager}
# What he says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. The town blames him for the rail until it is set straight in public, so his
# greeting turns on whether it has been, and his epilogue on whether it was.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "我是李二，在扎灯坊糊灯的。镇上怎么说我，你该听说了吧？", en: "I'm Li Er. I paste lanterns at the workshop. You'll have heard what the town says about me?"}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你说过的事……算了，我也不好意思催。", en: "You said you would... never mind. I'd feel awkward pressing you."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚的灯有十二盏是我糊的，可别灭了。", en: "Twelve of tonight's lanterns are mine. Don't let them go out."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥的事说开了。我这脸，总算抬得起来了。", en: "The bridge business is out in the open. I can hold my head up at last."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家能坐一桌吃饭了，我心里也敞亮多了。", en: "The two houses sat down to eat together. I feel lighter for it."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你答应我的事办了。嘿，我欠你一回。", en: "You did what you promised. Heh, I owe you one."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "我那晚只是找灯笼，大伙儿总算信了。不容易啊。", en: "I was only looking for my lantern that night, and folks finally believe it. It wasn't easy."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又找我？", en: "Me again?"}
      - {zh: "还有事？你说。", en: "Something more? Go on."}
  - id: plain
    lines:
      - {zh: "镇上的话我都听见了。你要问什么，尽管问。", en: "I've heard everything the town says. Ask me whatever you like."}
      - {zh: "我在这儿呢，有话就说。", en: "I'm right here. Say what you need."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "没事没事，我等着。", en: "No trouble at all, I'll wait."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "晚上来看灯啊。", en: "Come and see the lanterns tonight."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说开了真好。", en: "It's good to have it said."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "谢谢你替我说话啊。", en: "Thanks for speaking up for me."}
  - id: plain
    lines:
      - {zh: "回见啊，总管。", en: "See you, Manager."}
      - {zh: "我回工坊了，灯还没糊完。", en: "I'm off to the workshop. The lanterns aren't done."}
epilogue:
  - id: full
    when: [{kind: cleared}, {kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}]
    text: {zh: "李二糊的灯排在游灯最前头。再没有人提起毁桥的闲话。", en: "The lanterns Li Er pasted led the parade. Nobody spoke of the rumour any more."}
  - id: cleared_bridge
    when: [{kind: cleared}, {kind: flag, flag: bridge_fixed}]
    text: {zh: "李二提着自己糊的灯过了桥。街坊看见了，都点头打招呼。", en: "Li Er crossed the bridge with a lantern from the workshop. The neighbours saw and nodded hello."}
  - id: cleared_detour
    when: [{kind: cleared}, {kind: flag, flag: detour_done}]
    text: {zh: "李二举着灯走进夹道，一路都有人打招呼。", en: "Li Er walked into the lane with a lantern raised, and people called out greetings all the way."}
  - id: blamed
    when: [{any: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: detour_done}]}]
    text: {zh: "李二也提了灯。路边还有人压低声音，议论毁桥的事。", en: "Li Er carried a lantern too, but at the roadside some still lowered their voices over the broken railing."}
  - id: apart
    text: {zh: "李二守在扎灯坊里，把没点的灯一盏盏收了起来。", en: "Li Er stayed in the workshop and put away the unlit lanterns one by one."}
