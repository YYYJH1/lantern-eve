# The Teahouse Keeper, who keeps the teahouse and knows everyone's business. Chatty and dramatic,
# every sentence an exclamation, a whisper meant to be overheard, and no secret she has ever kept.
person: cha_laoban
voice:
  zh: 茶馆老板娘。话多，戏也多，句句带感叹，爱压低嗓门说给全堂人听，什么秘密都存不住。
  en: The teahouse keeper. Chatty and dramatic, every sentence an exclamation, whispers so the whole room can hear, cannot keep a secret.
lines:
  asleep:
    - {zh: "呼……水开了……谁来添茶……（睡熟了）", en: "Zzz... the kettle's boiling... who's for tea... (fast asleep)"}
    - {zh: "唔……你听我说……这事儿可大了……（睡熟了）", en: "Mm... listen to me... this is huge... (fast asleep)"}
  busy:
    - {zh: "哎哟喂！客官，我这儿忙得团团转！回头再聊！", en: "Oh my stars! I'm spinning like a top here! Come back and we'll have a proper chat!"}
    - {zh: "总管，您瞧瞧这满堂的客人！我真走不开啊！", en: "Manager, just look at this packed house! I can't get away!"}
  timeout:
    - {zh: "哎呀，水又开了！我得去看看！不然茶壶要烧穿了！", en: "Oh, the kettle's boiling over again! I must see to it, or it'll burn clean through!"}
    - {zh: "客人们都等着我呢！下回再慢慢聊！", en: "The guests are all waiting for me! We'll chat properly next time!"}
  unknown:
    - {zh: "哎哟，这个我是真不知道！", en: "Oh, I truly don't know about that one!"}
    - {zh: "这可把我问住了！我一点风声都没听到！", en: "Now you've stumped me! Not a whisper of it has reached me!"}
  evade:
    - {zh: "哎呀，这个嘛……我可不好说！", en: "Oh, well... that's not something I can go telling!"}
    - {zh: "您就别问啦！我嘴上有把锁呢！", en: "Please don't ask! My lips are sealed!"}
  not_said:
    - {zh: "我可没说过这话！千万别说是我说的！", en: "I never said that! Don't you go saying it was me!"}
    - {zh: "哎哟喂，谁传出去的？反正不是我！", en: "Who spread that? Not me, anyway!"}
  not_so:
    - {zh: "不是不是！哪有这回事！", en: "No, no! There was nothing of the sort!"}
    - {zh: "您听岔啦！事情根本不是这样！", en: "You've got the wrong end of the stick! It wasn't like that at all!"}
  keeper_no:
    - {zh: "哎呀，咱们才头一回见面呢！改日，改日再说！", en: "Oh, we've only just met! Another day, another day!"}
    - {zh: "这个可不能随便给生客看呀！", en: "I can't just show this to any new face!"}
  took_in:
    - {zh: "哎哟，原来是这么回事！我记下啦！", en: "Oh my, so that's how it was! I'll keep that in mind!"}
    - {zh: "是吗！这可是新鲜事！我心里有数啦！", en: "Is that so! That's news! I'll bear it in mind!"}
  knew:
    - {zh: "您这消息已经是旧闻啦！", en: "That's old news, I'm afraid!"}
    - {zh: "嗐，这事我比您先知道！茶馆里什么消息传不到！", en: "Pah, I knew it before you did! What news doesn't reach a teahouse!"}
  doubted:
    - {zh: "不对不对，我听到的可不是这样！", en: "No, no, that's not what I heard!"}
    - {zh: "哎哟，这跟我听来的差远啦！", en: "Oh dear, that's quite different from what I heard!"}
  caught:
    - {zh: "好啊你！竟敢骗我！往后你的话，我一个字也不信啦！", en: "Well I never! You dared to lie to me! I won't believe another word from you!"}
    - {zh: "我的天爷，原来你一直在撒谎！从此别想我再信你！", en: "Heavens above, you've been lying all along! Never expect my trust again!"}
  deal:
    - {zh: "好嘞！一言为定，一言为定！", en: "Wonderful! It's a deal, a deal!"}
    - {zh: "成交成交！这回可说定啦！", en: "Done, done! It's settled this time!"}
  empty:
    - {zh: "哎哟，光动嘴皮子可不行！我不信！", en: "Oh, flapping your lips won't do! I don't believe it!"}
    - {zh: "空口无凭呀！这种话我听得多啦！", en: "No proof at all! I've heard plenty of that sort!"}
  kept_thanks:
    - {zh: "哎呀呀，总管真是言而有信！这份情我记在心里啦！", en: "Oh my, the Manager is truly as good as their word! I'll treasure this kindness!"}
    - {zh: "您说到做到了！我得把这事讲给全镇听！", en: "You did what you said! I must tell the whole town about this!"}
  will_do:
    - {zh: "好嘞！这事包在我身上！", en: "Splendid! Leave it all to me!"}
    - {zh: "没问题！我这就去张罗！", en: "No trouble at all! I'll get right on it!"}
  cannot:
    - {zh: "哎哟，这个忙我可帮不上呀！", en: "Oh dear, this is one favour I just can't do!"}
    - {zh: "真对不住！我实在办不到！", en: "I'm so sorry! It's simply beyond me!"}
  turned_down:
    - {zh: "哎呀，对不住了！这事我不能答应！", en: "Oh, I'm so sorry! I just can't agree to this!"}
    - {zh: "使不得使不得！这事万万不行！", en: "Oh no, no, no! That simply won't do!"}
  said_already:
    - {zh: "哎哟，我刚才不是讲过了嘛！", en: "Oh my, didn't I just tell you!"}
    - {zh: "说过啦说过啦！您可别让我再讲一遍！", en: "Already said, already said! Don't make me tell it all over again!"}
  closed:
    - {zh: "哎呀，这会儿真不凑巧！您换个时辰再来！", en: "Oh, what bad timing! Come back at another hour!"}
    - {zh: "现在不行啊！等客人少了再说！", en: "Not right now! Wait till the crowd thins out!"}
  needs_nod:
    - {zh: "这事得先问过族长大人才行！", en: "I must ask the clan elder before anything!"}
    - {zh: "没有族长点头，我可不敢拍板！", en: "Without the elder's nod, I wouldn't dare settle it!"}
  nothing_to_say:
    - {zh: "这事儿呀，我还真没什么好说的！", en: "As for that, I really have nothing to tell!"}
    - {zh: "哎哟，连我都没话说了！稀奇吧！", en: "Even I have nothing to say! How rare!"}
  testified:
    - {zh: "我说的可都是亲眼看见的！一个字不假！", en: "Everything I say I saw with my own eyes! Not a word is false!"}
    - {zh: "我这个人嘴快，但亲眼见的才讲！", en: "I may be quick with my tongue, but I only tell what I saw myself!"}
  too_late:
    - {zh: "哎哟，这么晚啦！明早再来，我给您留壶好茶！", en: "Goodness, it's so late! Come in the morning and I'll keep a good pot of tea for you!"}
    - {zh: "天都黑啦！明天一早咱们再慢慢聊！", en: "It's gone dark! Let's have a proper chat first thing tomorrow!"}
  will_ask:
    - {zh: "好嘞！我这就去探探人家的口风！", en: "Right! I'll go and sound them out at once!"}
    - {zh: "包在我身上！我最会传话啦！", en: "Leave it to me! Nobody carries a message like I do!"}
  will_call:
    - {zh: "好嘞！我这就去把大伙儿都招呼到祠堂来！", en: "Wonderful! I'll go and call everyone to the hall!"}
    - {zh: "我腿脚勤快！一会儿工夫全镇都知道啦！", en: "I'm quick on my feet! The whole town will know in no time!"}
  hard_hc_li_bamboo:
    - {zh: "那谣言不当众说清楚，这事就别想谈！", en: "If that slander isn't cleared in public, there's nothing to talk about!"}
    - {zh: "先把谣言当众说清楚！再来谈别的！", en: "Clear that slander in public first! Then we'll talk about the rest!"}
  hard_hc_li_bamboo_rumour:
    - {zh: "满镇都在传那谣言！你这总管倒好，一声不吭！这事免谈！", en: "The whole town is buzzing with that slander! And you, Manager, not a peep out of you! Forget it!"}
    - {zh: "谣言都传遍啦！总管你一声不吭，我可不敢点头！", en: "That slander has gone round the whole town! You say not a word, Manager, so I won't say yes!"}
  hard_other:
    - {zh: "这可使不得！万万使不得！", en: "That will never do! Never!"}
    - {zh: "免谈免谈！连提都别提！", en: "Out of the question! Don't even mention it!"}
  elder_yes:
    - {zh: "哎呀，这下我全明白啦！就这么办！", en: "Oh, now I understand it all! Let's do just that!"}
    - {zh: "说得好！太有道理啦！我服！", en: "Well said! So very sensible! I'm sold!"}
  elder_no:
    - {zh: "光这点话哪够呀！我还不能信！", en: "That's hardly enough! I can't believe it yet!"}
    - {zh: "哎呀，还差一大截呢！", en: "Oh, it falls well short!"}
  objection_withdrawn:
    - {zh: "哎呀，当众说清楚啦！那我不拦着啦！", en: "Well, it's all been said in public! Then I won't hold you back!"}
    - {zh: "好好好！既然说明白了，我这边放行！", en: "Fine, fine! Since it's all made clear, you have my go-ahead!"}
  witness_in_public:
    - {zh: "我就看见这么多！多一个字我都不敢讲！", en: "That's all I saw! I wouldn't dare say a single word more!"}
    - {zh: "看见什么说什么！可别让我编！", en: "I say what I saw! Don't make me invent anything!"}
  batch_promised:
    - {zh: "好嘞！明早一准送到！包在我身上！", en: "Splendid! It'll be there first thing tomorrow! Leave it to me!"}
    - {zh: "放心放心！天一亮就送去！", en: "Don't you worry! It goes out the moment it's light!"}
  bamboo_arrived:
    - {zh: "哎呀！竹料送到桥边啦！", en: "Oh my! The bamboo has reached the bridge!"}
    - {zh: "瞧瞧！竹子到了！桥有指望啦！", en: "Look at that! The bamboo's here! The bridge has a chance!"}
  promise_open:
    - {zh: "哎哟，我答应过啦！{when}送到桥边，{amount}根{item}！", en: "Oh my, I promised already! It's {amount} poles of {item} at the bridge {when}!"}
    - {zh: "说好啦说好啦！{amount}根{item}，{when}一准到桥边！", en: "Settled, settled! It's {amount} poles of {item}, and they reach the bridge {when}!"}
  goods_enough:
    - {zh: "哎呀！桥边的{item}已经堆够啦！", en: "Oh my! The {item} at the bridge is piled high enough already!"}
    - {zh: "够啦够啦！桥边的{item}再多就堆不下啦！", en: "Enough, enough! There's no room at the bridge for more {item}!"}
  point_heard:
    - {zh: "哎哟，这事我是真不知道！不过我听{name}悄悄提过，您去问问！", en: "Oh, I truly don't know! But I heard {name} whispering about it, so go and ask!"}
    - {zh: "我一点风声都没听到！倒是{name}好像说起过，您快去打听！", en: "Not a whisper has reached me! But {name} seemed to be talking about it, so hurry and ask!"}
  point_hub:
    - {zh: "这事我说不准！您去找{name}，镇上的事样样听得到！", en: "I can't say! Go and see {name}, who hears every bit of news in town!"}
    - {zh: "哎呀，这我答不上来！{name}那儿消息最灵通，您去试试！", en: "Oh dear, I can't answer that! Try {name}, whose ears are the quickest in town!"}
frames:
  seen:
    - {zh: "我亲眼瞧见的！千真万确：{line}！", en: "I saw it with my very own eyes, cross my heart: {line}!"}
    - {zh: "我当时就在那儿！亲眼所见：{line}！", en: "I was standing right there, and I saw it all: {line}!"}
  heard:
    - {zh: "{teller}悄悄告诉我的：{line}！", en: "{teller} whispered it to me: {line}!"}
    - {zh: "我可是听{teller}亲口讲的：{line}！", en: "I had it from {teller}'s own mouth: {line}!"}
  unknown:
    - {zh: "您猜外头怎么说：{line}！", en: "You'll never guess what they're saying: {line}!"}
    - {zh: "我听来往的客人讲：{line}！", en: "I heard it from the customers coming and going: {line}!"}
  own:
    - {zh: "我这茶馆老板娘说句公道话：{line}！", en: "I'll say this, and fairly: {line}!"}
    - {zh: "我心里明镜似的：{line}！", en: "I can see it clear as day: {line}!"}
  guess_own:
    - {zh: "这可是我瞎琢磨的！{hedge}{line}！", en: "That's only my own wild guess! {hedge} {line}!"}
    - {zh: "千万别往外传！{hedge}{line}！", en: "Don't breathe a word of this! {hedge} {line}!"}
  guess_heard:
    - {zh: "{teller}透了点风声！{hedge}{line}！", en: "{teller} dropped me a hint! {hedge} {line}!"}
    - {zh: "听{teller}那神神秘秘的口气，{hedge}{line}！", en: "The way {teller} said it, all mysterious, {hedge} {line}!"}
  guess_unknown:
    - {zh: "也不知谁在背后嚼的舌根！{hedge}{line}！", en: "I couldn't tell you who's been wagging their tongue! {hedge} {line}!"}
    - {zh: "风声满街飞！{hedge}{line}！", en: "Rumours are flying all over town! {hedge} {line}!"}
  rival:
    - {zh: "不过{teller}也偷偷跟我说了另一句：{line}！", en: "But {teller} whispered something else to me, too: {line}!"}
    - {zh: "哎呀，{teller}还讲过另一种呢：{line}！", en: "Oh, and {teller} told me another version: {line}!"}
hedges:
  - {zh: 我敢打赌, en: I'll wager}
  - {zh: 我拿茶壶担保, en: I'd bet my teapot}
# What she says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. Everything in town passes over her tables, so her greeting turns on the news
# of the day: the slander cleared in her own room, the truth told, the two families at one table.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "哎呀！您就是新来的总管！快坐快坐，喝杯茶！", en: "Oh my! You're the new Manager! Sit, sit, have some tea!"}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "哎哟，总管！您答应人家的事，满茶馆都在传呢！", en: "Oh dear, Manager! The whole teahouse is passing round what you promised and didn't do!"}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚游灯！茶桌都搬到街口去啦！", en: "The parade's tonight! I've carried the tea tables out to the street corner!"}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家当家的同桌喝茶啦！我这茶馆要出名啦！", en: "The two family heads drank tea at one table! My teahouse will be famous!"}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥的事说清啦！我早就说有蹊跷！", en: "The bridge business is cleared up! I always said there was something fishy!"}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "总管的信用，我替您在茶桌上传开啦！", en: "I've been spreading word of the Manager's good faith at every table!"}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "李二的事当着满屋人说清啦！我亲耳听的！", en: "Li Er's business was set straight in front of the whole room! I heard it with my own ears!"}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来啦！新鲜事我留着呢！", en: "Back again! I've saved some news for you!"}
      - {zh: "快坐快坐！", en: "Sit, sit!"}
  - id: plain
    lines:
      - {zh: "茶刚沏好！镇上有什么新鲜事，我这儿都知道！", en: "The tea's just brewed! Whatever's new in town, I know it!"}
      - {zh: "来来来，听我给您说一件事！", en: "Come, come, let me tell you something!"}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "那件事我可没往外说……才说了三桌！", en: "I haven't told that to anyone... only three tables!"}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚灯会上见！别迟到！", en: "See you at the lanterns tonight! Don't be late!"}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "这回的故事好听！我要讲上一年！", en: "This is a good story! I'll be telling it for a year!"}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "一杯茶，两家变一家啦！", en: "One cup of tea and the two houses are one!"}
  - id: plain
    lines:
      - {zh: "慢走！有新鲜事记得告诉我！", en: "Take care! Tell me any news you hear!"}
      - {zh: "回头来喝茶啊！", en: "Come back for tea!"}
epilogue:
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "茶馆老板娘把茶桌摆到了桥头，请每个过桥的人喝了一碗。", en: "The teahouse keeper set tables at the bridgehead and gave every passer-by a bowl of tea."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    text: {zh: "茶馆老板娘把桥的事讲得有声有色。这一回，句句是真的。", en: "The teahouse keeper told the story of the bridge with every flourish, and this time every word of it was true."}
  - id: peace
    when: [{kind: flag, flag: reconciled}]
    text: {zh: "茶馆老板娘端着茶盘看两家人同桌，笑得合不拢嘴。", en: "The teahouse keeper carried a tray past the two families at one table and could not stop smiling."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "茶馆老板娘守在桥边卖茶，把各家的猜测一桌桌传下去。", en: "The teahouse keeper sold tea at the bridge, passing each table's guesses on to the next."}
  - id: apart
    text: {zh: "茶馆老板娘关了半扇门，嘴里还念叨着那座没修好的桥。", en: "The teahouse keeper shut half the door and kept muttering about the bridge that was never mended."}
