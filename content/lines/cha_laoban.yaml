# The Teahouse Keeper, who keeps the teahouse by the river and hears the town's news before anyone.
# She talks a lot with her hands never still, lowers her voice for a secret that the whole room
# then hears, says where a piece of news came from without being asked, and raises her voice only
# when something has really happened.
person: cha_laoban
voice:
  zh: 茶馆老板娘。话多，消息灵，说话时手上不停，添水、擦桌子、招呼客人。爱压低声音讲别家的事，讲完满屋子都听见了。高兴了就笑，平常说话不带感叹，真吃了一惊才提高嗓门。消息从哪来会顺口带出来，比如谁在这儿坐了半天。不想说的事先说「这个呀，我可不能讲」，往往还是讲了一半。对总管说「您」。叫李老太「李家老太太」，叫李二「李家老二」，叫私塾先生「先生」，叫船夫老何「老何」。
  en: The teahouse keeper. Talks a lot and hears everything first, hands busy with cups and tables while she talks. Tells a secret in a low voice that the whole room hears. Laughs when pleased and raises her voice only when something really surprises her. Says where a piece of news came from without being asked. When she would rather not say, she starts "Oh, that one I can't tell" and tells half of it anyway.
call:
  li_laotai: {zh: 李家老太太, en: Granny Li}
  li_er: {zh: 李家老二, en: Li Er}
  sishu_xiansheng: {zh: 先生, en: the Schoolmaster}
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "呼……水开了……谁的茶……（睡熟了）", en: "Zzz... the water's boiling... whose tea is this... (fast asleep)"}
    - {zh: "唔……这个可不能往外讲……（睡熟了）", en: "Mm... mustn't tell anyone this... (fast asleep)"}
  busy:
    - {zh: "一屋子客人等着添水，我这会儿走不开。您晚点再来。", en: "A roomful of customers is waiting for hot water and I can't get away just now. Come back a bit later."}
    - {zh: "后头的水还没烧开，前头又坐下一桌。您先忙您的。", en: "The water in the back isn't boiling yet and another table just sat down out front. You go on with your day."}
  timeout:
    - {zh: "水开了，我得去灌壶。您回头再来坐。", en: "The water's boiling and the pots need filling. Come and sit again later."}
    - {zh: "那桌客人在叫我添水。咱们下回接着说。", en: "That table's calling for more water. We'll pick this up next time."}
  unknown:
    - {zh: "这个还真没人在我这儿说起过。", en: "Nobody has ever brought that up in here."}
    - {zh: "这事我没听说，茶桌上也没人提。", en: "I haven't heard of it, and nobody's raised it at the tables either."}
  evade:
    - {zh: "这个呀，我可不能讲。不过……算了，您别问了。", en: "Oh, that one I can't tell. Though... no, don't ask me."}
    - {zh: "这事我答应过人家，不往外说的。", en: "I promised I wouldn't pass that one on."}
  not_said:
    - {zh: "我可没这么讲过。", en: "I never put it like that."}
    - {zh: "这话不是从我嘴里出去的。", en: "Those words never left my mouth."}
  not_so:
    - {zh: "不对，没这回事。", en: "No, that's not how it went."}
    - {zh: "您听岔了，不是这样。", en: "You heard that wrong. It wasn't like that."}
  keeper_no:
    - {zh: "咱们才头一回打交道，这个先不急。", en: "This is the first time we've dealt with each other. There's no hurry for that."}
    - {zh: "生客我可不敢随便给看。您多来几回再说。", en: "I don't show that to a new face. Come by a few more times first."}
  took_in:
    - {zh: "是吗？这我还头一回听说。", en: "Is that so? That's the first I've heard of it."}
    - {zh: "原来是这么回事，我可记住了。", en: "So that's how it was. I'll remember that."}
  knew:
    - {zh: "这事我早听说了，在我这儿都讲过好几回了。", en: "I heard that a while ago. It's been told in here a few times already."}
    - {zh: "您说的这个，早有人在我这儿讲过了。", en: "Someone told that one in here before you did."}
  doubted:
    - {zh: "跟我在茶桌上听的对不上。", en: "That doesn't match what I heard at the tables."}
    - {zh: "不对呀，我这儿听来的是另一个样。", en: "That's not right. What I heard in here was different."}
  caught:
    - {zh: "原来那话是你编的。往后你说什么，我都得先打个折扣。", en: "So you made that up. From now on I'll take whatever you say with a pinch of salt."}
    - {zh: "好啊，我还替你传了好几桌！往后你的话我可不敢再往外讲了。", en: "Well! And I passed it round half the room for you. I won't repeat a word of yours again."}
  deal:
    - {zh: "说定了。回头我给您留个靠窗的座。", en: "It's a deal. I'll keep you a seat by the window."}
    - {zh: "行，就照您说的办。", en: "All right, we'll do it your way."}
  empty:
    - {zh: "嘴上说说谁都会。等您真办了再讲。", en: "Anyone can say that. Tell me again when it's done."}
    - {zh: "这种话我一天要听好几回。", en: "I hear that sort of thing several times a day."}
  kept_thanks:
    - {zh: "您说到做到，这个我得跟大伙儿讲讲。", en: "You did what you said. I'll be telling people about that."}
    - {zh: "您答应的真办了，我记着您的好。", en: "You did what you promised, and I won't forget it."}
  will_do:
    - {zh: "行，交给我就是了。", en: "Fine, just leave it to me."}
    - {zh: "好，等这壶水开了我就去办。", en: "All right. I'll see to it as soon as this pot boils."}
  cannot:
    - {zh: "这个我真帮不上，我连茶馆门都难得出。", en: "I really can't help there. I hardly ever get out of the teahouse."}
    - {zh: "这忙我帮不了，您另找人吧。", en: "I can't do that for you. You'll have to find someone else."}
  turned_down:
    - {zh: "对不住，这个我不能应。", en: "Sorry, that's one I can't agree to."}
    - {zh: "这事我应不下来，您别为难我了。", en: "I can't agree to that. Please don't press me."}
  said_already:
    - {zh: "刚才不是跟您讲过了吗？", en: "Didn't I just tell you that?"}
    - {zh: "这个我说过了，您再想想。", en: "I told you that already. Think back."}
  closed:
    - {zh: "这会儿不行，等客人散了些再说。", en: "Not now. Wait till the crowd thins out a bit."}
    - {zh: "眼下腾不出空来，您换个时辰来。", en: "I've no time to spare just now. Try me at another hour."}
  needs_nod:
    - {zh: "这个我做不了主，得先问问族长。", en: "That's not mine to decide. I'd have to ask the clan elder."}
    - {zh: "族长没发话，我可不敢拍板。", en: "The elder hasn't said yes, and I won't settle it on my own."}
  nothing_to_say:
    - {zh: "这事我插不上嘴。", en: "That's one I can't say a word about."}
    - {zh: "难得，这事我还真没话说。", en: "For once, I've got nothing to say about it."}
  testified:
    - {zh: "这是我亲眼看见的，不是听谁讲的。", en: "This is what I saw myself, not something somebody told me."}
    - {zh: "这回不是听来的，是我自己看见的。", en: "This time I didn't hear it from anyone. I saw it myself."}
  too_late:
    - {zh: "都这个时辰了，我要上门板了。明早来，给您留壶热茶。", en: "It's this late already and I'm putting the shutters up. Come in the morning and I'll keep a pot hot for you."}
    - {zh: "天黑了，茶馆要关门了。明天一早再来吧。", en: "It's dark and the teahouse is closing. Come early tomorrow."}
  will_ask:
    - {zh: "行，我去替您探探口风。", en: "All right, I'll go and sound them out for you."}
    - {zh: "这话我替您带到。传话这种事，我在行。", en: "I'll pass that on for you. Carrying word is something I'm good at."}
  will_call:
    - {zh: "我让来喝茶的都捎个信。一会儿祠堂见。", en: "I'll have everyone who comes in for tea pass the word. See you at the hall shortly."}
    - {zh: "这事好办，半个镇的人都在我这儿喝茶。我这就去喊。", en: "That's easy. Half the town drinks tea in here. I'll go and call them now."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话不当着大家说清楚，这事没法谈。", en: "Until that rumour is cleared up in front of everyone, there's nothing to talk about."}
    - {zh: "先把那些闲话当众说清楚，别的再说。", en: "Clear that rumour up in public first. Then we'll talk about the rest."}
  hard_hc_li_bamboo_rumour:
    - {zh: "满镇都在传那些闲话，您一句话也不说。这事我不能点头。", en: "The whole town is passing that rumour round and you haven't said a word. I can't say yes to this."}
    - {zh: "茶桌上天天在讲那些闲话，您倒一声不吭。这个我不应。", en: "That rumour comes up at my tables every day and you keep quiet about it. I won't agree to this."}
  hard_other:
    - {zh: "这事您就别提了。", en: "Don't even bring that up."}
    - {zh: "这个不行，说什么也不行。", en: "No. Whatever you say, no."}
  elder_yes:
    - {zh: "这下我听明白了，就这么办吧。", en: "Now I follow. Let's do it that way."}
    - {zh: "您这么一讲，我心里就有底了。", en: "Put like that, I know where I stand."}
  elder_no:
    - {zh: "光这几句，我还信不过。", en: "A few words like that aren't enough for me yet."}
    - {zh: "还差得远呢。", en: "That's still a long way short."}
  objection_withdrawn:
    - {zh: "话当着一屋子人说开了，我也就不拦着了。", en: "It's been said out in front of a whole room, so I won't stand in the way."}
    - {zh: "说开了就好。我这边没话讲了。", en: "Good, it's out in the open. I've nothing more to say against it."}
  witness_in_public:
    - {zh: "我就看见这些，多一句我也不添。", en: "That's all I saw. I won't add a word to it."}
    - {zh: "看见的我都说了，没看见的我不编。", en: "I've said what I saw. What I didn't see, I won't make up."}
  batch_promised:
    - {zh: "行，明天一早就送过去。", en: "All right. It goes over first thing tomorrow."}
    - {zh: "放心，天一亮就送到。", en: "Don't worry. It'll be there at first light."}
  bamboo_arrived:
    - {zh: "竹料送到桥边了。这下桥有指望了。", en: "The bamboo's at the bridge. Now there's some hope for the bridge."}
    - {zh: "桥边堆上竹子了，来喝茶的都在说。", en: "There's bamboo stacked at the bridge, and everyone coming in for tea is talking about it."}
  promise_open:
    - {zh: "这事我应下了的，{when}把{amount}根{item}送到桥边。", en: "I said yes to that already. It's {amount} poles of {item} at the bridge {when}."}
    - {zh: "说好了的。{when}送{amount}根{item}到桥边，误不了。", en: "That's settled. I'll have {amount} poles of {item} at the bridge {when}, without fail."}
  goods_enough:
    - {zh: "桥边的{item}已经够了，再送就堆不下了。", en: "There's enough {item} at the bridge. Any more and there'll be nowhere to stack it."}
    - {zh: "{item}够用了，不用再往桥边送。", en: "There's plenty of {item} now. No need to send more to the bridge."}
  point_heard:
    - {zh: "这个我说不上来。我听{name}提过一嘴，您去问问。", en: "I couldn't tell you. I heard {name} mention it, so go and ask."}
    - {zh: "这事我不清楚。倒是{name}在我这儿说起过，您去问问。", en: "I'm not sure about that. But {name} talked about it in here, so go and ask."}
  point_hub:
    - {zh: "这事我也说不准。您去问问{name}，兴许知道得多些。", en: "I can't say for sure. Ask {name}, who may know more."}
    - {zh: "我这儿没听到。{name}那边消息多，您去问问。", en: "Nothing's reached me. Ask {name}, who hears plenty."}
  gift_like:
    - {zh: "{item}啊，我正缺这个。谢谢您，回头请您喝茶。", en: "Oh, {item}, just what I was short of. Thank you. Your next tea's on me."}
    - {zh: "{item}我收下了。您这人真会挑。", en: "I'll take the {item}. You do know how to choose."}
  gift_neutral:
    - {zh: "{item}？我这儿天天泡，不缺。不过谢谢您。", en: "Some {item}? I brew tea all day, I've plenty. But thank you."}
    - {zh: "{item}也成，放柜上吧。", en: "Some {item} will do. Put them on the counter."}
  gift_dislike:
    - {zh: "{item}我这儿用不上，又不扎灯。", en: "I've no use for {item}. I don't make lanterns."}
    - {zh: "{item}啊，您拿去扎灯坊吧。那儿用得着。", en: "Some {item}. Take it to the lantern workshop. They can use it there."}
frames:
  seen:
    - {zh: "{line}。这个我亲眼看见的。", en: "{line}. I saw that with my own eyes."}
    - {zh: "这可不是听来的，我亲眼看见的。{line}。", en: "This isn't hearsay. I saw for myself that {line}."}
  heard:
    - {zh: "{teller}在我这儿喝茶时讲的。说{line}。", en: "{teller} told it over tea in here, and the story was that {line}."}
    - {zh: "这话是{teller}跟我讲的。说是{line}。", en: "I had this from {teller}, who said {line}."}
  unknown:
    - {zh: "茶桌上都这么传。说{line}。", en: "It's going round all the tables that {line}."}
    - {zh: "来喝茶的客人讲的，是谁我记不清了。说是{line}。", en: "Some customer said it and I can't remember who. The talk was that {line}."}
  own:
    - {zh: "这是我自己琢磨的。{line}。", en: "I worked this out on my own, and I think {line}."}
    - {zh: "要我说呀，{line}。", en: "If you want my opinion, {line}."}
  guess_own:
    - {zh: "这是我瞎猜的，您可别往外说。{hedge}{line}。", en: "This is just my guess, so keep it to yourself. {hedge} {line}."}
    - {zh: "我也就是这么一猜。{hedge}{line}。", en: "It's only a guess. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}话里有话。{hedge}{line}。", en: "{teller} was hinting at something. {hedge} {line}."}
    - {zh: "{teller}跟我嘀咕过几句。{hedge}{line}。", en: "{teller} muttered a few words to me about it. {hedge} {line}."}
  guess_unknown:
    - {zh: "也不知是谁先讲起的。{hedge}{line}。", en: "Who started it, I couldn't say. {hedge} {line}."}
    - {zh: "风声是有，谁传的就不知道了。{hedge}{line}。", en: "There's talk about, but who began it I don't know. {hedge} {line}."}
  rival:
    - {zh: "不过{teller}跟我讲的又不一样。说是{line}。", en: "But {teller} told me something different, that {line}."}
    - {zh: "{teller}在这儿讲过另一个样。说{line}。", en: "{teller} had it another way in here, saying {line}."}
  known:
    - {zh: "{line}。这镇上谁不知道？", en: "{line}. Who in this town doesn't know?"}
    - {zh: "{line}，来喝茶的人都知道。", en: "{line}. Everyone who comes for tea knows that."}
hedges:
  - {zh: 八成, en: I'll wager}
  - {zh: 我看多半, en: I'd think}
# What she says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. Everything in town passes over her tables, so her greeting turns on the news
# of the day: the slander cleared in her own room, the truth told, the two families at one table.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "您就是新来的总管吧？我是这茶馆的老板娘。先坐，我给您倒碗茶。", en: "You'll be the new Manager? I keep this teahouse. Sit down and I'll pour you a bowl of tea."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "总管，您答应人家的事没办。茶桌上都在讲了。", en: "Manager, you didn't do what you promised. It's being talked about at every table."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚游灯，我把茶桌都搬到街口去了。", en: "The lantern parade is tonight, so I've carried the tea tables out to the street corner."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家当家的在我这儿同桌喝茶了。这事我能讲上好几年！", en: "The two family heads drank tea at one table, right here. I'll be telling that one for years!"}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥的事说清楚了。我早觉得里头有蹊跷。", en: "The bridge business is cleared up. I always thought there was something odd about it."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "总管说话算数，这话我跟每桌客人都讲了。", en: "You keep your word, Manager, and I've told every table so."}
  - id: cleared
    when: [{kind: cleared}]
    lines:
      - {zh: "李家老二的事当着一屋子人说清了，我就在边上听着。", en: "Li Er's business was put straight in front of a full room. I was standing right there."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "又来啦？您坐，茶还热着。", en: "Back again? Sit down, the tea's still hot."}
      - {zh: "您坐。刚才还有人在这儿说起您呢。", en: "Have a seat. Someone was talking about you in here just now."}
  - id: plain
    lines:
      - {zh: "茶刚沏好，您先喝一碗。", en: "The tea's just brewed. Have a bowl first."}
      - {zh: "来，坐这边。这儿说话没人听得见。", en: "Come and sit over here. Nobody will hear us in this corner."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "那件事我可没往外说……也就说了三桌。", en: "I haven't told anyone about that... only three tables."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "晚上灯会见，别来晚了。", en: "See you at the lanterns tonight. Don't be late."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "这回的事我能讲上一年，句句都是真的。", en: "I'll be telling this one for a year, and every word of it true."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "一壶茶喝下来，两家人倒像一家了。", en: "One pot of tea and the two families look like one."}
  - id: plain
    lines:
      - {zh: "慢走。听到什么新消息，记得来讲给我听。", en: "Take care. If you hear anything, come and tell me."}
      - {zh: "回头再来喝茶。", en: "Come back for tea sometime."}
epilogue:
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "茶馆老板娘把茶桌摆到了桥头，过桥的人每人一碗茶。", en: "The teahouse keeper set tables at the bridgehead and gave everyone who crossed a bowl of tea."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    text: {zh: "茶馆老板娘把桥的事讲了一遍又一遍。这一回讲的都是真的。", en: "The teahouse keeper told the bridge story over and over. This time all of it was true."}
  - id: peace
    when: [{kind: flag, flag: reconciled}]
    text: {zh: "两家人坐在一张桌上喝茶。茶馆老板娘端着茶盘，笑得合不拢嘴。", en: "The two families sat at one table over tea. The teahouse keeper carried the tray round and could not stop smiling."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "茶馆老板娘在桥边摆了个茶摊。各家怎么猜的，都在茶摊上传了一遍。", en: "The teahouse keeper set up a tea stall by the bridge. Every family's guesses went round that stall."}
  - id: apart
    text: {zh: "茶馆老板娘关了半扇门，嘴里还念叨着那座没修好的桥。", en: "The teahouse keeper half shut the door, still going on about the bridge that never got mended."}
