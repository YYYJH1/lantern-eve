# The Schoolmaster, who teaches the children and edits the Town Gazette. A man of books who speaks
# plainly and in order, drops a learned phrase now and then, calls himself 在下 only now and then,
# and cares whether a thing is true before it goes into the Gazette.
person: sishu_xiansheng
voice:
  zh: 私塾先生，办《镇报》。读书人，说话斯文、有条理，偶尔掉一句书袋，可说的是大白话，不说「曾言及」「据某某所言」这类话。自称「在下」用得少，平常就说「我」。最在乎报上登的是不是真的，还有孩子们念书。不想说的事就说「这事还没查实，在下不好乱讲」。对总管说「您」。叫族长「族长」，叫李老太「李家老太太」，叫船夫老何「老何」。
  en: The schoolmaster, editor of the Town Gazette. Speaks gently and in good order, now and then a learned phrase, but in plain words and never like a report. Cares whether what the Gazette prints is true, and about the children's lessons. When he would rather not say, he says it has not been checked yet.
call:
  li_laotai: {zh: 李家老太太, en: Granny Li}
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "呼……这一期……还缺一篇……（睡熟了）", en: "Zzz... this issue... still one piece short... (fast asleep)"}
    - {zh: "唔……学而时习之……（睡熟了）", en: "Mm... learn, and practise it... (fast asleep)"}
  busy:
    - {zh: "我正校着《镇报》，您改日再来。", en: "I'm proofreading the Gazette. Come another day, please."}
    - {zh: "学生在念书，我走不开。", en: "The pupils are reading and I can't leave them."}
  timeout:
    - {zh: "学生还等着上课，我得回去了。", en: "The pupils are waiting for their lesson. I must go back."}
    - {zh: "时辰到了。报上的稿子还没写完。", en: "It's time. I haven't finished writing for the Gazette."}
  unknown:
    - {zh: "这件事我没听人说过。", en: "Nobody has spoken to me about this."}
    - {zh: "这个我不知道，也没人往报上递过话。", en: "I don't know, and nobody has sent word of it to the Gazette."}
  evade:
    - {zh: "这事还没查实，在下不好乱讲。", en: "This hasn't been checked yet, so I won't speak loosely about it."}
    - {zh: "没查清楚的事，我不往外说。", en: "I don't repeat what hasn't been looked into."}
  not_said:
    - {zh: "这话不是我说的，我说的不是这个。", en: "Those aren't my words. That's not what I said."}
    - {zh: "我从没这样讲过。", en: "I never said it that way."}
  not_so:
    - {zh: "不是这样，您弄错了。", en: "That's not so. You have it wrong."}
    - {zh: "这个说法有出入。", en: "That account doesn't square with the facts."}
  keeper_no:
    - {zh: "你我刚认识，这个以后再说。", en: "We've only just met. That can wait."}
    - {zh: "这东西我不轻易给人看。", en: "I don't show that to people lightly."}
  took_in:
    - {zh: "原来如此，我记下了。", en: "I see. I'll note it down."}
    - {zh: "多谢相告。这事我得核一核。", en: "Thank you for telling me. I'll need to check it."}
  knew:
    - {zh: "这件事我已经听说了。", en: "I had already heard about it."}
    - {zh: "这个我知道，前头已经有人跟我讲过。", en: "I know. Someone told me before you did."}
  doubted:
    - {zh: "我听到的跟这个不一样。", en: "What I heard was not the same."}
    - {zh: "这和我知道的对不上，还得再查。", en: "That doesn't fit what I know. It needs checking."}
  caught:
    - {zh: "原来是你编的。这样的话，我差点登上报。", en: "So you made it up. I nearly printed that in the Gazette."}
    - {zh: "你骗了我。往后你的话，我得先查过再信。", en: "You lied to me. From now on I'll check what you say before I believe it."}
  deal:
    - {zh: "一言为定，我记下了。", en: "Agreed. I've written it down."}
    - {zh: "好，就照这么办。", en: "Good. We'll do it like that."}
  empty:
    - {zh: "空口无凭，我没法信。", en: "There's nothing behind that, so I can't believe it."}
    - {zh: "没凭据的话报上不登，我也不信。", en: "Words without proof don't go in the Gazette, and I don't believe them either."}
  kept_thanks:
    - {zh: "您说到做到，难得。", en: "You did what you said. That's rare."}
    - {zh: "答应的事办到了，多谢。", en: "What you promised got done. Thank you."}
  will_do:
    - {zh: "好，这件事我去办。", en: "Very well, I'll see to it."}
    - {zh: "可以，交给我吧。", en: "Yes, leave it to me."}
  cannot:
    - {zh: "这件事我帮不上忙。", en: "I'm afraid I can't help with that."}
    - {zh: "我只会教书写字，这个办不了。", en: "I can only teach and write. I can't do this."}
  turned_down:
    - {zh: "抱歉，这件事我应不了。", en: "I'm sorry, I can't agree to this."}
    - {zh: "这个请求，恕在下不能从命。", en: "I'm afraid I must decline."}
  said_already:
    - {zh: "这个我刚才说过了。", en: "I said that a moment ago."}
    - {zh: "前面已经讲清楚了，不再重复。", en: "I made that clear before, and I won't repeat it."}
  closed:
    - {zh: "这会儿在上课，请换个时辰再来。", en: "I'm teaching now. Please come at another hour."}
    - {zh: "眼下不方便，晚些再谈。", en: "It isn't convenient just now. Let's talk later."}
  needs_nod:
    - {zh: "这件事得先问过族长。", en: "This must go to the clan elder first."}
    - {zh: "族长没点头，我不好自作主张。", en: "The elder hasn't agreed, and it's not for me to decide alone."}
  nothing_to_say:
    - {zh: "这件事我没看见，说不上什么。", en: "I didn't see it, so I can't tell you anything."}
    - {zh: "这事我没见着，不好乱说。", en: "I didn't see it, and I won't guess."}
  testified:
    - {zh: "在下说的都是亲眼看见的。", en: "Everything I tell you, I saw myself."}
    - {zh: "没亲眼见过的，我不乱说。", en: "I don't talk about what I haven't seen."}
  too_late:
    - {zh: "夜深了，请明早再来。", en: "It's late. Please come back in the morning."}
    - {zh: "时辰太晚了，明天再谈。", en: "It's too late in the day. We'll talk tomorrow."}
  will_ask:
    - {zh: "好，我去替您说明。", en: "Very well. I'll go and explain it for you."}
    - {zh: "这话我替您转达。", en: "I'll pass your words on."}
  will_call:
    - {zh: "好，我这就去请大家到祠堂。", en: "Very well. I'll go and ask everyone to the hall."}
    - {zh: "我让学生们挨家去报个信，祠堂见。", en: "I'll send the pupils round every house with the message. We'll meet at the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言一天不当众澄清，这事就一天不谈。", en: "So long as the rumour stands uncleared in public, this is not up for discussion."}
    - {zh: "先当众把谣言说清楚，再来商量。", en: "Clear up the rumour in public first. Then we can talk it over."}
  hard_hc_li_bamboo_rumour:
    - {zh: "谣言传遍了全镇，总管却一句话不说。这事我不能答应。", en: "The rumour has gone all round town and you haven't said a word, Manager. I can't agree to this."}
    - {zh: "谣言没说清，总管也不开口。我不敢轻易应下。", en: "The rumour hasn't been cleared and you won't speak, Manager. I won't agree lightly."}
  hard_other:
    - {zh: "这事没有商量的余地。", en: "There's no room to bargain on this."}
    - {zh: "断无可能。", en: "That is quite impossible."}
  elder_yes:
    - {zh: "说得在理，证据也对得上。我信服。", en: "That makes sense, and the proof fits. I'm convinced."}
    - {zh: "我听明白了，心服口服。", en: "I understand now, and I accept it fully."}
  elder_no:
    - {zh: "单凭这几句，还难下定论。", en: "On these few words alone, no conclusion can be drawn."}
    - {zh: "理由还不够，我不敢轻信。", en: "The reasons aren't enough yet. I won't believe it lightly."}
  objection_withdrawn:
    - {zh: "事情既然说明白了，我不再阻拦。", en: "Since the matter has been made clear, I won't stand in the way."}
    - {zh: "误会解开了，我没有异议。", en: "The misunderstanding is cleared up. I have no objection."}
  witness_in_public:
    - {zh: "我只说看见的，一个字不增不减。", en: "I tell only what I saw, not a word more or less."}
    - {zh: "我看见的就到这里，其余的不知道。", en: "What I saw ends there. I don't know the rest."}
  batch_promised:
    - {zh: "我答应了，明早送到桥边。", en: "I've said yes. It will reach the bridge tomorrow morning."}
    - {zh: "明早一定送到，这个我可以担保。", en: "It will be there tomorrow morning. I can promise you that."}
  bamboo_arrived:
    - {zh: "竹料到桥边了，桥总算能动工了。", en: "The bamboo is at the bridge. At last the work can start."}
    - {zh: "桥边有了竹料，修桥有望了。", en: "There's bamboo at the bridge now, so the mending has a chance."}
  promise_open:
    - {zh: "我已经答应了，{when}把{amount}根{item}送到桥边。", en: "I've already given my word. It's {amount} poles of {item} at the bridge {when}."}
    - {zh: "这件事早就应下了，{when}交{amount}根{item}。", en: "This was agreed earlier. I'll deliver {amount} poles of {item} {when}."}
  goods_enough:
    - {zh: "桥边的{item}已经够用了。", en: "The {item} at the bridge is already enough."}
    - {zh: "{item}够了，不必再添。", en: "There's enough {item}. No need to add more."}
  point_heard:
    - {zh: "这件事我没听说过。不过听{name}谈起过，您去问问。", en: "I haven't heard of it. But I heard {name} talking about it, so you might ask."}
    - {zh: "我不清楚。记得{name}说起过，可以去问问。", en: "I'm not sure. I remember {name} mentioning it, so ask there."}
  point_hub:
    - {zh: "这件事我无从知道。镇上的消息，问{name}最全。", en: "I've no way of knowing. For the town's news, ask {name}."}
    - {zh: "我不敢乱说。想打听街坊的事，可以去问{name}。", en: "I won't guess. If you want the talk of the street, ask {name}."}
  gift_like:
    - {zh: "{item}，正合我意。多谢。", en: "Ah, {item}, just to my taste. My thanks."}
    - {zh: "{item}？这怎么好意思。在下收下了。", en: "Some {item}? You're too kind. I accept with thanks."}
  gift_neutral:
    - {zh: "{item}啊，有心了。", en: "Some {item}. That's thoughtful."}
    - {zh: "{item}也好，分给学生们吃。", en: "Some {item}, then. The pupils can share them."}
  gift_dislike:
    - {zh: "{item}在下不饮。心意领了。", en: "I don't drink {item}. But I accept the thought."}
    - {zh: "{item}就留着送别人吧。还是多谢。", en: "Better give the {item} to someone else. Thank you all the same."}
frames:
  seen:
    - {zh: "这是在下亲眼所见。{line}。", en: "I was there and saw that {line}."}
    - {zh: "{line}。这是我亲眼所见。", en: "{line}. This I saw with my own eyes."}
  heard:
    - {zh: "{teller}跟我说过。说是{line}。", en: "I heard it from {teller}, who said {line}."}
    - {zh: "我是听{teller}讲的，还没查实。说是{line}。", en: "I had it from {teller}, and I haven't checked it yet. The account was that {line}."}
  unknown:
    - {zh: "镇上有这么个说法。说{line}。", en: "There's a story going round town that {line}."}
    - {zh: "这话是谁先说的，我还没查到。说是{line}。", en: "I haven't found out who said it first. The story is that {line}."}
  own:
    - {zh: "以在下之见，{line}。", en: "In my humble view, {line}."}
    - {zh: "我前后想过了，{line}。", en: "I've thought it through, and I believe {line}."}
  guess_own:
    - {zh: "这只是在下的推测。{hedge}{line}。", en: "This is no more than a guess. {hedge} {line}."}
    - {zh: "还没查实，不好说定。{hedge}{line}。", en: "It hasn't been checked, so I can't be sure. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}没说清楚。{hedge}{line}。", en: "{teller} wasn't clear about it. {hedge} {line}."}
    - {zh: "{teller}提过，可惜语焉不详。{hedge}{line}。", en: "{teller} mentioned it, though without much detail. {hedge} {line}."}
  guess_unknown:
    - {zh: "出处不明。{hedge}{line}。", en: "Nobody knows where it came from. {hedge} {line}."}
    - {zh: "不过是街头的传言。{hedge}{line}。", en: "It's only street talk. {hedge} {line}."}
  rival:
    - {zh: "{teller}的说法却不一样。说是{line}。", en: "The account {teller} gave me is different, though. It has it that {line}."}
    - {zh: "另有一种说法，是{teller}讲的。说{line}。", en: "There's another account, from {teller}, that {line}."}
  known:
    - {zh: "{line}，镇上无人不知。", en: "{line}. There's nobody in town who doesn't know it."}
    - {zh: "{line}。这是镇上人人都知道的。", en: "{line}. It's known to everyone in town."}
hedges:
  - {zh: 想必, en: I surmise}
  - {zh: 大概, en: I presume}
