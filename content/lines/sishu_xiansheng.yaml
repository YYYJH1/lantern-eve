# The Schoolmaster, who teaches the children and edits the Town Gazette. Bookish and measured,
# humble in the first person (在下), and never says a thing before it has been weighed.
person: sishu_xiansheng
voice:
  zh: 私塾先生，办《镇报》。文雅持重，自称在下，话出口前先斟酌，爱用书面语。
  en: Schoolmaster and editor of the Town Gazette. Bookish and measured, humble in the first person, weighs every word, prefers the written register.
lines:
  asleep:
    - {zh: "呼……子曰……学而时习之……（睡熟了）", en: "Zzz... the Master said... to learn and to practise... (fast asleep)"}
    - {zh: "唔……这一版……还缺一篇稿……（睡熟了）", en: "Mm... this edition... still short one article... (fast asleep)"}
  busy:
    - {zh: "在下正校对《镇报》。改日再叙。", en: "I am proofreading the Gazette. Another day, if you please."}
    - {zh: "总管见谅。在下手头事务未毕。", en: "Forgive me, Manager. My business here is not yet done."}
  timeout:
    - {zh: "学生们还等着上课。在下告辞。", en: "The pupils await their lesson. I must take my leave."}
    - {zh: "时辰到了。该回去温书了。", en: "The hour is up. I must return to my books."}
  unknown:
    - {zh: "此事在下不曾听闻。", en: "I have not heard of this matter."}
    - {zh: "容在下思量……实在不知。", en: "Let me consider... no, I truly do not know."}
  evade:
    - {zh: "此事不便多言。", en: "This matter is not one to speak of at length."}
    - {zh: "慎言为上。恕在下不答。", en: "Prudence in speech is wise. Pardon me if I do not answer."}
  not_said:
    - {zh: "在下从未说过此话。", en: "I have never said such a thing."}
    - {zh: "此言并非出自在下之口。", en: "Those words did not come from my lips."}
  not_so:
    - {zh: "非也。事情并非如此。", en: "Not so. The matter is not as you say."}
    - {zh: "此说有误。", en: "That account is mistaken."}
  keeper_no:
    - {zh: "你我初次相识。此事容后再议。", en: "We have only just met. The matter can wait."}
    - {zh: "此物非可轻示外人。", en: "This is not to be shown lightly to outsiders."}
  took_in:
    - {zh: "原来如此。在下记下了。", en: "I see. I shall make a note of it."}
    - {zh: "承蒙告知。在下谨记。", en: "Thank you for informing me. I shall bear it in mind."}
  knew:
    - {zh: "此事在下早有所闻。", en: "I had heard of this matter already."}
    - {zh: "这一节在下已知晓。", en: "That point is already known to me."}
  doubted:
    - {zh: "在下所闻与此不同。", en: "What I have heard differs from this."}
    - {zh: "此说与在下所知不合。", en: "That account does not agree with what I know."}
  caught:
    - {zh: "你竟以谎言欺我！此后你的话，在下不敢再信！", en: "You have deceived me with a lie! Henceforth I shall trust no word of yours!"}
    - {zh: "原来句句是虚言！在下不会再信你了！", en: "So it was falsehood throughout! I shall not trust you again!"}
  deal:
    - {zh: "善。就依此约定。", en: "Good. Let it be so agreed."}
    - {zh: "一言为定。在下应允。", en: "Agreed. I give my word."}
  empty:
    - {zh: "空言无据。在下不信。", en: "Empty words without proof. I do not believe them."}
    - {zh: "言而无征。难以取信。", en: "A claim without evidence earns no credence."}
  kept_thanks:
    - {zh: "总管言而有信。在下铭记于心。", en: "The Manager is true to their word. I shall remember it gratefully."}
    - {zh: "君之所诺，果然兑现。多谢。", en: "What you promised has come to pass. My thanks."}
  will_do:
    - {zh: "好，此事在下承办。", en: "Very well. I shall undertake it."}
    - {zh: "可。请放心交给在下。", en: "Agreed. Leave it with me."}
  cannot:
    - {zh: "此事在下爱莫能助。", en: "In this matter I am unable to assist."}
    - {zh: "力有未逮，抱歉。", en: "It is beyond my powers. My apologies."}
  turned_down:
    - {zh: "抱歉，此事在下不能应允。", en: "My apologies, I cannot consent to this."}
    - {zh: "此请恕在下难以应允。", en: "I regret that I must refuse this request."}
  said_already:
    - {zh: "在下方才已经言明。", en: "I have made that plain already."}
    - {zh: "此事前已述及。不再赘言。", en: "I touched on this before, and will not repeat it."}
  closed:
    - {zh: "此刻不便。请换个时辰再来。", en: "This moment is not convenient. Please come at another hour."}
    - {zh: "眼下不宜。晚些再叙。", en: "Now is not suitable. Let us speak later."}
  needs_nod:
    - {zh: "此事须先禀明族长。", en: "This must first be put before the clan elder."}
    - {zh: "没有族长应允，在下不敢擅专。", en: "The elder has not consented, so I dare not act alone."}
  nothing_to_say:
    - {zh: "对此，在下无可奉告。", en: "On that I have nothing to offer."}
    - {zh: "此事在下无话可说。", en: "In this matter I have nothing to say."}
  testified:
    - {zh: "在下所言，皆为亲眼所见。", en: "All that I tell you, I saw with my own eyes."}
    - {zh: "未曾亲见者，在下不敢妄言。", en: "What I did not see, I will not presume to state."}
  too_late:
    - {zh: "夜色已深。请明晨再来。", en: "The night is far gone. Please come back at dawn."}
    - {zh: "时辰太晚。明日再叙。", en: "The hour is too late. Let us speak tomorrow."}
  will_ask:
    - {zh: "好，在下去向对方说明。", en: "Very well, I shall go and explain it to them."}
    - {zh: "此话在下代为转达。", en: "I shall convey your words."}
  will_call:
    - {zh: "好，在下这就去请诸位到祠堂。", en: "Very well. I shall go and invite everyone to the hall."}
    - {zh: "容在下去召集众人。祠堂相会。", en: "Allow me to gather the townsfolk. We meet at the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言一日不当众澄清，此事一日免谈。", en: "So long as the slander stands uncleared in public, this matter is closed."}
    - {zh: "须先当众辨明谣言。然后方可商议。", en: "The slander must first be refuted in public. Only then may we discuss it."}
  hard_hc_li_bamboo_rumour:
    - {zh: "谣言遍传全镇，总管却一语不发。在下以为，此事难允。", en: "The slander runs through the whole town, yet the Manager says not a word. In my humble view, this cannot be granted."}
    - {zh: "流言未辨，总管亦缄默。在下不敢轻诺。", en: "The rumour is unrefuted, and the Manager keeps silent. This humble scholar dares not promise lightly."}
  hard_other:
    - {zh: "断无可能。", en: "That is quite impossible."}
    - {zh: "此事不容商议。", en: "This matter admits no discussion."}
  elder_yes:
    - {zh: "在下已然明白。便如此罢。", en: "I understand now. Let it be so."}
    - {zh: "所言有理。在下心服。", en: "Your argument holds. I am persuaded."}
  elder_no:
    - {zh: "仅凭此言，尚难定论。", en: "On these words alone no conclusion can be drawn."}
    - {zh: "论据未足。在下不敢轻信。", en: "The argument is insufficient. I dare not believe it lightly."}
  objection_withdrawn:
    - {zh: "事既辨明，在下不再阻拦。", en: "The matter being made clear, I shall no longer stand in the way."}
    - {zh: "误会已释，在下无异议了。", en: "The misunderstanding is dispelled. This humble scholar has no more objection."}
  witness_in_public:
    - {zh: "在下仅述所见，不敢增减一字。", en: "I relate only what I saw, and dare not add or take away a word."}
    - {zh: "在下所见止于此，余事不知。", en: "What this humble scholar saw ends here. The rest I do not know."}
  batch_promised:
    - {zh: "在下应允，明晨送至桥边。", en: "I consent. It shall be delivered to the bridge tomorrow morning."}
    - {zh: "明晨必到，在下可以作保。", en: "It will come by tomorrow morning, and this humble scholar will vouch for it."}
  bamboo_arrived:
    - {zh: "竹料已抵桥边。在下记入《镇报》。", en: "The bamboo has reached the bridge. This humble scholar will put it in the Gazette."}
    - {zh: "桥边已有竹料，在下以为修桥可期。", en: "There is bamboo at the bridge now, and in my view the mending can be hoped for."}
  promise_open:
    - {zh: "在下已然应允。{when}，{amount}根{item}送至桥边。", en: "I have already given my consent: {amount} poles of {item} to the bridge {when}."}
    - {zh: "此事前已应下。{amount}根{item}，{when}交付。", en: "This was agreed earlier, and this humble scholar will deliver {amount} poles of {item} {when}."}
  goods_enough:
    - {zh: "桥边之{item}，已然足用。", en: "The {item} at the bridge is already sufficient."}
    - {zh: "{item}既足，在下不敢再添。", en: "As the {item} suffices, this humble scholar dares add no more."}
  point_heard:
    - {zh: "此事在下不曾听闻。然而在下曾闻{name}言及，不妨一问。", en: "This humble scholar has not heard of it. Yet I once heard {name} speak of it, and it may be worth asking."}
    - {zh: "容在下思量……实在不知。依稀记得{name}谈起过，可往一询。", en: "Let me consider... no, I do not know. I faintly recall {name} discussing it, so you may inquire of them."}
  point_hub:
    - {zh: "此事无从查考。镇上的消息，在下以为{name}所知最广。", en: "There is nothing to consult on this. In matters of the town, I believe {name} knows the most."}
    - {zh: "在下不敢妄言。若问坊间之事，可请教{name}。", en: "This humble scholar dares not speak idly. For talk of the town, you might consult {name}."}
frames:
  seen:
    - {zh: "在下亲眼所见：{line}。", en: "I witnessed it with my own eyes: {line}."}
    - {zh: "在下当时在场。目击其事：{line}。", en: "I was present and witnessed it: {line}."}
  heard:
    - {zh: "据{teller}所述：{line}。", en: "As {teller} relates it, {line}."}
    - {zh: "{teller}曾对在下言及：{line}。", en: "{teller} remarked to me that {line}."}
  unknown:
    - {zh: "坊间有言：{line}。", en: "It is said in town that {line}."}
    - {zh: "此说出处不详：{line}。", en: "Of uncertain origin, it is said that {line}."}
  own:
    - {zh: "以在下之见：{line}。", en: "In my humble view, {line}."}
    - {zh: "在下的看法是：{line}。", en: "My considered opinion is that {line}."}
  guess_own:
    - {zh: "不敢遽下断语。{hedge}{line}。", en: "I dare not pronounce it settled. {hedge} {line}."}
    - {zh: "此乃揣测之言。{hedge}{line}。", en: "This is mere surmise. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}语焉不详。{hedge}{line}。", en: "{teller} was not specific. {hedge} {line}."}
    - {zh: "揣{teller}之意，{hedge}{line}。", en: "To judge from what {teller} implied, {hedge} {line}."}
  guess_unknown:
    - {zh: "出处不明。{hedge}{line}。", en: "The source is not clear. {hedge} {line}."}
    - {zh: "传闻而已。{hedge}{line}。", en: "It is but rumour. {hedge} {line}."}
  rival:
    - {zh: "然{teller}亦曾向在下言及另一说：{line}。", en: "Yet {teller} has also informed me of another account: {line}."}
    - {zh: "不过{teller}对在下所述，却不尽相同：{line}。", en: "However, {teller}'s account to me differs: {line}."}
hedges:
  - {zh: 在下以为, en: I surmise}
  - {zh: 料想, en: I conjecture}
