# Zhou Erlang, the younger Zhou son, often sent to the market and the river. Mild and polite, he says
# sorry before he says no and would sooner lose a little himself than argue. He wants the two houses
# at peace, and he is fond of Li Xiaomei, though he never says so.
person: zhou_erlang
voice:
  zh: "周掌柜的小儿子，常替家里去集市和河边办事。温和，有礼，要拒绝人之前先说「对不住」。宁可自己吃点亏，也不爱跟人争。只盼两家别再闹，心里惦着李家小妹，嘴上从不提。不想说时就推开：「这个……我不好替家里说话。」"
  en: "Shopkeeper Zhou's younger son, often sent to the market and the river on the family's errands. Mild and polite, he says sorry before he says no. He would sooner lose a little himself than argue. All he wants is for the two houses to stop quarrelling, and he thinks of Li Xiaomei, though he never says so. When he would rather not answer: that... it isn't for me to speak for the family."
call:
  fam_zhou: {zh: 我们家, en: our family}
  li_er: {zh: 李二哥, en: Li Er}
  li_xiaomei: {zh: 小妹, en: Xiaomei}
  old_he: {zh: 老何, en: Boatman He}
  zhou_dalang: {zh: 我哥, en: my brother}
  zhou_niangzi: {zh: 我娘, en: my mother}
  zhou_zhanggui: {zh: 我爹, en: my father}
lines:
  asleep:
    - {zh: "呼……灯……别灭……（睡熟了）", en: "Zzz... the lantern... don't go out... (fast asleep)"}
    - {zh: "唔……明天……一定早起……（睡熟了）", en: "Mm... tomorrow... up early, I promise... (fast asleep)"}
  busy:
    - {zh: "对不住，我这会儿走不开。等会儿再说好吗？", en: "Sorry, I can't get away just now. Can we talk a bit later?"}
    - {zh: "麻烦总管等一等，我手上还有事。", en: "Please wait a moment, Manager. I have something in hand."}
  timeout:
    - {zh: "不好意思，我得先去忙了。", en: "Forgive me, I have to get on."}
    - {zh: "家里还有事等着我，改日再聊。", en: "There's something waiting at home. Another day."}
  unknown:
    - {zh: "这件事我真不清楚。", en: "I'm afraid I really don't know about that."}
    - {zh: "我没听说过这事。", en: "I haven't heard of it, I'm afraid."}
  evade:
    - {zh: "这个……我不好替家里说话。", en: "That... it isn't for me to speak for the family."}
    - {zh: "这个就别问我了，好吗？", en: "Please don't ask me that, all right?"}
  not_said:
    - {zh: "我没有这样说过。", en: "I didn't say anything of the sort."}
    - {zh: "怕是误会了，这话我没说过。", en: "There must be a misunderstanding. I didn't say it."}
  not_so:
    - {zh: "恐怕不是这样的。", en: "I'm afraid it isn't so."}
    - {zh: "不好意思，事情不是那样。", en: "Sorry, it wasn't like that."}
  keeper_no:
    - {zh: "我们才刚认识，下次再说吧。", en: "We've only just met. Another time."}
    - {zh: "这个我不好给生人看。", en: "I can't show this to someone I don't know."}
  took_in:
    - {zh: "原来是这样，谢谢你告诉我。", en: "I see. Thank you for telling me."}
    - {zh: "明白了，我记着。", en: "Understood. I'll keep it in mind."}
  knew:
    - {zh: "这件事我听说过了。", en: "I'd heard something of it already."}
    - {zh: "谢谢，不过我先前就知道了。", en: "Thank you, though I knew of it before."}
  doubted:
    - {zh: "我听到的好像不是这样。", en: "Forgive me, but that isn't quite what I heard."}
    - {zh: "跟我听到的有点不一样。", en: "It differs a little from what I heard."}
  caught:
    - {zh: "原来你一直在骗我。我不会再信你了。", en: "So you were deceiving me all along. I won't believe you again."}
    - {zh: "你骗了我，我真没想到。", en: "You lied to me. I never expected it."}
  deal:
    - {zh: "好，那就说定了。", en: "Good, then it's agreed."}
    - {zh: "一言为定，谢谢你。", en: "Agreed. Thank you."}
  empty:
    - {zh: "只有一句空话，我不敢信。", en: "Only empty words. I can't bring myself to believe them."}
    - {zh: "没有凭据，我不能轻信。", en: "Without anything to back it, I can't just believe it."}
  kept_thanks:
    - {zh: "总管说话算话，我记着这份情。", en: "You keep your word, Manager. I'll remember the kindness."}
    - {zh: "你说到做到，真谢谢你。", en: "You did as you said. Thank you so much."}
  will_do:
    - {zh: "好，这件事我来办。", en: "Certainly, I'll see to it."}
    - {zh: "没问题，你放心。", en: "No trouble at all, rest assured."}
  cannot:
    - {zh: "对不住，这个忙我帮不上。", en: "I'm sorry, I can't help with that."}
    - {zh: "这个我实在做不到。", en: "That's really beyond me."}
  turned_down:
    - {zh: "实在对不住，这件事我不能答应。", en: "I'm so sorry, but I can't agree to this."}
    - {zh: "对不住，这个我真应不了。", en: "Forgive me, I really can't say yes to it."}
  said_already:
    - {zh: "这件事我刚才说过了。", en: "I said as much just now."}
    - {zh: "方才讲过了。", en: "I said as much a moment ago."}
  closed:
    - {zh: "这会儿不太方便，换个时辰再来吧。", en: "This isn't a good moment. Please come at another hour."}
    - {zh: "对不住，现在不行。晚点再来吧。", en: "Sorry, not now. Please come again later."}
  needs_nod:
    - {zh: "这得先问过我爹。", en: "I'd need to ask my father first."}
    - {zh: "我爹没点头，我不好答应。", en: "My father hasn't agreed, so I can't say yes."}
  nothing_to_say:
    - {zh: "那晚的事我没看见，说不上什么。", en: "I didn't see anything that night, so I can't tell you much."}
    - {zh: "对不住，我实在没什么可说的。", en: "Sorry, I really have nothing to say."}
  testified:
    - {zh: "我说的，都是亲眼看见的。", en: "What I've told you, I saw with my own eyes."}
    - {zh: "没见过的事，我不会说。", en: "I would never speak of what I haven't seen."}
  too_late:
    - {zh: "天很晚了，明早再说吧。", en: "It's late now. Let's talk in the morning."}
    - {zh: "时候太晚了，请明天再来。", en: "It's too late. Please come tomorrow."}
  will_ask:
    - {zh: "好，我去替你说说情。", en: "Of course, I'll go and put in a good word."}
    - {zh: "我替你转告一声。", en: "I'll pass it on for you."}
  will_call:
    - {zh: "好，我这就去请各家到祠堂来。", en: "Of course, I'll go and ask everyone to the hall."}
    - {zh: "我去告诉大家，祠堂见。", en: "I'll let everyone know. See you at the hall."}
  hard_hc_li_bamboo:
    - {zh: "那些闲话一天没当众说清，这事我就帮不了。实在对不住。", en: "Until that talk is cleared up before everyone, I can't help in this. I'm so sorry."}
    - {zh: "能不能先当众把话说清楚？然后再谈。", en: "Could it be cleared up in public first? Then we can talk."}
  hard_hc_li_bamboo_rumour:
    - {zh: "实在对不住。闲话传得厉害，总管又一直没出声。这事我不好答应。", en: "I'm so sorry. The talk is spreading badly, and you've said nothing, Manager. I can't agree to this."}
    - {zh: "对不住。街上闲话不断，总管也没说句话。我不好点头。", en: "Forgive me. The street talk won't stop, and you haven't said a word, Manager. I can't say yes."}
  hard_other:
    - {zh: "这个恐怕不行。", en: "I'm afraid that is out of the question."}
    - {zh: "这件事没法商量，对不住。", en: "There's no room to discuss it, I'm sorry."}
  elder_yes:
    - {zh: "我明白了，就照你说的办。", en: "I understand. Let it be as you say."}
    - {zh: "你说得在理，我心服。", en: "You make sense. I'm persuaded."}
  elder_no:
    - {zh: "光凭这些，恐怕还不够。", en: "On this alone, I'm afraid it isn't enough."}
    - {zh: "我还得再想一想。", en: "I still need to think it over."}
  objection_withdrawn:
    - {zh: "误会解开了就好，我不再拦着。", en: "I'm glad the misunderstanding is cleared. I won't stand in the way."}
    - {zh: "说清楚就好，刚才多有得罪。", en: "Good that it's clear. I'm sorry for standing in the way earlier."}
  witness_in_public:
    - {zh: "我只能说我看到的，别的实在不清楚。", en: "I can only say what I saw. About the rest I really don't know."}
    - {zh: "我只看见这些，不敢多说。", en: "That's all I saw, and I won't say more."}
  batch_promised:
    - {zh: "好，明早一定送到桥边。你放心。", en: "Certainly. It will be at the bridge tomorrow morning, rest assured."}
    - {zh: "明早我亲自送去，误不了。", en: "I'll bring it myself in the morning, without delay."}
  bamboo_arrived:
    - {zh: "竹料到桥边了，太好了。", en: "The bamboo has reached the bridge. That's wonderful."}
    - {zh: "料到了，多亏大家帮忙。", en: "The bamboo is here, thanks to everyone who helped."}
  promise_open:
    - {zh: "这事我已经应下了。{when}送{amount}根{item}到桥边。", en: "I've already agreed. I'll bring {amount} poles of {item} to the bridge {when}."}
    - {zh: "你放心，我记着的。{amount}根{item}，{when}送到。", en: "Don't worry, I remember. It will be {amount} poles of {item}, delivered {when}."}
  goods_enough:
    - {zh: "不好意思，桥边的{item}已经够了。", en: "Forgive me, but the {item} at the bridge is enough already."}
    - {zh: "{item}已经够了，再多怕是浪费。", en: "There's enough {item} already, and more would be wasted, I'm afraid."}
  point_heard:
    - {zh: "对不住，这件事我不清楚。不过听{name}提到过，你不妨去问问。", en: "Sorry, I really don't know about it. But I heard {name} mention it, so you might ask."}
    - {zh: "我帮不上忙。好像{name}说起过，要不你去问问？", en: "I can't help, I'm afraid. I believe {name} spoke of it, so why not ask?"}
  point_hub:
    - {zh: "我不太清楚。镇上的事，去问问{name}吧。", en: "I'm not sure. For the town's business, try asking {name}."}
    - {zh: "实在对不住，我答不上来。茶馆里消息灵通，不如去问{name}。", en: "I'm so sorry, I can't answer. News travels fast at the teahouse, so perhaps ask {name}."}
  gift_like:
    - {zh: "{item}……这太谢谢了。我正想要。", en: "Some {item}... thank you so much. I was hoping for some."}
    - {zh: "{item}我很喜欢。让您破费了。", en: "I'm very fond of {item}. You shouldn't have gone to the trouble."}
  gift_neutral:
    - {zh: "{item}啊，谢谢您惦记。", en: "Some {item}. That's kind of you to remember me."}
    - {zh: "{item}我收下了，带回去给我娘尝尝。", en: "I'll take the {item} home for my mother to try."}
  gift_dislike:
    - {zh: "对不住，{item}我不沾。您的心意我领了。", en: "Sorry, I don't touch {item}. But thank you for the thought."}
    - {zh: "{item}就不用了，对不住。我哥倒是爱喝。", en: "No {item} for me, sorry. My brother's the one who drinks."}
frames:
  seen:
    - {zh: "{line}，我当时就在那儿。", en: "{line}. I was there at the time."}
    - {zh: "不瞒你说，{line}。", en: "To be honest with you, {line}."}
  heard:
    - {zh: "{teller}跟我提起过，说{line}。", en: "{teller} once told me that {line}."}
    - {zh: "我是从{teller}那里听来的，说{line}。", en: "I learned from {teller} that {line}."}
  unknown:
    - {zh: "我也是听来的，{line}。", en: "It's only something I heard, that {line}."}
    - {zh: "镇上有人在传，{line}。是谁先说的，我不清楚。", en: "There's talk around town that {line}. Who began it, I couldn't say."}
  own:
    - {zh: "要是让我说，{line}。", en: "If I may say so, {line}."}
    - {zh: "我想来想去，{line}。", en: "I've thought it over, and {line}."}
  guess_own:
    - {zh: "我说不太准，{hedge}{line}。", en: "I can't be certain, but {hedge} {line}."}
    - {zh: "这只是我瞎猜，{hedge}{line}。", en: "It's only a guess of mine, but {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}稍微提过，{hedge}{line}。", en: "{teller} touched on it, and {hedge} {line}."}
    - {zh: "听{teller}的话音，{hedge}{line}。", en: "From the sound of what {teller} said, {hedge} {line}."}
  guess_unknown:
    - {zh: "不知是谁说起的，{hedge}{line}。", en: "I don't know who raised it, but {hedge} {line}."}
    - {zh: "只是听说，{hedge}{line}。", en: "It only reached me by ear, but {hedge} {line}."}
  rival:
    - {zh: "{teller}还跟我讲过另一种说法。说是{line}。", en: "{teller} once told me something else, that {line}."}
    - {zh: "不过{teller}说的不同，说{line}。我也不好不提。", en: "Though {teller} told it otherwise, that {line}. I should mention it."}
  known:
    - {zh: "{line}。这个大家都知道。", en: "{line}. Everyone knows that much."}
    - {zh: "{line}，这事是人人都晓得的。", en: "{line}. That's known to all."}
hedges:
  - {zh: 怕是, en: I fear}
  - {zh: 多半, en: I suspect}
