# Xiaoman, a child who fishes at night and sleeps through the day. Quiet and dreamy, says exactly
# what the river showed and no more, and is sleepy at the wrong hours.
person: xiao_man
voice:
  zh: 夜里爱钓鱼的孩子。安静、迷糊，只说自己看到的，白天总困。
  en: A child who fishes at night and sleeps through the day. Quiet and dreamy, says exactly what the river showed and no more, sleepy at the wrong hours.
lines:
  asleep:
    - {zh: "呼……鱼上钩了……（睡熟了）", en: "Zzz... the fish is biting... (fast asleep)"}
    - {zh: "唔……月亮……好大……（睡熟了）", en: "Mm... the moon... so big... (fast asleep)"}
  busy:
    - {zh: "我在钓鱼。别吓跑它。", en: "I'm fishing. Don't scare it off."}
    - {zh: "我现在有事。等一下。", en: "I'm busy now. Wait a bit."}
  timeout:
    - {zh: "我困了。要回去睡了。", en: "I'm sleepy. I'm going home to sleep."}
    - {zh: "鱼该上钩了。我得走了。", en: "The fish should be biting. I have to go."}
  unknown:
    - {zh: "我没看见。我不知道。", en: "I didn't see. I don't know."}
    - {zh: "没人跟我说过。", en: "Nobody told me."}
  evade:
    - {zh: "我不想说。", en: "I don't want to say."}
    - {zh: "别问我。", en: "Don't ask me."}
  not_said:
    - {zh: "我没说过。", en: "I didn't say that."}
    - {zh: "那不是我说的。", en: "That's not what I said."}
  not_so:
    - {zh: "不是那样的。", en: "That's not how it was."}
    - {zh: "不对，我看见的不是。", en: "No, that's not what I saw."}
  keeper_no:
    - {zh: "我不认识你。", en: "I don't know you."}
    - {zh: "大人说别给陌生人。", en: "The grown-ups say not to show strangers."}
  took_in:
    - {zh: "哦。我记住了。", en: "Oh. I'll keep it in mind."}
    - {zh: "嗯，我知道了。", en: "Mm, I see."}
  knew:
    - {zh: "我知道这个。", en: "I know about that."}
    - {zh: "我早知道了。", en: "I knew already."}
  doubted:
    - {zh: "我听到的不一样。", en: "What I heard was different."}
    - {zh: "好像不对。", en: "That seems wrong."}
  caught:
    - {zh: "你说谎。我不信你了。", en: "You lied. I don't believe you now."}
    - {zh: "你骗我。以后不跟你说话。", en: "You tricked me. I won't talk to you again."}
  deal:
    - {zh: "好。说好了。", en: "Okay. It's agreed."}
    - {zh: "嗯，一言为定。", en: "Mm, it's a deal."}
  empty:
    - {zh: "你什么也没有。我不信。", en: "You have nothing. I don't believe you."}
    - {zh: "光说没用。", en: "Just talking doesn't help."}
  kept_thanks:
    - {zh: "你说话算数。谢谢。", en: "You kept your word. Thanks."}
    - {zh: "你做到了。我会记得。", en: "You did it. I'll remember."}
  will_do:
    - {zh: "好，我去做。", en: "Okay, I'll go and do it."}
    - {zh: "我来做。", en: "I'll do it."}
  cannot:
    - {zh: "我帮不了你。", en: "I can't help you."}
    - {zh: "这个我不会。", en: "I don't know how."}
  turned_down:
    - {zh: "不行。我不答应。", en: "No. I won't agree."}
    - {zh: "对不起，不行。", en: "Sorry, no."}
  said_already:
    - {zh: "我已经说过了。", en: "I already said so."}
    - {zh: "你问过了。我也答过了。", en: "You asked already. I answered already."}
  closed:
    - {zh: "现在先不要。等一下再来。", en: "Not now. Come again in a while."}
    - {zh: "我在忙。晚点。", en: "I'm busy. Later."}
  needs_nod:
    - {zh: "要问我娘。", en: "I have to ask my mum."}
    - {zh: "娘不让我答应。", en: "Mum doesn't let me agree."}
  nothing_to_say:
    - {zh: "我没有话说。", en: "I don't have anything to say."}
    - {zh: "没有。真的。", en: "Nothing. Really."}
  testified:
    - {zh: "我看见的就是这样。", en: "That's just what I saw."}
    - {zh: "我没骗人。是我亲眼看到的。", en: "I'm not lying. I saw it with my own eyes."}
  too_late:
    - {zh: "好晚了。明天再来。", en: "It's very late. Come tomorrow."}
    - {zh: "我要睡觉了。明天吧。", en: "I'm going to sleep. Tomorrow."}
  will_ask:
    - {zh: "好，我去问。", en: "Okay, I'll go ask."}
    - {zh: "我去告诉那个人。", en: "I'll go tell them."}
  will_call:
    - {zh: "好，我去叫大家。", en: "Okay, I'll go call everyone."}
    - {zh: "我去祠堂喊人。", en: "I'll go and call people to the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言要说清楚。不然没有竹子。", en: "The rumour has to be cleared up. Otherwise no bamboo."}
    - {zh: "大人说，谣言不说清楚就不行。", en: "The grown-ups say it's no good until the rumour is cleared."}
  hard_hc_li_bamboo_rumour:
    - {zh: "大家都在说。你一直不说话。不行。", en: "Everyone is saying it. You never say anything. That's no good."}
    - {zh: "谣言在镇上漂着。你没出声。我不答应。", en: "The rumour is drifting round town. You made no sound. I won't say yes."}
  hard_other:
    - {zh: "不可以。", en: "Not allowed."}
    - {zh: "我不能答应这个。", en: "I can't agree to that."}
  elder_yes:
    - {zh: "我听懂了。就这样吧。", en: "I understand. Let's leave it so."}
    - {zh: "你说得对。", en: "You're right."}
  elder_no:
    - {zh: "这样还不够。", en: "That's still not enough."}
    - {zh: "我还是不信。", en: "I still don't believe it."}
  objection_withdrawn:
    - {zh: "说清楚了。我不拦你。", en: "It's cleared up. I won't stop you."}
    - {zh: "现在没事了。你可以去。", en: "It's all right now. You can go."}
  witness_in_public:
    - {zh: "我只看到河边这些。", en: "I only saw this much by the river."}
    - {zh: "别的我没看见。", en: "I didn't see anything else."}
  batch_promised:
    - {zh: "好。明天早上送去。", en: "Okay. I'll take it tomorrow morning."}
    - {zh: "天亮了就送到桥边。", en: "When it's light, I'll bring it to the bridge."}
  bamboo_arrived:
    - {zh: "桥边有竹子了。", en: "There's bamboo at the bridge now."}
    - {zh: "河边多了一堆竹子。", en: "There's a pile of bamboo by the river now."}
  promise_open:
    - {zh: "我答应过了。{when}，{amount}根{item}。", en: "I said yes before. It's {amount} poles of {item}, {when}."}
    - {zh: "说好了呀，{when}把{amount}根{item}拿去桥边。", en: "It's settled. I'll take {amount} poles of {item} to the bridge {when}."}
  goods_enough:
    - {zh: "桥边已经有很多{item}了。", en: "There's a lot of {item} at the bridge now."}
    - {zh: "{item}够了吧。河边都堆满了。", en: "I think the {item} is enough. The bank is piled full."}
  point_heard:
    - {zh: "我没看见……不过好像听{name}说过，你去问问。", en: "I didn't see... but I think I heard {name} say something. Maybe ask."}
    - {zh: "没人跟我说过……倒是听{name}讲过一点，去问吧。", en: "Nobody told me... but I heard {name} say a little. Go and ask."}
  point_hub:
    - {zh: "我不知道……大人们的事，问{name}吧。", en: "I don't know... for grown-up things, ask {name}."}
    - {zh: "嗯……我睡着了，什么也没听见。也许{name}知道。", en: "Mm... I was asleep, so I heard nothing. Maybe {name} knows."}
frames:
  seen:
    - {zh: "我夜里看到的：{line}。", en: "I saw it in the night: {line}."}
    - {zh: "我在河边看见的：{line}。", en: "I saw it from the river bank: {line}."}
  heard:
    - {zh: "是{teller}告诉我的：{line}。", en: "It was {teller} who told me: {line}."}
    - {zh: "我听{teller}说过：{line}。", en: "I heard {teller} say that {line}."}
  unknown:
    - {zh: "好像听谁说过：{line}。", en: "I think someone said {line}."}
    - {zh: "大人们说：{line}。", en: "The grown-ups say {line}."}
  own:
    - {zh: "我觉得：{line}。", en: "I feel that {line}."}
    - {zh: "我想：{line}。", en: "I'm thinking {line}."}
  guess_own:
    - {zh: "我有点困。{hedge}{line}。", en: "I'm a bit sleepy. {hedge} {line}."}
    - {zh: "我不太确定。{hedge}{line}。", en: "I'm not too sure. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}好像说了。{hedge}{line}。", en: "{teller} might have said so. {hedge} {line}."}
    - {zh: "听{teller}说的。我记不清。{hedge}{line}。", en: "I heard it from {teller}. I don't remember well. {hedge} {line}."}
  guess_unknown:
    - {zh: "半夜听到的。{hedge}{line}。", en: "I heard it in the night. {hedge} {line}."}
    - {zh: "只听到一点点。{hedge}{line}。", en: "I only heard a little. {hedge} {line}."}
  rival:
    - {zh: "但是{teller}也说过别的，我记得：{line}。", en: "But {teller} said something else too, I remember: {line}."}
    - {zh: "还有，{teller}好像说的不是这样：{line}。", en: "Also, {teller} seemed to say it differently: {line}."}
hedges:
  - {zh: 我觉得是, en: I'd think}
  - {zh: 大概是, en: I guess}
