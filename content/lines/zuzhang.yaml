# The Clan Elder, who sits in the ancestral hall and settles the disputes of both families. Formal
# and weighty: he speaks in full measured sentences, cites the clan's rules, and never raises his
# voice.
person: zuzhang
voice:
  zh: 族长。庄重、语速慢，自称老夫，话整句整句地说，引族规，从不提高嗓门。
  en: The clan elder. Formal and weighty, full measured sentences, cites the clan's rules, never raises his voice.
lines:
  asleep:
    - {zh: "唔……祖宗在上……保佑……（睡熟了）", en: "Mm... ancestors above... protect us... (fast asleep)"}
    - {zh: "呼……议事……明日再议……（睡熟了）", en: "Zzz... the council... we shall resume tomorrow... (fast asleep)"}
  busy:
    - {zh: "老夫正在议事。请稍后再来。", en: "I am in council. Pray return later."}
    - {zh: "总管，此刻老夫不得空闲。改日相见。", en: "Manager, I am not at leisure now. We shall meet another day."}
  timeout:
    - {zh: "时辰到了。老夫告辞。", en: "The hour is up. I take my leave."}
    - {zh: "族中事务缠身。就谈到这里。", en: "Clan affairs weigh upon me. Let us end here."}
  unknown:
    - {zh: "此事老夫一无所知。", en: "I know nothing of this matter."}
    - {zh: "老夫从未听闻。", en: "It has never reached my ears."}
  evade:
    - {zh: "此事老夫不便置评。", en: "I am not at liberty to comment on this."}
    - {zh: "不宜多言。请勿再问。", en: "It is not fitting to say more. Please do not press."}
  not_said:
    - {zh: "老夫从未说过此话。", en: "I have never spoken such words."}
    - {zh: "此言非出自老夫。", en: "Those words are not mine."}
  not_so:
    - {zh: "不然。事实并非如此。", en: "It is not so. The facts are otherwise."}
    - {zh: "此说不确。", en: "That account is not accurate."}
  keeper_no:
    - {zh: "你我尚不相熟。此事日后再议。", en: "We are not yet acquainted. This can wait."}
    - {zh: "老夫不轻易示人。请回。", en: "I do not readily show such things. Please withdraw."}
  took_in:
    - {zh: "原来如此。老夫记下了。", en: "So it is. I shall bear it in mind."}
    - {zh: "老夫知晓了。", en: "It is known to me now."}
  knew:
    - {zh: "此事老夫早已知晓。", en: "This matter was known to me already."}
    - {zh: "不必多说。老夫早有所闻。", en: "There is no need to say more. I had heard of it."}
  doubted:
    - {zh: "老夫所闻，并非如此。", en: "What I have heard is not so."}
    - {zh: "此说与老夫所知不符。", en: "This does not accord with what I know."}
  caught:
    - {zh: "你竟敢欺瞒老夫！往后你的话，老夫一概不信！", en: "You dared deceive me! Hereafter I shall believe none of your words!"}
    - {zh: "原来都是谎言！休想老夫再信你！", en: "So it was all lies! Do not expect me to trust you again!"}
  deal:
    - {zh: "好。就此议定。", en: "Good. So it is agreed."}
    - {zh: "老夫应允。", en: "I consent."}
  empty:
    - {zh: "空言无益。老夫不信。", en: "Empty words avail nothing. I do not believe them."}
    - {zh: "口说无凭。老夫不取。", en: "Words without proof, I do not accept."}
  kept_thanks:
    - {zh: "总管信守诺言。老夫记下这份情。", en: "The Manager keeps their promise. I shall remember the kindness."}
    - {zh: "言出必行，难得。老夫谢过。", en: "To act as one speaks is rare. I give you my thanks."}
  will_do:
    - {zh: "可以。老夫来办。", en: "Very well. I shall see to it."}
    - {zh: "此事老夫应下了。", en: "This matter I accept."}
  cannot:
    - {zh: "此事老夫帮不上忙。", en: "In this I cannot be of help."}
    - {zh: "力所不及。请见谅。", en: "It lies beyond my power. Pray excuse me."}
  turned_down:
    - {zh: "抱歉。此事老夫不能应允。", en: "I regret that I cannot consent to this."}
    - {zh: "按族规，此事不可。", en: "By the clan's rules, this may not be done."}
  said_already:
    - {zh: "老夫已经说过。", en: "I have spoken already."}
    - {zh: "此事前已言明。不必再提。", en: "This was settled earlier. There is no need to raise it again."}
  closed:
    - {zh: "此刻不便。请另择时辰。", en: "This moment is unsuitable. Choose another hour."}
    - {zh: "眼下不宜相谈。稍后再来。", en: "It is not a fitting time to speak. Return later."}
  needs_nod:
    - {zh: "此事须经族中商议。", en: "This must go before the clan."}
    - {zh: "没有族众应允，老夫不能独断。", en: "Without the clan's consent I cannot decide alone."}
  nothing_to_say:
    - {zh: "对此，老夫无话可说。", en: "On this I have nothing to say."}
    - {zh: "此事无须老夫多言。", en: "This needs no word from me."}
  testified:
    - {zh: "老夫所言，皆是亲眼所见。", en: "All I say, I have seen with my own eyes."}
    - {zh: "不曾亲见之事，老夫不言。", en: "What I have not seen, I do not state."}
  too_late:
    - {zh: "天色已晚。明晨再来。", en: "The hour is late. Return at dawn."}
    - {zh: "夜深了。有事明日再议。", en: "It is deep in the night. Let any matter wait until tomorrow."}
  will_ask:
    - {zh: "好。老夫去与对方说。", en: "Good. I shall speak with them."}
    - {zh: "此话老夫替你转达。", en: "I shall convey this for you."}
  will_call:
    - {zh: "好。老夫这就召集族人到祠堂。", en: "Very well. I shall call the clan to the hall at once."}
    - {zh: "传话下去。祠堂集合。", en: "Let word go out. Assemble at the hall."}
  hard_hc_li_bamboo:
    - {zh: "谣言未当众澄清，此事不予商议。", en: "Until the slander is cleared before all, this is not open to discussion."}
    - {zh: "须先在众人面前辨明是非。然后再议。", en: "Right and wrong must first be settled before all. Then we shall consider it."}
  hard_hc_li_bamboo_rumour:
    - {zh: "满镇皆传此谣言，总管却一言不发。老夫不便应允。", en: "The whole town repeats this slander, yet the Manager says nothing. I cannot consent."}
    - {zh: "谣言未息，总管缄口不言。老夫不能应此事。", en: "The slander has not died down, and the Manager holds their tongue. I cannot agree to this."}
  hard_other:
    - {zh: "断不可行。", en: "That cannot be permitted."}
    - {zh: "此事不容再议。", en: "This is not to be reopened."}
  elder_yes:
    - {zh: "老夫听明白了。此事就此定下。", en: "I have heard you out. The matter is settled."}
    - {zh: "言之成理。老夫准了。", en: "Your reasoning is sound. I approve."}
  elder_no:
    - {zh: "凭这些，老夫尚不能下定论。", en: "On this, I cannot yet reach a verdict."}
    - {zh: "所陈未足。老夫还须斟酌。", en: "What you have set out is not enough. I must deliberate further."}
  objection_withdrawn:
    - {zh: "事已辨明，老夫不再阻拦。", en: "The matter is settled, and I will no longer obstruct it."}
    - {zh: "既然当众说清，老夫无异议。", en: "Since it has been cleared before all, I have no objection."}
  witness_in_public:
    - {zh: "老夫只述所见，不增一字。", en: "I state only what I saw, and add not a word."}
    - {zh: "所见止此，余者老夫不知。", en: "My sight reaches no further, and of the rest I know nothing."}
  batch_promised:
    - {zh: "老夫应下了。明晨送至桥边。", en: "I accept. It shall be at the bridge tomorrow morning."}
    - {zh: "明日清晨，必送到桥边。", en: "At tomorrow's dawn, it will be brought to the bridge."}
  bamboo_arrived:
    - {zh: "竹料已至桥边。甚好。", en: "The bamboo has reached the bridge. Very good."}
    - {zh: "材料既到，修桥可以动工了。", en: "The materials are here, and the mending may begin."}
  promise_open:
    - {zh: "此事已经应下。{when}，{amount}根{item}送至桥边。", en: "This matter is agreed already: {amount} poles of {item} are to reach the bridge {when}."}
    - {zh: "老夫记得，答应的事就是族规。{amount}根{item}，{when}到。", en: "A promise binds like a clan rule, and {amount} poles of {item} will reach the bridge {when}."}
  goods_enough:
    - {zh: "桥边的{item}已足，不必再送。", en: "The {item} at the bridge suffices, and no more need be sent."}
    - {zh: "{item}既已足数，此事便了了。", en: "The {item} being sufficient, this matter is closed."}
  point_heard:
    - {zh: "此事老夫一无所知。老夫听闻{name}谈及此事，总管可前去询问。", en: "I know nothing of this matter. It has come to my ears that {name} spoke of it, and the Manager may inquire of them."}
    - {zh: "老夫未曾听闻。不过{name}似乎知晓一二，总管不妨一问。", en: "It has never reached my ears. Yet I believe {name} knows something of it, and the Manager might ask."}
  point_hub:
    - {zh: "此事老夫不知。镇上人情往来{name}知之最详，总管可去请教。", en: "I know nothing of this. In the affairs of the town, {name} is best informed, and the Manager may consult them."}
    - {zh: "老夫不便妄言。欲知坊间之事，宜问{name}。", en: "I will not speak without grounds. To learn the talk of the town, the Manager should ask {name}."}
frames:
  seen:
    - {zh: "老夫亲眼所见：{line}。", en: "My own eyes bear witness: {line}."}
    - {zh: "老夫当日在场：{line}。", en: "I was present that day: {line}."}
  heard:
    - {zh: "据{teller}所言：{line}。", en: "{teller} has stated that {line}."}
    - {zh: "{teller}曾禀告老夫：{line}。", en: "{teller} reported to me that {line}."}
  unknown:
    - {zh: "族中有传言：{line}。", en: "Word has gone round the clan that {line}."}
    - {zh: "老夫有所耳闻：{line}。", en: "It has come to my ears that {line}."}
  own:
    - {zh: "依老夫判断：{line}。", en: "By my judgment, {line}."}
    - {zh: "老夫的看法：{line}。", en: "My view is this: {line}."}
  guess_own:
    - {zh: "尚无定论。{hedge}{line}。", en: "Nothing is settled. {hedge} {line}."}
    - {zh: "未可全信。{hedge}{line}。", en: "Do not take it as certain. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}略有提及。{hedge}{line}。", en: "{teller} made some mention of it. {hedge} {line}."}
    - {zh: "观{teller}所述，{hedge}{line}。", en: "Judging by {teller}'s account, {hedge} {line}."}
  guess_unknown:
    - {zh: "传闻无据。{hedge}{line}。", en: "The report has no source. {hedge} {line}."}
    - {zh: "不知何人所传。{hedge}{line}。", en: "I know not who spread it. {hedge} {line}."}
  rival:
    - {zh: "然{teller}亦曾禀告老夫另一说：{line}。", en: "Yet {teller} has also reported another account to me: {line}."}
    - {zh: "不过依{teller}所言，则是另一番情形：{line}。", en: "However, as {teller} has it, the matter stands otherwise: {line}."}
hedges:
  - {zh: 老夫料想, en: I would infer}
  - {zh: 想来, en: I take it}
# What he says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. He wants both families over the bridge together, so his greeting follows how
# near that is: the clan called to the hall, the truth told, the two houses at one table.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "你便是老夫请来的总管。坐，说话不必拘礼。", en: "You are the Manager whom I sent for. Sit, and speak without ceremony."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "总管应下的事未办。族规重信，老夫提醒一句。", en: "What the Manager promised remains undone. The clan values good faith, and I remind you of it."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今夜游灯，族中老少都来了。总管辛苦。", en: "The whole clan, young and old, comes out for the parade tonight. The Manager has worked hard."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家同坐一席，祠堂里的祖宗也该安心了。", en: "The two houses sit at one table, and the ancestors in the hall may rest easy."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥之事已当众讲明，老夫也认了这个理。", en: "The matter of the bridge was told before all, and I have accepted the reasoning."}
  - id: called
    when: [{kind: called}]
    lines:
      - {zh: "族人已在祠堂候着。总管要说的话，可以说了。", en: "The clan waits in the hall. What the Manager means to say may be said now."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "总管信守所诺。老夫已记在族簿上。", en: "The Manager keeps what was promised. I have set it down in the clan book."}
  - id: cleared
    when: [{kind: knows, props: [pr_set_straight]}]
    lines:
      - {zh: "那谣言已当众澄清，老夫听说了。", en: "I have heard that the rumour was cleared in public."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "总管又至。请讲。", en: "The Manager again. Pray speak."}
      - {zh: "还有何事？", en: "What further matter?"}
  - id: plain
    lines:
      - {zh: "两家须一同提灯过桥，方不负此会。总管可有头绪？", en: "Both houses must cross the bridge with their lanterns together, or the festival is in vain. Has the Manager a plan?"}
      - {zh: "祠堂清静，有话不妨细说。", en: "The hall is quiet, and anything may be told here at length."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "失信之事，老夫不愿提第二回。", en: "I would not speak of a broken word a second time."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今夜祠堂的灯与路上的灯同明。", en: "Tonight the lamps of the hall and the road burn together."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "说明白的话，族里会记着。", en: "What has been said plainly, the clan will remember."}
  - id: plain
    lines:
      - {zh: "去罢。该做的事，不可耽搁。", en: "Go then. Delay nothing that must be done."}
      - {zh: "老夫不远送了。", en: "I shall not see you out."}
epilogue:
  - id: full_kept
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}, {kind: promised, state: kept}]
    text: {zh: "族长在桥头点了头一盏灯，李周两家一同提灯过了桥。总管应的事办了，族簿上记了一笔。", en: "The elder lit the first lantern at the bridgehead, and the two houses crossed together. The Manager's promise was kept, and the clan book has a line for it."}
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "族长在桥头点了头一盏灯。李周两家的人一同提灯，走过了石桥。", en: "The elder lit the first lantern at the bridgehead. The Li and Zhou families crossed the Stone Bridge together, lamps in hand."}
  - id: truth_bridge
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}]
    text: {zh: "族长看着灯过了桥。桥的事讲明了，两家却各走一边。", en: "The elder watched the lanterns cross. The bridge was settled, but the two houses walked apart."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "桥通了，族长却没有笑意。桥是怎么坏的，族里还没有定论。", en: "The bridge was open again, but the elder did not smile. The clan had reached no verdict on how the rail broke."}
  - id: detour
    when: [{kind: flag, flag: detour_done}]
    text: {zh: "桥没修好，族长领着族人走了庙后的夹道。", en: "The bridge was not mended, and the elder led the clan along the lane behind the temple."}
  - id: apart
    text: {zh: "桥没通，路也没备。族长在祠堂里坐到很晚，没有点灯。", en: "No bridge and no lane. The elder sat late in the hall and lit no lamp."}
