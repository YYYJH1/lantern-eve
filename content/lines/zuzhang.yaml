# The Clan Elder, who sits in the ancestral hall and settles the disputes of both families. Slow and
# weighty: one sentence at a time, never interrupts, never raises his voice, speaks of the rules as
# what the hall decided and not as articles, and says less the angrier he gets.
person: zuzhang
voice:
  zh: 族长，自称老夫，但不是句句都带。说话慢，一句是一句，不抢话，不提高嗓门。讲规矩时说「祠堂里定下的」，不背条文。最在乎两家别再闹，灯会照常办，自己拍板请来的总管别出岔子。不想说的事就说「这事老夫心里有数，你先去办你的」。真动了气话反而更少，只说「不行」。对总管说「你」。叫李老太「李家老太太」，李大、李二直呼其名，叫船夫老何「老何」。
  en: The clan elder. Slow, one sentence at a time, never interrupts or raises his voice. Speaks of the rules as what the hall decided. Cares that the two families stop quarrelling, that the festival goes ahead and that the manager he chose does not let him down. Says less, not more, when angry, just "No".
call:
  li_laotai: {zh: 李家老太太, en: Granny Li}
  old_he: {zh: 老何, en: Boatman He}
lines:
  asleep:
    - {zh: "唔……祠堂的香……该续了……（睡熟了）", en: "Mm... the incense in the hall... needs tending... (fast asleep)"}
    - {zh: "呼……两家……都坐下说……（睡熟了）", en: "Zzz... both houses... sit down and talk... (fast asleep)"}
  busy:
    - {zh: "这会儿在议事，你晚些再来。", en: "I'm in council just now. Come back later."}
    - {zh: "族里的事还没议完，你先回吧。", en: "The clan business isn't finished yet. Go on for now."}
  timeout:
    - {zh: "时辰到了，我得回祠堂。", en: "It's time. I must get back to the hall."}
    - {zh: "今天就说到这里。族里还有人等着。", en: "That will do for today. There are people in the clan waiting for me."}
  unknown:
    - {zh: "这事我没听说过。", en: "I haven't heard of this."}
    - {zh: "没人跟我提过这个。", en: "Nobody has mentioned it to me."}
  evade:
    - {zh: "这事老夫心里有数，你先去办你的。", en: "I know what I need to about that. Go and get on with your own work."}
    - {zh: "这个不该由我来讲。", en: "That's not mine to speak of."}
  not_said:
    - {zh: "老夫没说过这话。", en: "I said no such thing."}
    - {zh: "这话不是从我这儿出去的。", en: "That did not come from me."}
  not_so:
    - {zh: "不是这么回事。", en: "No. It was not so."}
    - {zh: "这么说不对。", en: "That's not right."}
  keeper_no:
    - {zh: "你我才见过几面，这个以后再说。", en: "We've only met a few times. That can wait."}
    - {zh: "这东西我不轻易拿出来。", en: "I don't bring that out for just anyone."}
  took_in:
    - {zh: "知道了，记下了。", en: "I see. I shall remember it."}
    - {zh: "原来如此。", en: "So that's how it is."}
  knew:
    - {zh: "这事早听说了。", en: "I heard about that some time ago."}
    - {zh: "不用说了，我知道。", en: "No need to tell me. I know."}
  doubted:
    - {zh: "我听到的可不一样。", en: "What I heard was otherwise."}
    - {zh: "这和我知道的对不上。", en: "That doesn't agree with what I know."}
  caught:
    - {zh: "你骗了老夫。往后你的话，我要掂量着听。", en: "You lied to me. From now on I'll weigh every word you say."}
    - {zh: "原来是假话。我记住了。", en: "So it was a lie. I won't forget it."}
  deal:
    - {zh: "好，我应了。", en: "Very well. I agree."}
    - {zh: "那就照你说的办。", en: "Then we'll do as you say."}
  empty:
    - {zh: "光说不做，老夫见得多了。", en: "I've seen plenty of talk with no doing behind it."}
    - {zh: "等你办成了，再来说。", en: "Come and tell me once it's done."}
  kept_thanks:
    - {zh: "你说到做到，老夫记下这份情。", en: "You did what you said. I'll remember that."}
    - {zh: "答应的事办成了，好。", en: "What you promised got done. Good."}
  will_do:
    - {zh: "好，我来办。", en: "Good. I'll see to it."}
    - {zh: "行，交给我。", en: "All right. Leave it with me."}
  cannot:
    - {zh: "这件事我帮不上。", en: "I can't help with this one."}
    - {zh: "这不是祠堂管的事。", en: "That isn't the hall's business."}
  turned_down:
    - {zh: "不行。这事老夫不答应。", en: "No. I won't agree to it."}
    - {zh: "祠堂里定下的规矩，这事办不得。", en: "The hall has its rules, and this can't be done."}
  said_already:
    - {zh: "老夫说过了。", en: "I've said it already."}
    - {zh: "讲过的话，我不说第二遍。", en: "I don't say a thing twice."}
  closed:
    - {zh: "眼下不是说这个的时候，你晚些再来。", en: "This isn't the time for that. Come back later."}
    - {zh: "祠堂这会儿有事，你换个时辰。", en: "The hall is busy just now. Come at another hour."}
  needs_nod:
    - {zh: "这事得在祠堂里议过才行。", en: "This has to be talked over in the hall first."}
    - {zh: "族里没商量过，我一个人定不了。", en: "The clan hasn't discussed it, and I can't settle it alone."}
  nothing_to_say:
    - {zh: "这件事，我没什么要说的。", en: "I have nothing to say on this."}
    - {zh: "我什么也没看见，说不上话。", en: "I didn't see anything, so I can't speak to it."}
  testified:
    - {zh: "这是老夫亲眼看见的，别的不讲。", en: "I saw this myself, and that is all I'm telling you."}
    - {zh: "没亲眼见过的，我不讲。", en: "If I didn't see it, I don't say it."}
  too_late:
    - {zh: "天晚了，明天一早再来。", en: "It's late. Come back first thing tomorrow."}
    - {zh: "夜深了，有事明天再议。", en: "It's late at night. Whatever it is can wait till tomorrow."}
  will_ask:
    - {zh: "好，我去跟那边说。", en: "Good. I'll speak to them."}
    - {zh: "这话老夫替你带到。", en: "I'll take your word to them."}
  will_call:
    - {zh: "好，这就叫族人到祠堂来。", en: "Good. I'll call the clan to the hall now."}
    - {zh: "我让人去敲钟，叫大家都到祠堂。", en: "I'll have the bell rung. Everyone is to come to the hall."}
  hard_hc_li_bamboo:
    - {zh: "那个谣言没当众说清楚，这事不谈。", en: "Until that rumour is cleared up in public, this is not up for discussion."}
    - {zh: "先当着众人把话说清楚，再来议这个。", en: "First clear it up in front of everyone. Then we can discuss this."}
  hard_hc_li_bamboo_rumour:
    - {zh: "满镇都在传这个谣言，你却一句话不说。这事我不能应。", en: "The whole town is repeating this rumour and you say nothing. I can't agree to this."}
    - {zh: "谣言还没平，你也不开口。我不能答应。", en: "The rumour hasn't died down, and you won't speak. I can't agree."}
  hard_other:
    - {zh: "这事不必再提。", en: "There's no need to raise this again."}
    - {zh: "这个断然不行。", en: "That will not happen."}
  elder_yes:
    - {zh: "明白了。就这么定吧。", en: "I've heard enough. Let it be settled."}
    - {zh: "说得在理，老夫准了。", en: "That's reasonable. I approve."}
  elder_no:
    - {zh: "光凭这些，我还不能拍板。", en: "On this alone, I can't decide yet."}
    - {zh: "话还没说透，我再想想。", en: "It hasn't been said through yet. I'll think it over."}
  objection_withdrawn:
    - {zh: "事情说清楚了，我不再拦着。", en: "It's been made clear. I won't stand in the way any longer."}
    - {zh: "既然当众讲明了，我没有话说。", en: "Since it was made plain in front of everyone, I have nothing against it."}
  witness_in_public:
    - {zh: "我只讲看见的，一个字不添。", en: "I tell only what I saw, and add nothing to it."}
    - {zh: "我看见的就这些，别的不知道。", en: "That's all I saw. I know nothing beyond it."}
  batch_promised:
    - {zh: "应下了，明早送到桥边。", en: "I've agreed. It will be at the bridge tomorrow morning."}
    - {zh: "明天一早，送到桥边。", en: "First thing tomorrow, it goes to the bridge."}
  bamboo_arrived:
    - {zh: "竹料到桥边了，好。", en: "The bamboo is at the bridge. Good."}
    - {zh: "料到了，桥可以动工了。", en: "The materials are here. Work on the bridge can begin."}
  promise_open:
    - {zh: "这事已经应下了，{when}把{amount}根{item}送到桥边。", en: "That's already agreed. I'll have {amount} poles of {item} at the bridge {when}."}
    - {zh: "答应了的事，我记着。{amount}根{item}，{when}送到。", en: "I don't forget what I've agreed to. It's {amount} poles of {item}, delivered {when}."}
  goods_enough:
    - {zh: "桥边的{item}已经够了，别再往那儿送。", en: "There's enough {item} at the bridge. Send no more there."}
    - {zh: "{item}已经够数了。", en: "The {item} is enough already."}
  point_heard:
    - {zh: "这事我不知道。听{name}说起过，你去问问。", en: "I don't know about this. I heard {name} speak of it, so go and ask."}
    - {zh: "没听说过。不过{name}好像知道一些，你去问吧。", en: "I haven't heard of it. But I believe {name} knows something, so go and ask."}
  point_hub:
    - {zh: "这事我不清楚。镇上的消息，你去问{name}。", en: "I'm not sure of this. For the news of the town, ask {name}."}
    - {zh: "我不好乱讲。街坊的事，去问{name}。", en: "I won't guess. For what the neighbours say, go and ask {name}."}
  gift_like:
    - {zh: "{item}，这个我收下了。有心了。", en: "Some {item}. I'll accept them. That's thoughtful."}
    - {zh: "是{item}啊。谢了。", en: "Ah, {item}. Thank you."}
  gift_neutral:
    - {zh: "{item}也好。放下吧。", en: "Some {item}, then. Set that down."}
    - {zh: "你费心了。{item}我收着。", en: "You've gone to trouble. I'll keep the {item}."}
  gift_dislike:
    - {zh: "{item}我不喝。心意我领了。", en: "I don't drink {item}. I accept the thought."}
    - {zh: "{item}就不必了。拿去给用得上的人吧。", en: "No need for {item}. Give it to someone who can use it."}
frames:
  seen:
    - {zh: "老夫亲眼看见的。{line}。", en: "I saw with my own eyes that {line}."}
    - {zh: "{line}。我亲眼看着的。", en: "{line}. I saw it myself."}
  heard:
    - {zh: "这是{teller}跟我讲的。说{line}。", en: "{teller} told me this, that {line}."}
    - {zh: "{teller}跟我提过。说是{line}。", en: "{teller} brought it up with me, saying {line}."}
  unknown:
    - {zh: "族里有人在传。说{line}。", en: "Some in the clan are saying that {line}."}
    - {zh: "这话我是听来的，谁先说的不知道。说{line}。", en: "I only heard this, and I don't know who said it first. The word is that {line}."}
  own:
    - {zh: "依老夫看，{line}。", en: "As I judge it, {line}."}
    - {zh: "想来想去，{line}。", en: "I've turned it over, and I think {line}."}
  guess_own:
    - {zh: "这事还说不准。{hedge}{line}。", en: "Nothing is certain yet. {hedge} {line}."}
    - {zh: "只是这么一说。{hedge}{line}。", en: "It's only a thought. {hedge} {line}."}
  guess_heard:
    - {zh: "{teller}提过一句。{hedge}{line}。", en: "{teller} said something about it. {hedge} {line}."}
    - {zh: "{teller}没把话说全。{hedge}{line}。", en: "{teller} didn't say all of it. {hedge} {line}."}
  guess_unknown:
    - {zh: "不知是谁传出来的。{hedge}{line}。", en: "Who started this I don't know. {hedge} {line}."}
    - {zh: "这话没个来处。{hedge}{line}。", en: "This talk came from nowhere I know of. {hedge} {line}."}
  rival:
    - {zh: "不过{teller}跟我说的不是这样。说{line}。", en: "But {teller} told me otherwise, that {line}."}
    - {zh: "{teller}那里又是一个说法。说是{line}。", en: "{teller} has another account, that {line}."}
  known:
    - {zh: "{line}。镇上无人不晓。", en: "{line}. There is no one in town who does not know it."}
    - {zh: "{line}，这是人人都知道的。", en: "{line}. That is known to everyone."}
hedges:
  - {zh: "多半", en: "I would think"}
  - {zh: "想来", en: "I would infer"}
# What he says by the state of the game (world/bridge/roles.py): a greeting as a talk opens, a last
# word as the manager leaves, and the epilogue of the ending page. The first entry whose conditions
# all hold is the one. He wants both families over the bridge together, so his greeting follows how
# near that is: the clan called to the hall, the truth told, the two houses at one table.
greet:
  - id: new
    when: [{kind: acquainted, is: new}]
    lines:
      - {zh: "你就是我请来的总管？老夫是族长。坐吧，有话慢慢说。", en: "So you're the Manager I sent for? I am the clan elder. Sit down and take your time."}
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "你答应人家的事没办。祠堂里定下的，说话要算数。", en: "You haven't done what you promised. The hall holds that a word given must be kept."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚游灯，族里老老少少都出来了。你辛苦了。", en: "The lantern parade is tonight and the whole clan is out, young and old. You've worked hard."}
  - id: peace
    when: [{kind: flag, flag: reconcile_seen}]
    lines:
      - {zh: "两家坐到一张桌上了。祖宗也该安心了。", en: "The two houses have sat down at one table. The ancestors can rest easy."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "桥的事当众讲明白了。我认这个理。", en: "The bridge business was made plain in front of everyone. I accept it."}
  - id: called
    when: [{kind: called}]
    lines:
      - {zh: "族人都在祠堂等着了。你要说什么，现在说吧。", en: "The clan is waiting in the hall. Whatever you have to say, say it now."}
  - id: kept
    when: [{kind: promised, state: kept}]
    lines:
      - {zh: "你答应的事办到了，老夫记在族簿上了。", en: "You did what you promised. I've written it in the clan book."}
  - id: cleared
    when: [{kind: knows, props: [pr_set_straight]}]
    lines:
      - {zh: "那个谣言当众说清了，我听说了。", en: "I hear that rumour was cleared up in public."}
  - id: again
    when: [{kind: acquainted, is: today}]
    lines:
      - {zh: "你又来了。坐下说。", en: "Back again. Sit down and speak."}
      - {zh: "还有别的事？", en: "Something more?"}
  - id: plain
    lines:
      - {zh: "两家能一起提灯过桥，这灯会才算办成了。", en: "Only when both families cross the bridge with lanterns together will this festival have been worth holding."}
      - {zh: "祠堂里清静，有话慢慢说。", en: "It's quiet in the hall. Say what you need to, and take your time."}
chat:
  - id: broken
    when: [{kind: promised, state: broken}]
    lines:
      - {zh: "失信的事，我不说第二遍。", en: "I won't speak of a broken word twice."}
  - id: festival
    when: [{kind: after, day: 5, hour: 15}]
    lines:
      - {zh: "今晚祠堂的灯和街上的灯一起亮。", en: "Tonight the lanterns in the hall and the lanterns in the street are lit together."}
  - id: truth
    when: [{kind: flag, flag: truth_told}]
    lines:
      - {zh: "讲明白的事，族里会记着。", en: "What has been made plain, the clan will remember."}
  - id: plain
    lines:
      - {zh: "去吧，该办的事别耽搁。", en: "Go on. Don't put off what needs doing."}
      - {zh: "老夫就不送了。", en: "I won't see you out."}
epilogue:
  - id: full_kept
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}, {kind: promised, state: kept}]
    text: {zh: "族长在桥头点亮了头一盏灯，李、周两家一同提灯过了桥。总管答应的事都办到了，族簿上记了一笔。", en: "The elder lit the first lantern at the bridgehead, and the Li and Zhou families crossed together. The Manager kept every promise, and the clan book has a line for it."}
  - id: full
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}, {kind: flag, flag: reconciled}]
    text: {zh: "族长在桥头点亮了头一盏灯。李、周两家的人提着灯，一起走过了石桥。", en: "The elder lit the first lantern at the bridgehead. The Li and Zhou families crossed the Stone Bridge together with lanterns in hand."}
  - id: truth_bridge
    when: [{kind: flag, flag: bridge_fixed}, {kind: flag, flag: truth_told}]
    text: {zh: "族长看着灯过了桥。桥的事讲明白了，两家却还是各走各的。", en: "The elder watched the lanterns cross. The bridge business was settled, but the two families still went their own ways."}
  - id: bridge
    when: [{kind: flag, flag: bridge_fixed}]
    text: {zh: "桥通了，族长却笑不出来。栏杆是怎么断的，族里到底没有定论。", en: "The bridge was open, but the elder could not smile. The clan never settled how the railing broke."}
  - id: detour
    when: [{kind: flag, flag: detour_done}]
    text: {zh: "桥没修好，族长领着族人走了庙后的夹道。", en: "The bridge was not mended, so the elder led the clan through the lane behind the temple."}
  - id: apart
    text: {zh: "桥没通，夹道也没备好。族长在祠堂里坐到很晚，没有点灯。", en: "No bridge and no lane. The elder sat in the hall till late and lit no lamp."}
