# Entities of the town. Ids are English, labels Chinese, label_en the English name. No persona cards
# here: how a person speaks is in content/lines. Each person of the cast has a bio, two sentences in
# each language of what the town says of them. It holds public things only, so it is true whichever
# story of a script is true, and it points the way without giving the answer.
families:
  - {id: fam_li, label: 李家, label_en: "Li family"}
  - {id: fam_zhou, label: 周家, label_en: "Zhou family"}

people:
  - id: li_laotai
    label: 李老太
    label_en: "Granny Li"
    family: fam_li
    bio:
      zh: "李老太守寡多年，独自把李大、李二拉扯大。如今孙辈也在跟前，李家的大事仍要她点头。"
      en: "Granny Li was widowed years ago and raised Li Da and Li Er on her own. Her grandchildren are around her now, and the Li family still comes to her for the big decisions."
  - id: li_da
    label: 李大
    label_en: "Li Da"
    family: fam_li
    bio:
      zh: "李大是李老太的长子，管着家里的竹林和竹料。他做事稳当，拿不定的大事就去问娘。"
      en: "Li Da is Granny Li's elder son. He looks after the bamboo grove and the family's stock, and leaves big decisions to his mother."
  - id: li_er
    label: 李二
    label_en: "Li Er"
    family: fam_li
    bio:
      zh: "李二是李老太的小儿子，在扎灯坊帮工。他糊的灯又圆又亮，镇上不论老少也都愿意跟他说几句。"
      en: "Li Er is Granny Li's younger son and helps out at the lantern workshop, making round, bright lanterns. Young or old, people in town find him easy to talk to."
  - id: shitou
    label: 石头
    label_en: "Shitou"
    family: fam_li
    bio:
      zh: "石头是李大的小儿子。一放学就往河滩跑，嗓门又响，心里有事一会儿就说出来了。"
      en: "Shitou, Li Da's young son, runs down to the riverbank as soon as school lets out. He has a loud voice and can't keep a secret for long."
  - id: li_xiaomei
    label: 李家小妹
    label_en: "Li Xiaomei"
    family: fam_li
    bio:
      zh: "李家小妹是李大的女儿，常到扎灯坊裁纸、糊灯。她手巧，说话也讨街坊喜欢。"
      en: "Li Xiaomei is Li Da's daughter. She often cuts paper and pastes lantern shades at the workshop, and the neighbours like having her around."
  - id: zhou_zhanggui
    label: 周掌柜
    label_en: "Shopkeeper Zhou"
    family: fam_zhou
    bio:
      zh: "周掌柜卖了半辈子木料，修桥要用的木料大半在他家库里。熟人来买，也得把账算清。"
      en: "Shopkeeper Zhou has spent half his life selling timber, and most of the wood for the bridge is in his storehouse. Even friends have to settle the bill."
  - id: zhou_huoji
    label: 周家伙计
    label_en: "Zhou's Clerk"
    family: fam_zhou
    bio:
      zh: "周家伙计帮工好些年了，手脚勤快，听过的话也记得牢。要拿主意的时候，还是一句「掌柜的说了算」。"
      en: "Zhou's Clerk has worked for the family for years, works quickly and remembers what's said. When there's a decision to make, the answer is still \"Ask the shopkeeper.\""
  - id: zhou_dalang
    label: 周家大郎
    label_en: "Zhou Dalang"
    family: fam_zhou
    bio:
      zh: "周家大郎是周掌柜的长子，平日帮家里搬木料、跑买卖。他力气大，脾气也不小，忙完了就往酒肆去。"
      en: "Zhou Dalang is the shopkeeper's elder son and hauls timber and runs errands for the business. He's strong and quick to anger, and heads for the tavern when work's done."
  - id: zhou_niangzi
    label: 周娘子
    label_en: "Madam Zhou"
    family: fam_zhou
    bio:
      zh: "周娘子是周掌柜的妻子，天天去集市走动。谁家有点新鲜事，她听得早，说出去也快。"
      en: "Madam Zhou, the shopkeeper's wife, goes to the market every day. She's quick to hear the neighbours' news and just as quick to pass it on."
  - id: zhou_erlang
    label: 周家二郎
    label_en: "Zhou Erlang"
    family: fam_zhou
    bio:
      zh: "周家二郎是周掌柜的次子，性子温和，常替家里跑集市和河边。两家再怎么吵，他见了李家人也照样问好。"
      en: "Zhou Erlang is the shopkeeper's younger son, a mild fellow who runs errands at the market and by the river. However badly the families quarrel, he still says hello when he sees someone from the Li family."
  - id: old_he
    label: 船夫老何
    label_en: "Boatman He"
    bio:
      zh: "老何在渡口摆了二十多年船，镇上熟人基本都坐过。河上看见的事，老何很少在岸上拿出来讲。"
      en: "Boatman He has worked the crossing for over twenty years, and just about everyone in town has ridden the ferry. Once ashore, the boatman seldom talks about what's been seen out on the river."
  - id: xiao_man
    label: 小满
    label_en: "Xiaoman"
    bio:
      zh: "小满家就在河边，夜里常独自在河滩钓鱼，白天就犯困。大人们听两句，多半只当是孩子话。"
      en: "Xiaoman lives by the river, often fishes alone at night and gets sleepy in the daytime. Most grown-ups put anything Xiaoman says down to a child's imagination."
  - id: gengfu
    label: 更夫
    label_en: "Night Watchman"
    bio:
      zh: "更夫打了十几年更，每晚提着锣沿河走，再过石桥。打更的爱喝两口，街坊听到夜里的事，总要打个折扣。"
      en: "The Night Watchman has called the hours with a gong for over ten years, walking along the river and across the bridge. The watchman likes a drink, so neighbours take those accounts of the night with a grain of salt."
  - id: zhangfang
    label: 账房
    label_en: "Accountant"
    bio:
      zh: "全镇的公账归账房管。修桥、修路、办灯会，钱花在哪儿都能翻账本查到。"
      en: "The Accountant keeps the town's books. Look in the ledger for what was spent on the bridge, the roads or the festival."
  - id: cha_laoban
    label: 茶馆老板娘
    label_en: "Teahouse Keeper"
    bio:
      zh: "老板娘在河边开了十几年茶馆，镇上的事总有人端着茶来讲。一件事在这儿讲过几桌，传出去常会多出几句。"
      en: "The Teahouse Keeper has served tea by the river for over ten years, and people bring the town's news to her tables. Once a story has made the rounds there, it usually leaves with a few details added."
  - id: miaozhu
    label: 庙祝
    label_en: "Temple Keeper"
    bio:
      zh: "庙祝在镇上的小庙里守了大半辈子香火。庙后的夹道平时锁着，钥匙就在她手里。"
      en: "The Temple Keeper has tended the little temple for most of her life. She keeps the key to the lane behind it, which is usually locked."
  - id: zuzhang
    label: 族长
    label_en: "Clan Elder"
    bio:
      zh: "澄溪论辈分数族长最高，族里的规矩、祠堂的事都由他拿主意。这回请外乡人管灯会，也是他定下的。"
      en: "As Chengxi's most senior elder, he settles clan rules and manages the hall. This year he chose to bring in an outsider to run the festival."
  - id: mujiang
    label: 木匠
    label_en: "Carpenter"
    bio:
      zh: "镇上有谁的门窗桌椅坏了，就去扎灯坊的工台找木匠。石桥要换木料，也少不了木匠动手。"
      en: "If a door, window, table or chair breaks, people find the Carpenter at the bench in the lantern workshop. The bridge will need the Carpenter's help if any timber has to be replaced."
  - id: zhadeng_shifu
    label: 扎灯师傅
    label_en: "Lantern Maker"
    bio:
      zh: "扎灯师傅做了三十年灯，每年走在游灯队伍最前头的主灯都是她扎的。今年要用的灯已经做了一半。"
      en: "The Lantern Maker has been at it for thirty years. She makes the main lantern that leads the parade each year, and this year's lanterns are already half done."
  - id: sishu_xiansheng
    label: 私塾先生
    label_en: "Schoolmaster"
    bio:
      zh: "私塾先生教孩子念书识字，还办《镇报》。街坊里识字的人见一件事登了报，多半就当真了。"
      en: "The Schoolmaster teaches the children to read and write and puts out the Town Gazette. People in town who can read tend to believe what they see in it."
  - id: apprentice
    label: 学徒阿福
    label_en: "Apprentice Afu"
  - id: stranger
    label: 外乡人
    label_en: "The Stranger"
  - id: huolang
    label: 邻镇货郎
    label_en: "Peddler from the Next Town"

