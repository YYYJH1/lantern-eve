# The cast of the scenario `bridge` in version 0: twenty named people of Chengxi town, seen
# through the network they form. Every id is unique. An id that is in
# entities.yaml must carry the same names and family there. The other ids are cast-only until a
# script needs them.
#
# network tags (not exclusive, and none is shown to the player):
#   hub          knows many people, passes news on fast and bends it often
#   bridge       links the two families, so a rumour crosses over through them
#   gatekeeper   trusted, weighty, and slow to pass anything on
#   witness      often sees the truth, but the grown-ups do not quite believe them
#
# traits are ints in [0, 100]: gossip (how readily they pass a thing on), conformity (how much
# they follow their own group), suspicion (how readily they think ill of others), warmth (how
# readily they think well of the listener). ops are the weights of the four operators that
# retell a proposition (level, sharpen, assimilate, fill) and add up to 100.
#
# A routine is a list of (hour, act, place) on the 24-hour clock. The day runs from 06:00 and
# the first entry is at 06:00. An entry holds until the next one, and the last holds until
# 06:00 again. The place of the last entry is home, where the person sleeps. Everyone but a
# night_shift person goes home when the night begins, whatever the routine says.
#
# holdings are the stocks a person keeps: the item, how many bundles, and where they lie.

id: bridge_v0
scenario: bridge
script: broken_bridge
size: 20

items:
  - {id: bamboo, zh: 竹料, en: Bamboo}
  - {id: timber, zh: 木料, en: Timber}
  - {id: tools, zh: 工具, en: Tools}

activities:
  - {id: sleep, zh: 睡觉, en: Sleeping}
  - {id: meal, zh: 吃饭, en: Having a meal}
  - {id: work, zh: 干活, en: Working}
  - {id: tea, zh: 喝茶, en: Having tea}
  - {id: drink, zh: 喝酒, en: Drinking}
  - {id: chat, zh: 闲聊, en: Chatting}
  - {id: pray, zh: 上香, en: Praying}
  - {id: teach, zh: 教书, en: Teaching}
  - {id: study, zh: 读书, en: Studying}
  - {id: play, zh: 玩耍, en: Playing}
  - {id: fish, zh: 钓鱼, en: Fishing}
  - {id: ferry, zh: 摆渡, en: Ferrying}
  - {id: patrol, zh: 打更, en: On the night round}
  - {id: council, zh: 议事, en: In council}
  - {id: rest, zh: 歇着, en: Resting}
  # what a person does when something other than the routine decides
  - {id: walk, zh: 赶路, en: Walking, system: true}
  - {id: carry, zh: 搬东西, en: Carrying a load, system: true}
  - {id: shelter, zh: 躲雨, en: Sheltering from the rain, system: true}

