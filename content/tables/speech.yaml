# What the checker of a model's reply knows (lantern_core.cognition.contract): the closed lists
# of words it looks for in a free line, the mood and the form of address a reply may carry, and
# the words that name an entity, an act or a motive in other ways than the table of lines does.
#
# Every list is closed and short on purpose. The check is a match of words, so it stops the
# usual ways of saying a thing and not every way. A word is matched as written, in either
# language: Chinese by substring, English by whole word, ignoring case. A longer word wins over
# a shorter one inside it, and a text is first stripped of full-width forms and curly quotes.
#
# words    the six classes of words that need an act behind them (see the module docstring of
#          the contract). `mask` lists the harmless compounds that hold a word of the class, such
#          as 不错 for 不, which are ignored when the class is scanned.
# events   for each predicate of the table, the words that say the act itself. A word may sit
#          under several predicates (broke says damaged and broken), and it is licensed by any.
#          A predicate whose act is carried by the names it holds (at, located) may have few.
# motives  for each motive of the table, the words that give that reason.
# aliases  other names for an entity: how people really say it. The labels of the table of
#          lines are known already. `player` is the festival manager.
# secrets  words that a person keeps to themselves, over and above what the core works out from
#          what they guard.
# moods    the mood words a reply may carry, each with the interjection the core opens its own
#          sentence with. addresses: the forms of address, put at the end of the sentence.

moods:
  plain: {zh: "", en: ""}
  warm: {zh: "好啊。", en: "Good."}
  wary: {zh: "嗯。", en: "Hm."}
  sad: {zh: "唉。", en: "Oh dear."}
  curt: {zh: "哼。", en: "Hmph."}
  eager: {zh: "哎呀！", en: "Oh!"}

addresses:
  none: {zh: "", en: ""}
  manager: {zh: "总管", en: "Manager"}

