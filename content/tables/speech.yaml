      "不一定", "难说", "看样子", "依我看", "我以为", "我觉得是", "我感觉", "我想", "我寻思",
      "我推算", "我敢打赌", "我拿茶壶担保", "在下以为", "小的想", "老夫料想", "老身想来", "准是",
