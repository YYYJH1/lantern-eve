# What the townsfolk say, in Chinese and English: one line per predicate of the closed table, a
# phrase per motive, and the frames that mark how a thing is known (seen, heard from somebody,
# heard from nobody, worked out, guessed). The core joins them (lantern_core.cognition.lines),
# so a line never says more than the prop it comes from.
#
# A line is a template. {who} {whom} {what} {where} are the slots of the predicate, filled with
# the names of the entities, and {when} is the time of the span, if the prop has one that has a
# word here (see `when`). Text in [square brackets] is dropped when a slot inside it has no
# value, which is how an optional slot, or a missing time, leaves no trace in the sentence.
# Every required slot of a predicate is written outside the brackets, every optional one inside.
# `neg` is the line for a denial. A motive is added to the end of a line in the narration, after a
# comma, and is a sentence of its own when a person speaks (`motive_said`).
#
# A frame wraps a finished line: {line}, and {teller} (the person who told the speaker) and
# {hedge} where the frame has them. English lines start in lower case so that a frame can put
# them after "that"; the core capitalises the sentence it hands out.

predicates:
  at:
    zh: "{who}[{when}]在{where}"
    en: "{who} was at {where}[ {when}]"
    neg:
      zh: "{who}[{when}]没去{where}"
      en: "{who} did not go to {where}[ {when}]"
    # said in place of the line when the place is the home of the person (``Lines.homes``)
    home:
      zh: "{who}[{when}]在家"
      en: "{who} was at home[ {when}]"
      neg:
        zh: "{who}[{when}]没在家"
        en: "{who} was not at home[ {when}]"
  came_from:
    zh: "{who}[{when}]是从{where}来的"
    en: "{who} came from {where}[ {when}]"
    neg:
      zh: "{who}不是从{where}来的"
      en: "{who} did not come from {where}"
  fled_from:
    zh: "{who}[{when}]从{where}跑掉了"
    en: "{who} ran off from {where}[ {when}]"
    neg:
      zh: "{who}没从{where}跑掉"
      en: "{who} did not run off from {where}"
  looked_for:
    zh: "{who}[{when}][在{where}]找{what}"
    en: "{who} was looking for {what}[ at {where}][ {when}]"
    neg:
      zh: "{who}[{when}]没[在{where}]找{what}"
      en: "{who} was not looking for {what}[ at {where}][ {when}]"
  wanted:
    zh: "有人在找{who}"
    en: "someone is looking for {who}"
    neg:
      zh: "没人在找{who}"
      en: "nobody is looking for {who}"
  damaged:
    zh: "{who}[{when}][在{where}]把{what}弄坏了"
    en: "{who} broke {what}[ at {where}][ {when}]"
    neg:
      zh: "{who}[{when}]没[在{where}]把{what}弄坏"
      en: "{who} did not break {what}[ at {where}][ {when}]"
  flood_damaged:
    zh: "{what}是秋汛冲坏的"
    en: "{what} was washed out by the flood"
    neg:
      zh: "{what}不是秋汛冲坏的"
      en: "{what} was not washed out by the flood"
  repaired:
    zh: "{who}[{when}]把{what}修好了"
    en: "{who} mended {what}[ {when}]"
    neg:
      zh: "{who}没修过{what}"
      en: "{who} did not mend {what}"
  took:
    zh: "{who}[{when}][在{where}]拿走了{what}"
    en: "{who} took {what}[ at {where}][ {when}]"
    neg:
      zh: "{who}没拿走{what}"
      en: "{who} did not take {what}"
  stole:
    zh: "{who}[{when}][在{where}]偷走了{what}"
    en: "{who} stole {what}[ at {where}][ {when}]"
    neg:
      zh: "{who}没偷{what}"
      en: "{who} did not steal {what}"
  hid:
    zh: "{who}[{when}][在{where}]把{what}藏起来了"
    en: "{who} hid {what}[ at {where}][ {when}]"
    neg:
      zh: "{who}没把{what}藏起来"
      en: "{who} did not hide {what}"
  made:
    zh: "{what}是{who}亲手做的"
    en: "{who} made {what} by hand"
    neg:
      zh: "{what}不是{who}亲手做的"
      en: "{who} did not make {what} by hand"
  gave:
    zh: "{who}[{when}]把{what}给了{whom}"
    en: "{who} gave {what} to {whom}[ {when}]"
    neg:
      zh: "{who}没把{what}给{whom}"
      en: "{who} did not give {what} to {whom}"
  refused:
    zh: "{who}[{when}]回绝了{whom}"
    en: "{who} turned {whom} down[ {when}]"
    neg:
      zh: "{who}没回绝{whom}"
      en: "{who} did not turn {whom} down"
  drank:
    zh: "{who}[{when}][在{where}]喝了酒"
    en: "{who} was drinking[ at {where}][ {when}]"
    neg:
      zh: "{who}[{when}]没[在{where}]喝酒"
      en: "{who} was not drinking[ at {where}][ {when}]"
  broken:
    zh: "{what}坏了"
    en: "{what} is broken"
    neg:
      zh: "{what}没坏"
      en: "{what} is not broken"
  missing:
    zh: "{what}不见了"
    en: "{what} has gone missing"
    neg:
      zh: "{what}还在"
      en: "{what} is still there"
  scratched:
    zh: "{what}上有新刮痕"
    en: "{what} has fresh scratches"
    neg:
      zh: "{what}上没有刮痕"
      en: "{what} has no scratches"
  flooded:
    zh: "[{when}]{where}的水涨了"
    en: "{where} rose[ {when}]"
    neg:
      zh: "{where}的水没涨"
      en: "{where} did not rise"
  located:
    zh: "{what}在{where}"
    en: "{what} is at {where}"
    neg:
      zh: "{what}不在{where}"
      en: "{what} is not at {where}"
  owns:
    zh: "{what}是{who}的"
    en: "{what} belongs to {who}"
    neg:
      zh: "{what}不是{who}的"
      en: "{what} does not belong to {who}"
  left_at:
    zh: "{what}[{when}]落在了{where}"
    en: "{what} was left at {where}[ {when}]"
    neg:
      zh: "{what}没落在{where}"
      en: "{what} was not left at {where}"
  lied:
    zh: "{who}撒了谎"
    en: "{who} lied"
    neg:
      zh: "{who}没撒谎"
      en: "{who} did not lie"
  broke_promise:
    zh: "{who}说话不算数"
    en: "{who} broke their word"
    neg:
      zh: "{who}说话算数"
      en: "{who} keeps their word"
  # two sentences, what was seen first and then that it was cleared, in both languages
  set_straight:
    zh: "{who}只看见{whom}在{where}找{what}。这事当众说清了"
    en: "{who} only saw {whom} looking for {what} at {where}. That has been made clear in public"
    neg:
      zh: "{who}只看见{whom}在{where}找{what}。这事还没人当众说清"
      en: "{who} only saw {whom} looking for {what} at {where}. Nobody has made that clear in public yet"

# Said after the line, set off by a comma, and in a sentence of its own when a person speaks (below), so
# each reads after "it was" in English and after 是 in Chinese.
motives:
  accident: {zh: 是不小心的, en: by accident}
  on_purpose: {zh: 是故意的, en: on purpose}
  jealousy: {zh: 是眼红人家出风头, en: out of envy}
  protect: {zh: 是想护着谁, en: to protect someone}
  greed: {zh: 是图钱, en: for the money}
  play: {zh: 是闹着玩的, en: just for fun}
  spite: {zh: 是存心使坏, en: out of spite}
  save_face: {zh: 是要面子, en: to save face}
  fear: {zh: 是怕担责任, en: for fear of the blame}
  pride: {zh: 是傲气上来了, en: out of pride}
  reckless: {zh: 是喝多了胡闹, en: a reckless drunken prank}
  debt: {zh: 是欠了债, en: because of a debt}

# The motive as a sentence of its own, said after the line when a person speaks: {motive} is the phrase
# above. `told` follows what the speaker was told (they say, it was), `own` what the speaker saw or
# worked out, `guess` what the speaker only guesses, in the other of the speaker's hedges ({hedge}),
# so that the hedge of the line is not said again. The frame closes the sentence with its full stop.
motive_said:
  told: {zh: "还说{motive}", en: "They say it was {motive}"}
  own: {zh: "那{motive}", en: "That was {motive}"}
  guess: {zh: "{hedge}{motive}", en: "{hedge} it was {motive}"}

# How a place or a thing is said inside a sentence, where it is not said by the name the map or the
# list of things gives it: the bridge is 桥边 in "李二昨晚在桥边" (the map says 石桥), the water under
# it 桥下, and in English the railing is "the bridge railing", not the name of the item.
forms:
  p_bridge: {zh: 桥边, en: the bridge}
  p_under_bridge: {zh: 桥下, en: the river under the bridge}
  t_rail: {zh: 栏杆, en: the bridge railing}
  t_he_boat: {zh: 渡船, en: the boat}
  t_li_er_lantern: {zh: 掉进水里的灯笼, en: the lost lantern}

# A form that one predicate says otherwise, over the form above: where a thing stands, the railing
# is on the bridge (栏杆在桥上, "the railing is at the bridge"), while a person who was there was by
# it (李二昨晚在桥边).
predicate_forms:
  located:
    p_bridge: {zh: 桥上, en: the bridge}
    t_rail: {zh: 栏杆, en: the railing}

# The time of a span that has a word: it ended before the game began (a night, or longer), or
# in the small hours of the first morning. A span that runs on into the game has none.
when:
  last_night: {zh: 昨晚, en: last night}
  lately: {zh: 这几天, en: over the past few days}
  this_morning: {zh: 今早, en: this morning}

# How the speaker knows it. seen: the speaker saw it (worded so that it also fits what the speaker
# did themselves). heard: somebody named told the speaker.
# unknown: the speaker names nobody. own: the speaker's own conclusion. A guess has its own
# three, since the hedge is part of what is said. rival: said after the belief the speaker holds,
# of an account somebody told them and they did not take in.
frames:
  seen: {zh: "{line}。", en: "{line}."}
  heard: {zh: "{teller}跟我说，{line}。", en: "{teller} told me that {line}."}
  unknown: {zh: "听人说，{line}。", en: "I've heard it said that {line}."}
  own: {zh: "照我看，{line}。", en: "If you ask me, {line}."}
  guess_own: {zh: "{hedge}{line}。", en: "{hedge} {line}."}
  guess_heard: {zh: "{teller}猜，{line}。", en: "{teller} guessed that {line}."}
  guess_unknown: {zh: "有人猜，{line}。", en: "Some people guess that {line}."}
  rival: {zh: "可{teller}跟我说的是，{line}。", en: "But {teller} told me that {line}."}
  # said in place of `seen` of a thing the whole town knows (the predicates under `known`)
  known: {zh: "{line}，镇上谁都知道。", en: "{line}. Everyone in town knows that."}

# The predicates whose facts the whole town knows: whose a thing is and where it stands. What a
# person saw of them is said with the frame `known`, not as a thing seen.
known: [located, owns]

# The words that mark a guess. A speaker uses one of them in each language.
hedges:
  zh: [我猜, 怕是]
  en: [I guess, I'd say]

# A hedge of two characters that ends in 是, as it is said before a sentence with a 是 of its own
# (怕是 + 渡船是老何的 is said 恐怕渡船是老何的). A longer hedge just leaves its 是 out (八成是 → 八成).
bare_hedges: {怕是: 恐怕, 许是: 或许}

# The people whose English name is a bare role and takes "the" in a sentence (the Night
# Watchman). Families, things and places get their article from the shape of the name.
the: [gengfu, zhangfang, cha_laoban, miaozhu, zuzhang, mujiang, zhadeng_shifu, sishu_xiansheng, huolang]
